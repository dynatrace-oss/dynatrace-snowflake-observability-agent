[pytest]
pythonpath = src
addopts = --ignore-glob=**/otel_*_test.py
log_cli = false
log_cli_level = DEBUG
markers =
    xdist_group: mark test to be executed in named group
    slow: mark test as slow (build/package integration tests, skipped by default)
    live: mark test as requiring a live Dynatrace tenant and dtctl authentication