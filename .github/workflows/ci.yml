name: Quality Checks

on:
  push:
    branches: ["devel", "main", "dev/*", "release/*", "feature/*", "hotfix/*"]
  pull_request:
    branches: ["devel", "main", "dev/*", "release/*", "feature/*", "hotfix/*"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install flake8 black==26.3.1 sqlfluff yamllint pylint check-jsonschema
          npm install -g markdownlint-cli2

      - name: Lint Python
        run: flake8 --config=.flake8 src/ test/ || exit 1

      - name: Format Python
        run: black --check src/ test/ || exit 1

      - name: Pylint Python
        run: |
          pylint src/
          pylint test/

      - name: Lint SQL
        run: sqlfluff lint src/*.sql --ignore parsing --disable-progress-bar || exit 1

      - name: Lint YAML
        run: yamllint src || exit 1

      - name: Lint Markdown
        run: markdownlint-cli2 '[^.]*/**/*.md' '*.md' --config .markdownlint-cli2.jsonc || exit 1

      - name: Lint BOM files
        run: find src -name "bom.yml" -exec sh -c 'printf "%-50s " "$$1";
          check-jsonschema --schemafile test/src-bom.schema.json "$$1"' _ {} \;

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint Shell
        run: shellcheck --severity=warning scripts/deploy/*.sh scripts/dev/*.sh
          scripts/test/*.sh test/bash/*.bats

  test-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m venv .venv && .venv/bin/pip install -r requirements.txt

      - name: Run TestDocumentation tests
        run: pytest test/core/test_documentation.py -k "TestDocumentation" --skip-semdict-regen

  test-bash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-mock flake8 black==26.3.1 pylint
          python -m venv .venv && .venv/bin/pip install -r requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq gawk pandoc zip

      - name: Run bash tests
        run: pytest test/core/test_bash_scripts.py -v

  test-semdict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m venv .venv && .venv/bin/pip install -r requirements.txt

      - name: Run semdict tests
        run: |
          pytest test/core/test_export_semantics.py test/core/test_semdict_export_completeness.py test/core/test_semdict_output_compliance.py -v
          pytest "test/core/test_bash_scripts.py::test_bash_script[test_ci_export]" -v

      - name: Check docs/semantic-dictionary freshness
        run: |
          ./scripts/dev/build_semantic_export.sh --output-dir docs/semantic-dictionary
          git diff --exit-code docs/semantic-dictionary/ || \
            (echo "docs/semantic-dictionary/ is stale — run 'make semantic-dictionary' and commit" && exit 1)

  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Git LFS
        run: git lfs install

      - name: Pull LFS objects
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-mock

      - name: Install JQ (for tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run core tests
        run: |
          pytest test/core/test_config.py -k "TestConfig" --skip-semdict-regen
          pytest test/core/test_util.py -k "TestUtil" --skip-semdict-regen
          pytest test/core/test_views_structure.py -k "TestViews" --skip-semdict-regen
          pytest test/core/test_connector.py -k "TestTelemetrySender" --skip-semdict-regen
          pytest test/core/test_performance.py -k "TestIsNanOrNone" --skip-semdict-regen
      - name: Run OTEL tests
        run: |
          pytest test/otel/test_events.py -k "TestEvents"
          pytest test/otel/test_otel_manager.py -k "TestOtelManager"

  test-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Git LFS
        run: git lfs install

      - name: Pull LFS objects
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-mock

      - name: Install JQ (for tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run plugin tests
        run: pytest test/plugins/
