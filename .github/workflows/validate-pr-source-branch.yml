name: Validate PR Source Branch

on:
  pull_request:
    branches:
      - main

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch name
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"

          if [[ $SOURCE_BRANCH =~ ^(hotfix|release)/ ]]; then
            echo "✓ Source branch '$SOURCE_BRANCH' is allowed (matches hotfix/* or release/*)"
            exit 0
          else
            echo "✗ Source branch '$SOURCE_BRANCH' is not allowed"
            echo "Only PRs from 'hotfix/*' or 'release/*' branches can be merged to main"
            exit 1
          fi
