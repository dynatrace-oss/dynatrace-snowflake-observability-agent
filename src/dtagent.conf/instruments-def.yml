#  * Catalog of instrumentation known to Dynatrace Snowflake Observability Agent
dimensions:
  db.system:
    __description: "The database management system (DBMS) product being used. It is always 'snowflake'"
    __example: "snowflake"
  deployment.environment:
    __description: >-
      Deprecated alias for deployment.environment.name. The deployment environment,
      e.g., production, staging, or development. Will be removed in release 1.3.0.
    __example: "PROD"
    __deprecated: "Use deployment.environment.name instead."
  deployment.environment.name:
    __description: >-
      The deployment environment name (OTel semconv canonical field), e.g., production,
      staging, or development. Emitted alongside deployment.environment during the deprecation window.
    __example: "PROD"
  deployment.environment.tag:
    __description: "Optional tag for the deployment environment in multitenancy mode"
    __example: "SA080"
  host.name:
    __description: "The name of the host."
    __example: "mysnowflake.us-east-1.snowflakecomputing.com"
  service.name:
    __description: "The name of the service."
    __example: "mysnowflake.us-east-1"
  telemetry.exporter.name:
    __description: "The name of the telemetry exporter. It is always 'dynatrace.snowagent'"
    __example: "dynatrace.snowagent"
  telemetry.exporter.version:
    __description: "The version of the telemetry exporter."
    __example: "0.8.0.17308403933"
  dsoa.run.context:
    __description:
      "The name of the Dynatrace Snowflake Observability Agent plugin (or part of plugin) used to produce the telemetry (logs, traces,
      metrics, or events)."
    __example: "query_history"
#  * Attribute definitions
#  * KEY                  - will be matched against ATTRIBUTES object with measurements prepared for sending
#  * VALUE[description]   - description of the attributes -
#                           in the future we should rather update semantic dictionary instead of pushing it constantly
#  * VALUE[example]       - the example of attribute value
attributes:
  anomaly.detector:
    __semdict: new
    __description: >-
      Identifies the DSOA workflow or plugin that detected the anomaly. Values follow the
      ``dsoa.<workflow_name>`` convention (e.g., ``dsoa.data_volume_anomaly``) except for
      the failed-login detector which uses ``dsoa.failed_login_detection``.
    __example: "dsoa.data_volume_anomaly"
  anomaly.direction:
    __semdict: new
    __description: >-
      Direction of the anomaly relative to the Davis AI baseline: ``above`` when the metric
      exceeded the upper bound, ``below`` when it dropped under the lower bound.
    __example: "above"
  anomaly.subject:
    __semdict: new
    __description: >-
      High-level category classifying the anomaly subject within its detector. Specific
      values are defined per workflow (e.g., ``login`` / ``session`` / ``query_count`` /
      ``data_scan`` for security-anomaly-detection; ``unavailable`` / ``disappeared`` /
      ``volume_drop`` for shares-broken-detection).
    __example: "login"
  metric.key:
    __semdict: ref
    __description: >-
      The Dynatrace metric selector key for the metric that triggered the anomaly event.
      References an existing metric in the Dynatrace Semantic Dictionary.
    __example: "snowflake.credits.quota.used_pct"
  dsoa.run.id:
    __description:
      "Unique ID of each execution of the Dynatrace Snowflake Observability Agent plugin. It can be used to differentiate between telemetry
      produced between two executions, e.g., to calculate the change in the system."
    __example: "4aa7c76c-e98c-4b8b-a5b3-a8a721bbde2d"
  snowflake.event.type:
    __description: "Type of (timestamp based) event"
    __example: "snowflake.table.update"
  observed_timestamp:
    __description: "The timestamp (in epoch nanoseconds) when the event was observed."
    __example: "1741768500000000000"

#  * Metric definitions
#  * KEY                  - will be matched against METRICS object with measurements prepared for sending
#  * VALUE[description]   - description of the metrics -
#                           in the future we should rather update semantic dictionary instead of pushing it constantly
#  * VALUE[unit]          - the unit of the metric
metrics:
  dsoa.agent.memory.peak_rss:
    __description: "Peak resident set size (RSS) of the agent process in megabytes, sampled after each plugin context run."
    __example: "42.5"
    unit: MB
    displayName: Agent Peak Memory (RSS)
