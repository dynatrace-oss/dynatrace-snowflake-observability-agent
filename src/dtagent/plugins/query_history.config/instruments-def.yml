  db.snowflake.views:
    __stability: stable
    __semdict: new
    __semdict_note: "Fully proprietary; no OTel analog."
    __example: ["user_view"]
    __type: string[]
    displayName: Snowflake views used in query
    __description: The views involved in the query.
  event.id:
    __semdict: ref
    __example: 13825839647097210
    __type: long
    displayName: Login event ID
    __description: The login event ID associated with the query.
  snowflake.session.id:
    __semdict: new
    __stability: experimental
    __example: "1234567890"
    __type: string
    displayName: Snowflake session ID
    __description: The session ID during which the query was executed.
  dsoa.debug.span.events.added:
    __stability: stable
    __type: long
    displayName: DSOA debug span events added
    __example: 5
    __description: Internal debug field indicating the number of span events successfully added to the given span.
    __span_only: true
  dsoa.debug.span.events.failed:
    __stability: stable
    __type: long
    displayName: DSOA debug span events failed
    __example: 1
    __description: Internal debug field indicating the number of span events that failed to be added to the given span.
    __span_only: true
  dsoa.plugins.query_history.obfuscation_mode:
    __stability: experimental
    __example: "none"
    __type: string
    displayName: DSOA query history obfuscation mode
    __enum:
      allow_custom_values: false
      members:
        - id: "none"
          value: "none"
          brief: No obfuscation applied.
        - id: "literals"
          value: "literals"
          brief: String and numeric literals are replaced with `?`.
        - id: "full"
          value: "full"
          brief: Entire query text is replaced with `[OBFUSCATED]`.
    __is_defined_at_runtime: true
    __description: |
      Configuration key controlling query text obfuscation mode applied to `db.query.text` and `snowflake.error.message`.
      Possible values: `none` (no transformation), `literals` (replace string and numeric literals with `?`),
      `full` (replace entire query text with `[OBFUSCATED]`).
    __semdict_note: |
      Note: this is the SD-catalog attribute name; the actual config path read at runtime is
      `plugins.query_history.obfuscation_mode` (no `dsoa.` prefix) — see `050_f_get_query_history.sql`.
  dsoa.plugins.query_history.track_ddl_changes:
    __stability: experimental
    __type: boolean
    displayName: DSOA query history DDL change tracking indicator
    __example: false
    __is_defined_at_runtime: true
    __description: |
      EXPERIMENTAL. When `true`, the plugin surfaces DDL change attribution attributes
      (`snowflake.object.type`, `.id`, `.name`, `snowflake.object.ddl.operation`,
      `snowflake.object.ddl.properties`) on `query_history` events whose `ACCESS_HISTORY`
      row carries an `OBJECT_MODIFIED_BY_DDL` payload. Covers database-object DDL only
      (tables, views, schemas, procedures). Warehouse and resource-monitor DDL does not
      populate `OBJECT_MODIFIED_BY_DDL` and is not affected by this setting — use
      `db.operation.name` for warehouse change detection. Default `false` preserves
      backward-compatible behavior. May be refactored into a dedicated plugin in a future
      release.
    __semdict_note: |
      Note: this is the SD-catalog attribute name; the actual config path is
      `plugins.query_history.track_ddl_changes` (no `dsoa.` prefix). Not currently wired up
      to any reader in code — setting this has no runtime effect yet.
  snowflake.object.type:
    __type: string
    displayName: Snowflake object type
    __stability: stable
    __example: Table
    __description: |
      Type of object modified by the DDL operation captured for this query, as recorded by
      Snowflake in `ACCESS_HISTORY.OBJECT_MODIFIED_BY_DDL.objectDomain` (e.g. `Table`,
      `View`, `Schema`, `Database`). Populated only when
      `plugins.query_history.track_ddl_changes=true` and Snowflake recorded a structured
      DDL payload for the query. Does not apply to warehouse or resource-monitor DDL —
      use `db.operation.name` for warehouse change detection.
    __enum:
      allow_custom_values: true
      members:
        - id: table
          value: Table
          brief: >-
            A base, temporary, or external table object that stores or references tabular data, as reported in
            ACCESS_HISTORY.OBJECT_MODIFIED_BY_DDL.
        - id: view
          value: View
          brief: A standard or secure view object whose definition is stored as a query and evaluated at access time.
        - id: schema
          value: Schema
          brief: A namespace container within a database used to group tables, views, and other objects.
        - id: database
          value: Database
          brief: The top-level namespace container in Snowflake; groups schemas and all their child objects.
        - id: procedure
          value: Procedure
          brief: A callable stored procedure object encapsulating SQL or Snowpark logic that can be invoked via CALL.
  snowflake.object.id:
    __stability: stable
    __type: long
    displayName: Snowflake object ID
    __example: 1234567890
    __description: |
      Internal Snowflake identifier of the object modified by the DDL operation. Populated
      only when `plugins.query_history.track_ddl_changes=true` — see `snowflake.object.type`.
      Does not apply to warehouse or resource-monitor DDL — use `db.operation.name` for
      warehouse change detection.
  snowflake.object.name:
    __type: string
    displayName: Snowflake object name
    __stability: stable
    __example: DTAGENT_WH
    __description: |
      Fully-qualified name of the object modified by the DDL operation. Populated only
      when `plugins.query_history.track_ddl_changes=true` — see `snowflake.object.type`.
      Does not apply to warehouse or resource-monitor DDL — use `db.operation.name` for
      warehouse change detection.
  snowflake.object.ddl.operation:
    __type: string
    displayName: Snowflake DDL operation
    __stability: stable
    __example: ALTER
    __description: |
      DDL operation type (`CREATE`, `ALTER`, `DROP`, `UNDROP`, `REPLACE`). Populated only
      when `plugins.query_history.track_ddl_changes=true` — see `snowflake.object.type`.
      Does not apply to warehouse or resource-monitor DDL — use `db.operation.name` for
      warehouse change detection.
    __enum:
      allow_custom_values: true
      members:
        - id: create
          value: CREATE
          brief: Creates a new database object; when used as CREATE OR REPLACE, atomically drops and recreates.
        - id: alter
          value: ALTER
          brief: Modifies the properties or definition of an existing database object without recreating it.
        - id: drop
          value: DROP
          brief: Removes a database object; for tables, data enters Fail-safe and can be recovered via UNDROP within the retention period.
        - id: undrop
          value: UNDROP
          brief: Restores a previously dropped table, schema, or database from Fail-safe within the Time Travel retention window.
        - id: replace
          value: REPLACE
          brief: Equivalent to CREATE OR REPLACE; atomically drops and recreates the object, resetting its definition.
  snowflake.object.ddl.properties:
    __stability: stable
    __type: string
    displayName: Snowflake DDL property changes
    __semdict_note: "Serialized JSON object stored as string in Grail. Contains DDL object property changes. Parse with parseJson() in DQL."
    __example: '{"WAREHOUSE_SIZE": {"value": "LARGE"}, "AUTO_SUSPEND": {"value": 600}}'
    __description: |
      JSON object describing the property delta recorded by Snowflake for the DDL
      operation. Keys are sensitive property identifiers (e.g. `WAREHOUSE_SIZE`,
      `MIN_CLUSTER_COUNT`, `MAX_CLUSTER_COUNT`, `SCALING_POLICY`, `RESOURCE_MONITOR`,
      `AUTO_SUSPEND`). Populated only when `plugins.query_history.track_ddl_changes=true` —
      see `snowflake.object.type`. Does not apply to warehouse or resource-monitor DDL —
      use `db.operation.name` for warehouse change detection.
  snowflake.cluster_number:
    __type: long
    displayName: Snowflake warehouse cluster number
    __example: 1
    __description: The warehouse cluster number associated with the query.
  snowflake.cost_attribution.period_end:
    __type: long
    displayName: Snowflake cost attribution period end
    __example: 1730844667000000000
    __description: End of the cost attribution summary window.
  snowflake.cost_attribution.period_start:
    __type: long
    displayName: Snowflake cost attribution period start
    __example: 1730841067000000000
    __description: Start of the cost attribution summary window.
  snowflake.database.id:
    __type: long
    displayName: Snowflake database ID
    __stability: stable
    __example: 123456
    __description: The unique identifier of the database involved in the query.
    __semdict_note: >-
      ACCOUNT_USAGE.DATABASES supplies related fields (name, owner, owner_role_type, type, is_transient, lifecycle, retention_time, comment)
      but these should be populated by a future inventory plugin, not query_history (≈180-min latency + cost). In query_history,
      snowflake.database.id stays a foreign key only.
  snowflake.error.code:
    __type: string
    displayName: Snowflake error code
    __stability: stable
    __example: ERR123
    __description: The error code returned by the operation, if any.
  snowflake.error.message:
    __type: string
    displayName: Snowflake error message
    __stability: stable
    __example: Syntax error
    __description: The error message returned by the operation, if any.
  snowflake.query.with_operator_stats:
    __type: boolean
    displayName: Snowflake query execution plan telemetry indicator
    __example: true
    __description: Indicates if the query was executed with operator-level statistics enabled.
  snowflake.query.accel_est.estimated_query_times:
    __stability: stable
    __type: string
    displayName: Snowflake query acceleration estimated execution times
    __semdict_note: >-
      Serialized JSON object stored as string in Grail. Contains estimated query execution times per scale factor. Parse with parseJson() in
      DQL.
    __example: '{ "scaleFactor1": 10, "scaleFactor2": 5 }'
    __description:
      Object that contains the estimated query execution time in seconds for different query acceleration scale factors. If the status for
      the query is not eligible for query acceleration, this object is empty.
  snowflake.query.accel_est.status:
    __type: string
    displayName: Snowflake query acceleration status
    __stability: stable
    __example: eligible
    __description: >-
      Indicates whether the query is eligible to benefit from the query acceleration service.
    __enum:
      allow_custom_values: true
      members:
        - id: eligible
          value: eligible
          brief: Query is eligible for query acceleration.
        - id: ineligible
          value: ineligible
          brief: Query is not eligible for query acceleration.
        - id: accelerated
          value: accelerated
          brief: Query was accelerated by the service.
        - id: invalid
          value: invalid
          brief: Query acceleration status could not be determined.
  snowflake.query.accel_est.upper_limit_scale_factor:
    __stability: stable
    __type: long
    displayName: Snowflake query acceleration upper limit scale factor
    __example: 2
    __description:
      Number of the highest query acceleration scale factor in the estimatedQueryTimes object. If the status for the query is not eligible
      for query acceleration, this field is set to 0.
  snowflake.query.data_transfer.inbound.cloud:
    __type: string
    displayName: Snowflake inbound data transfer cloud
    __stability: stable
    __example: AWS
    __description: The cloud provider from which data was transferred inbound.
  snowflake.query.data_transfer.inbound.region:
    __type: string
    displayName: Snowflake inbound data transfer region
    __stability: stable
    __example: us-west-2
    __description: The region from which data was transferred inbound.
  snowflake.query.data_transfer.outbound.cloud:
    __type: string
    displayName: Snowflake outbound data transfer cloud
    __stability: stable
    __example: AWS
    __description: The cloud provider to which data was transferred outbound.
  snowflake.query.data_transfer.outbound.region:
    __type: string
    displayName: Snowflake outbound data transfer region
    __stability: stable
    __example: us-west-2
    __description: The region to which data was transferred outbound.
  snowflake.query.hash:
    __type: string
    displayName: Snowflake query text hash
    __stability: stable
    __example: hash123
    __description: The hash of the query text.
  snowflake.query.hash_version:
    __type: long
    displayName: Snowflake query hash version
    __example: 1
    __description: The version of the query hash.
  snowflake.query.id:
    __type: string
    displayName: Snowflake query ID
    __stability: stable
    __example: b1bbaa7f-8144-4e50-947a-b7e9bf7d62d5
    __description: The unique identifier for the query.
  snowflake.query.is_client_generated:
    __stability: stable
    __type: boolean
    displayName: Snowflake client generated query indicator
    __example: true
    __description: Indicates if the statement was generated by the client.
  snowflake.query.step.operator.attributes:
    __type: string
    displayName: Snowflake query execution operator attributes
    __semdict_note: >-
      Serialized JSON object stored as string in Grail. Contains query operator specific attributes (e.g. join conditions). Parse with
      parseJson() in DQL.
    __example: '{ "equality_join_condition": "(T4.C = T1.C)",   "join_type": "INNER" }'
    __description: Information about the operator, depending on the operator type.
    __span_only: true
  snowflake.query.step.operator.id:
    __type: long
    displayName: Snowflake query execution operator ID
    __example: 0
    __description: The operator's identifier, unique within a step. Values start at 0.
    __span_only: true
  snowflake.query.step.operator.parent_ids:
    __type: string[]
    displayName: Snowflake query execution operator parent IDs
    __semdict_note: >-
      Array of parent operator IDs stored as string[] in Grail. Values are numeric strings.
    __example:
      - ["0", "1"]
    __description: Identifiers of the parent operators for this operator, or NULL if this is the final operator in the query plan.
    __span_only: true
  snowflake.query.step.operator.stats:
    __type: string
    displayName: Snowflake query execution operator statistics
    __semdict_note: >-
      Serialized JSON object stored as string in Grail. Contains query operator execution statistics (e.g. input_rows, output_rows). Parse
      with parseJson() in DQL.
    __example: '{ "input_rows": 64, "output_rows": 64 }'
    __description: Statistics about the operator (e.g., the number of output rows from the operator).
    __span_only: true
  snowflake.query.step.operator.time_breakdown:
    __type: string
    displayName: Snowflake query execution operator time breakdown
    __semdict_note: >-
      Serialized JSON object stored as string in Grail. Contains query operator time breakdown (e.g. overall_percentage). Parse with
      parseJson() in DQL.
    __example:
      '{ "overall_percentage": 50.0,"initialization": 0.5,"processing": 4.0,"synchronization": 0.5,"local_disk_io": 0.2,"remote_disk_io":
      0.1,"network_communication": 0.2 }'
    __description: |
      The breakdown of the execution time of the operator:

      - **overall_percentage**: The percentage of the total query time spent by this operator,
      - **initialization**: Time spent setting up query processing,
      - **processing**: Time spent processing the data by the CPU,
      - **synchronization**: Time spent synchronizing activities between participating processes,
      - **local_disk_io**: Time during which processing was blocked while waiting for local disk access,
      - **remote_disk_io**: Time during which processing was blocked while waiting for remote disk access,
      - **network_communication**: Time during which processing was waiting for network data transfer.
    __span_only: true
  snowflake.query.step.operator.type:
    __type: string
    displayName: Snowflake query execution operator type
    __example: TableScan
    __description: The type of query operator (e.g., TableScan or Filter).
    __span_only: true
  snowflake.query.parametrized_hash:
    __type: string
    displayName: Snowflake parameterized query text hash
    __stability: stable
    __example: param_hash123
    __description: The hash of the parameterized query text.
  snowflake.query.parametrized_hash_version:
    __type: long
    displayName: Snowflake parameterized query hash version
    __example: 1
    __description: The version of the parameterized query hash.
  snowflake.query.parent_id:
    __type: string
    displayName: Snowflake parent query ID
    __stability: stable
    __example: parent123
    __description: The unique identifier for the parent query, if applicable.
  snowflake.query.retry_cause:
    __type: string
    displayName: Snowflake query retry cause
    __stability: stable
    __example: Network issue
    __description: The cause for retrying the query, if applicable.
  snowflake.query.step.id:
    __example: 1
    __type: long
    displayName: Snowflake query execution step ID
    __description:
      Identifier of the step in the query execution plan. operator_id values are unique within a step, not across the full query.
    __span_only: true
  snowflake.query.transaction_id:
    __type: long
    displayName: Snowflake query transaction ID
    __stability: stable
    __example: 7890123456
    __description: The transaction ID associated with the query.
  snowflake.release_version:
    __type: string
    displayName: Snowflake release version
    __example: "5.0"
    __description: The release version of Snowflake at the time of query execution.
  snowflake.role.type:
    __type: string
    displayName: Snowflake role type
    __stability: stable
    __example: PRIMARY
    __description: The type of role used to execute the query.
  snowflake.schema.id:
    __type: long
    displayName: Snowflake schema ID
    __example: 78901
    __description: The unique identifier of the schema involved in the query.
  snowflake.schema.name:
    __type: string
    displayName: Snowflake schema name
    __stability: stable
    __example: public
    __description: The name of the schema.
  snowflake.secondary_role_stats:
    __type: string
    displayName: Snowflake secondary role statistics
    __example: role_stat1
    __description: Statistics related to secondary roles used during the query execution.
  snowflake.session.closed_reason:
    __type: string
    displayName: Snowflake session closed reason
    __example: User logout
    __description: The reason the session was closed.
  snowflake.session.start:
    __type: long
    displayName: Snowflake session start timestamp
    __example: 1633046400000000000
    __description: The start time of the session.
  snowflake.warehouse.cluster.number:
    __type: long
    displayName: Snowflake warehouse cluster number
    __stability: stable
    __example: 1
    __description: The cluster number of the warehouse used.
  snowflake.warehouse.id:
    __type: long
    displayName: Snowflake warehouse ID
    __example: 12345
    __description: The unique identifier of the warehouse used.
  snowflake.warehouse.size:
    __type: string
    displayName: Snowflake warehouse size
    __stability: stable
    __example: X-SMALL
    __description: The size of the warehouse used.
    __enum:
      allow_custom_values: true
      members:
        - id: x_small
          value: X-SMALL
          brief: Smallest warehouse size; 1 credit/hour. Default size when creating a warehouse via SQL or Snowsight.
        - id: small
          value: SMALL
          brief: 2 credits/hour; double the compute resources of X-Small.
        - id: medium
          value: MEDIUM
          brief: 4 credits/hour; suited for moderate-complexity queries and concurrent workloads.
        - id: large
          value: LARGE
          brief: 8 credits/hour; provides substantially more compute resources per cluster for complex queries.
        - id: x_large
          value: X-LARGE
          brief: 16 credits/hour; suitable for large-scale ETL and analytics.
        - id: x2_large
          value: 2X-LARGE
          brief: 32 credits/hour; credit consumption doubles at each step from X-Large.
        - id: x3_large
          value: 3X-LARGE
          brief: 64 credits/hour.
        - id: x4_large
          value: 4X-LARGE
          brief: 128 credits/hour.
        - id: x5_large
          value: 5X-LARGE
          brief: 256 credits/hour; generally available on AWS and Azure.
        - id: x6_large
          value: 6X-LARGE
          brief: 512 credits/hour; largest available size, generally available on AWS and Azure.
  snowflake.warehouse.type:
    __type: string
    displayName: Snowflake warehouse type
    __stability: stable
    __example: STANDARD
    __description: The type of warehouse used.
    __enum:
      allow_custom_values: true
      members:
        - id: standard
          value: STANDARD
          brief: Standard multi-cluster warehouse.
        - id: snowpark_optimized
          value: SNOWPARK_OPTIMIZED
          brief: >-
            Single-node warehouse with configurable high-memory nodes (16x–64x vs standard) and CPU architecture options; recommended for ML
            training and memory-intensive UDFs and stored procedures.
dimensions:
  snowflake.query.hash:
    __type: string
    displayName: Snowflake query text hash
    __example: abc123
    __description: The hash of the query text.
    __interface_note: Used as a grouping dimension in the query cost attribution summary context.
  snowflake.query.parametrized_hash:
    __type: string
    displayName: Snowflake parameterized query text hash
    __example: def456
    __description: The hash of the parameterized query text.
    __interface_note: Used as a grouping dimension in the query cost attribution summary context.
  snowflake.query.tag:
    __type: string
    displayName: Snowflake query tag
    __stability: stable
    __example: etl_pipeline
    __description: The query tag associated with the operation, if any.
    __interface_note: Used as a grouping dimension in the query cost attribution summary context.
  db.collection.name:
    __semdict: ref
    __type: string
    displayName: Database table name
    __example: users
    __description: The name of the table involved in the query.
  snowflake.table.full_name:
    __type: string
    displayName: Snowflake fully qualified table name
    __stability: stable
    __example: PROD_DB.PUBLIC.USERS
    __description: Fully qualified name of the Snowflake table (database.schema.table).
  db.namespace:
    __semdict: ref
    __type: string
    displayName: Database name
    __example: PROD_DB
    __description: The name of the database that was specified in the context of the query at compilation.
  db.operation.name:
    __semdict: ref
    __semdict_note: >-
      Snowflake-specific values include: SELECT, INSERT, UPDATE, DELETE, MERGE, CREATE, ALTER, DROP, GRANT, REVOKE, CALL, COPY, PUT, GET.
      The SD global definition covers the common OTel subset; these Snowflake extensions are emitted as custom values.
    __example: SELECT
    __type: string
    displayName: Database operation name
    __description: The type of operation performed by the query.
  db.snowflake.dbs:
    __stability: stable
    __type: string[]
    displayName: Snowflake databases used in query
    __example: ["PROD_DB", "TEST_DB"]
    __description: The databases involved in the query.
  db.user:
    __semdict: ref
    __stability: experimental
    __type: string
    displayName: Database user
    __example: admin
    __description: The name of the database user associated with the operation.
    __interface_note: The Snowflake user who issued the query.
  snowflake.query.execution_status:
    __stability: stable
    __example: SUCCESS
    __type: string
    displayName: Snowflake query execution status
    __description: The execution status of the query.
    __enum:
      allow_custom_values: true
      members:
        - id: success
          value: SUCCESS
          brief: Query completed without errors; result is available in the result cache.
        - id: fail
          value: FAIL
          brief: Query failed due to a user-actionable error (e.g. syntax error, insufficient privileges).
        - id: failed_with_error
          value: FAILED_WITH_ERROR
          brief: Query failed due to an internal Snowflake error unrelated to user input; retrying the statement may succeed.
        - id: incident
          value: INCIDENT
          brief: Query was aborted or interrupted by a Snowflake platform incident; not caused by user error or warehouse load.
        - id: queued
          value: QUEUED
          brief: Query is waiting in the warehouse queue due to concurrency limits or cluster provisioning.
        - id: resuming_warehouse
          value: RESUMING_WAREHOUSE
          brief: Query is waiting for the warehouse to resume from a suspended state before execution can begin.
        - id: running
          value: RUNNING
          brief: Query is actively executing on the warehouse compute resources.
  snowflake.role.name:
    __type: string
    displayName: Snowflake role name
    __stability: stable
    __example: SYSADMIN
    __description: The name of the Snowflake role associated with the operation.
  snowflake.warehouse.name:
    __type: string
    displayName: Snowflake warehouse name
    __stability: stable
    __example: COMPUTE_WH
    __description: The name of the Snowflake warehouse.
  snowflake.user.type:
    __type: string
    displayName: Snowflake user type
    __stability: stable
    __example: PERSON
    __description: >-
      The type of user who executed the query. Possible values: PERSON (human interactive user), SERVICE (programmatic service user),
      LEGACY_SERVICE (legacy service account), SNOWFLAKE_SERVICE (Snowpark Container Services). Useful for splitting workloads by human vs.
      automated traffic.
    __enum:
      allow_custom_values: true
      members:
        - id: person
          value: PERSON
          brief: Human interactive user.
        - id: service
          value: SERVICE
          brief: >-
            Non-interactive integration user; cannot authenticate via password or SAML, cannot enroll in MFA. Recommended for all automated
            service accounts.
        - id: legacy_service
          value: LEGACY_SERVICE
          brief: >-
            Non-interactive integration user that, unlike SERVICE, still permits password and SAML authentication. Deprecated — migrate to
            SERVICE type.
        - id: snowflake_service
          value: SNOWFLAKE_SERVICE
          brief: >-
            System-managed user automatically created for each Snowpark Container Services (SPCS) service; cannot be created or converted by
            administrators.
metrics:
  snowflake.cost_attribution.query_count:
    __type: long
    __stability: stable
    __semdict_note: >-
      The .query_count name is deliberately preserved. The alternative plural snowflake.cost_attribution.queries would read as a collection
      of query objects rather than a scalar count, which is misleading in a metrics context.
    __example: 42
    __description: Number of queries in this cost attribution group during the summary window.
    displayName: Snowflake cost attribution query count
    unit: count
  snowflake.credits.attributed_compute:
    __type: double
    __example: 0.0042
    __description: >-
      Compute credits attributed to this query based on weighted resource consumption. Excludes warehouse idle time. NULL for queries within
      the ~8h QAH latency window.
    displayName: Snowflake query attributed compute credits
    unit: credit
  snowflake.credits.query_acceleration:
    __type: double
    __example: 0.0001
    __description: Credits consumed by Query Acceleration Service for this query. NULL for queries within the ~8h QAH latency window.
    displayName: Snowflake query acceleration credits
    unit: credit
  snowflake.acceleration.data.scanned:
    __type: long
    __example: 2097152
    __description: Number of bytes scanned by the query acceleration service.
    displayName: Snowflake query acceleration bytes scanned
    unit: By
  snowflake.acceleration.partitions.scanned:
    __type: long
    __example: 50
    __description: Number of partitions scanned by the query acceleration service.
    displayName: Snowflake query acceleration partitions scanned
    unit: partition
  snowflake.acceleration.scale_factor.max:
    __type: long
    __example: 4
    __description: Upper limit scale factor that a query would have benefited from.
    displayName: Snowflake query acceleration upper limit scale factor
    unit: "1"
  snowflake.credits.cloud_services:
    __type: double
    __example: 10
    __description: Number of credits used for cloud services.
    displayName: Snowflake cloud services credits used
    unit: credit
  snowflake.data.deleted:
    __type: long
    __example: 1048576
    __description: Number of bytes deleted by the query.
    displayName: Snowflake bytes deleted
    unit: By
  snowflake.data.read.from_result:
    __type: long
    __example: 1048576
    __description: Number of bytes read from a result object.
    displayName: Snowflake bytes read from result
    unit: By
  snowflake.data.scanned:
    __type: long
    __example: 10485760
    __description: Number of bytes scanned by this statement.
    displayName: Snowflake bytes scanned
    unit: By
  snowflake.data.scanned_from_cache:
    __type: double
    __example: 0.75
    __description: >-
      Ratio of data scanned from the local disk cache. Value ranges from 0.0 (no cache) to 1.0 (fully cached). Sourced from Snowflake
      PERCENTAGE_SCANNED_FROM_CACHE column (despite its name, the raw value is 0.0-1.0).
    displayName: Snowflake data scanned from cache
    unit: ratio
  snowflake.data.sent_over_the_network:
    __type: long
    __example: 524288
    __description: Volume of data sent over the network.
    displayName: Snowflake data sent over the network
    unit: By
  snowflake.data.spilled.local:
    __type: long
    __example: 1048576
    __description: Volume of data spilled to local disk.
    displayName: Snowflake data spilled to local storage
    unit: By
  snowflake.data.spilled.remote:
    __type: long
    __example: 2097152
    __description: Volume of data spilled to remote disk.
    displayName: Snowflake data spilled to remote storage
    unit: By
  snowflake.data.transferred.inbound:
    __type: long
    __example: 10485760
    __description: Number of bytes transferred in statements that load data from another region and/or cloud.
    displayName: Snowflake inbound data transfer bytes
    unit: By
  snowflake.data.transferred.outbound:
    __type: long
    __example: 5242880
