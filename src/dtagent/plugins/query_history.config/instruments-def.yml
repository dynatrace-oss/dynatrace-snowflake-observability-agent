dql_queries:
  - query_string: |
      timeseries val = sum(snowflake.time.execution), by: { snowflake.warehouse.name, deployment.environment.name }
    description: Plot total Snowflake query execution time per warehouse over time.
    description_copilot: Timeseries of Snowflake query execution time broken down by warehouse.
    context:
      - metrics
  - query_string: |
      timeseries credits = sum(snowflake.credits.attributed_compute), by: { db.user, deployment.environment.name }
    description: Plot attributed compute credits consumed per user over time.
    description_copilot: Timeseries of Snowflake attributed compute credits consumed per user.
    context:
      - metrics
  - query_string: |
      timeseries { compute = sum(snowflake.credits.attributed_compute), scanned = sum(snowflake.data.scanned) },
        by: { snowflake.warehouse.name, deployment.environment.name }
    description: Compare attributed compute credits against bytes scanned per warehouse over time.
    description_copilot: Timeseries comparing Snowflake attributed compute credits and bytes scanned per warehouse.
    context:
      - metrics
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | sort timestamp desc
      | limit 100
    description: Fetch the 100 most recent DSOA query_history plugin log entries from Grail.
    description_copilot: Search for all query_history plugin logs from the Snowflake observability agent.
    context:
      - logs
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter isNotNull(snowflake.query.id)
      | fieldsAdd running_min = toLong(snowflake.time.total_elapsed) / 1000 / 60
      | filter running_min > 5
      | fields timestamp, snowflake.query.id, db.user, snowflake.warehouse.name, running_min
      | sort running_min desc
      | limit 50
    description: Find Snowflake queries that ran longer than five minutes, with their user and warehouse.
    description_copilot: Find long-running Snowflake queries exceeding five minutes of total elapsed time.
    context:
      - logs
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter isNotNull(snowflake.warehouse.name)
      | summarize {
          queries = count(),
          avg_exec_ms = avg(toLong(snowflake.time.execution)),
          p90_exec_ms = percentile(toLong(snowflake.time.execution), 90)
        }, by: { snowflake.warehouse.name }
      | sort p90_exec_ms desc
      | limit 25
    description: Rank warehouses by the p90 execution time of their Snowflake queries.
    description_copilot: Find which Snowflake warehouses have the slowest queries by p90 execution time.
    context:
      - logs
  - query_string: |
      fetch spans
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | sort timestamp desc
      | limit 50
    description: Fetch the 50 most recent DSOA query_history spans (individual Snowflake query executions).
    description_copilot: Find query_history span traces produced by the Snowflake observability agent.
    context:
      - spans
  - query_string: |
      fetch spans
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter isNotNull(trace.id) and isNotNull(span.id)
      | fields trace.id, span.id, request.is_root_span, snowflake.query.id, start_time, end_time
      | sort start_time desc
      | limit 50
    description: Correlate DSOA query_history spans by trace.id/span.id to inspect the root span and timing for a Snowflake query execution.
    description_copilot: Find the trace and span identifiers for Snowflake query execution spans, including whether each is the root span.
    context:
      - spans
  - query_string: |
      fetch spans
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | expand span.events
      | filter contains(span.events.name, "snowflake.query.step")
      | fields snowflake.query.step.id, snowflake.query.step.operator.type, snowflake.query.step.operator.stats, span.events.timestamp
      | sort span.events.timestamp desc
      | limit 100
    description: Inspect Snowflake query-plan step/operator span events (snowflake.query.step.*) recorded on query_history spans.
    description_copilot: List query execution plan steps and operators recorded as span events on Snowflake query spans.
    context:
      - spans
