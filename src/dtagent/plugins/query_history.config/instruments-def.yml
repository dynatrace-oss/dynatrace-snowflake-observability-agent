  client.application.version:
    __semdict: new
    __example: 1.0.0
    __type: string
    displayName: Client application version
    __description: The version of the client application used to execute the query.
  client.build_id:
    __semdict: new
    __example: build123
    __type: string
    displayName: Client build ID
    __description: The build ID of the client application.
  client.environment:
    __stability: stable
    __semdict: new
    __example: production
    __type: string
    displayName: Client application environment
    __description: The environment of the client application.
  client.version:
    __semdict: new
    __example: 1.0.0
    __type: string
    displayName: Client version
    __description: The version of the client.
