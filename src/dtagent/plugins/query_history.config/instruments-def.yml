    __description: Time (in milliseconds) spent listing external files.
    displayName: Snowflake list external files time
    unit: ms
  snowflake.time.queued.overload:
    __type: long
    __example: 1500
    __description: Time (in milliseconds) spent in the warehouse queue, due to the warehouse being overloaded by the current query workload.
    displayName: Snowflake queued overload time
