  snowflake.time.child_queries_wait:
    __type: long
    __example: 200
    __description: Time (in milliseconds) to complete the cached lookup when calling a memoizable function.
    displayName: Snowflake child queries wait time
    unit: ms
  snowflake.time.compilation:
    __type: long
    __example: 5000
    __description: Compilation time (in milliseconds)
    displayName: Snowflake query compilation time
    unit: ms
  snowflake.time.execution:
    __type: long
    __example: 100000
    __description: Execution time (in milliseconds)
