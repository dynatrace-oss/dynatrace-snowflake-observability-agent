attributes:
  authentication.type:
    __type: string
    displayName: Snowflake session authentication type
    __semdict: ref
    __semdict_note: >-
      semdict enum has allow_custom_values: false (OAUTH2/TOKEN/DEVOPSTOKEN/NONE). DSOA also emits PASSWORD for Snowflake password auth;
      this is flagged as an open enum extension request.
    __example: PASSWORD
    __description: The authentication method used for the session.
  client.application.id:
    __stability: stable
    __semdict: new
    __example: SnowflakeJDBCDriver
    __type: string
