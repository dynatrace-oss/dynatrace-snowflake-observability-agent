# Catalog of instrumentation known to Dynatrace Snowflake Observability Agent - budgets plugin
attributes:
  snowflake.budget.owner.name:
    __type: string
    displayName: Snowflake budget owner name
    __stability: stable
    __context_names:
      - budgets
    __example: budget_admin
    __description: The owner of the budget, typically the user or role responsible for managing the budget.
  snowflake.budget.owner.role_type:
    __type: string
    __context_names:
      - budgets
    __example: ROLE
    __description: >
      The principal type of the budget owner: ROLE or APPLICATION.
    displayName: Snowflake budget owner role type
  snowflake.budget.resource:
    __stability: stable
    __type: string[]
    __semdict_note: "Array of resource names (databases, warehouses) in this budget group, stored as string[] in Grail."
    __context_names:
      - budgets
    __example:
      - ["DATABASE1", "WAREHOUSE1"]
    __description: The resources linked to the budget, such as databases, warehouses, or other Snowflake objects that the budget monitors.
    displayName: Snowflake budget resource
dimensions:
  db.namespace:
    __semdict: ref
    __type: string
    displayName: Snowflake database name
    __context_names:
      - budgets
      - spendings
    __example: analytics_db
    __description: The name of the database that was specified in the context of the query at compilation.
  snowflake.budget.name:
    __type: string
    displayName: Snowflake budget name
    __stability: stable
    __context_names:
      - budgets
      - spendings
    __example: monthly_budget
    __description: Name of the budget.
  snowflake.budget.full_name:
    __type: string
    displayName: Snowflake fully qualified budget name
    __context_names:
      - budgets
      - spendings
    __example: ANALYTICS_DB.BUDGETS.MONTHLY_BUDGET
    __description: Fully-qualified name of the budget (DATABASE.SCHEMA.NAME).
  snowflake.schema.name:
    __type: string
    displayName: Snowflake schema name
    __stability: stable
    __context_names:
      - budgets
      - spendings
    __example: public
    __description: The name of the schema.
  snowflake.service.type:
    __type: string
    displayName: Snowflake service type
    __stability: stable
    __context_names:
      - spendings
    __example: WAREHOUSE_METERING
    __description: Type of Snowflake service consuming credits.
    __enum:
      allow_custom_values: true
      members:
        - id: auto_clustering
          value: AUTO_CLUSTERING
          brief: >-
            Credits consumed by the background service that continuously re-clusters micro-partitions of tables with an active clustering
            key.
        - id: cloud_services
          value: CLOUD_SERVICES
          brief: Cloud services layer credits for metadata operations, query parsing, and transaction management.
        - id: hybrid_table_requests
          value: HYBRID_TABLE_REQUESTS
          brief: Credits consumed by Unistore hybrid-table (row-store + columnar) request processing.
        - id: materialized_view
          value: MATERIALIZED_VIEW
          brief: >-
            Credits consumed by the background service that keeps materialized view results up to date as underlying table data changes.
        - id: pipe
          value: PIPE
          brief: >-
            Credits consumed by Snowpipe for continuous micro-batch ingestion of staged files into Snowflake tables via serverless compute.
        - id: query_acceleration
          value: QUERY_ACCELERATION
          brief: >-
            Credits consumed when the Query Acceleration Service offloads eligible query portions to auto-provisioned serverless compute to
            reduce per-query latency.
        - id: replication
          value: REPLICATION
          brief: >-
            Credits consumed to replicate databases, schemas, or failover groups across regions or cloud providers for disaster recovery or
            data proximity.
        - id: search_optimization
          value: SEARCH_OPTIMIZATION
          brief: >-
            Credits consumed to build and maintain the search access path that accelerates selective point-lookup and substring-search
            queries.
        - id: serverless_alerts
          value: SERVERLESS_ALERTS
          brief: Credits consumed by Snowflake Alerts running on serverless compute to evaluate alert conditions and send notifications.
        - id: serverless_task
          value: SERVERLESS_TASK
          brief: Credits consumed by tasks that run on Snowflake-managed serverless compute rather than a user-provisioned warehouse.
        - id: snowpipe_streaming
          value: SNOWPIPE_STREAMING
          brief: Credits consumed by the Snowpipe Streaming SDK for low-latency row-level data ingestion without staging files.
        - id: storage
          value: STORAGE
          brief: >-
            Credits billed for bytes stored in Snowflake databases, internal stages, Time Travel history, and Fail-safe retention.
        - id: telemetry_data_ingest
          value: TELEMETRY_DATA_INGEST
          brief: Credits consumed for ingesting OpenTelemetry-compatible logs, traces, and metrics into a Snowflake event table.
        - id: warehouse_metering
          value: WAREHOUSE_METERING
          brief: Virtual warehouse compute credits.
        - id: warehouse_metering_reader
          value: WAREHOUSE_METERING_READER
          brief: Virtual warehouse compute credits consumed by reader accounts accessing shared data.
event_timestamps:
  snowflake.event.trigger:
    __type: string
    displayName: Snowflake event trigger
    __context_names:
      - budgets
    __example: "snowflake.budget.created_on"
    __description:
      Additionally to sending logs, each entry in `EVENT_TIMESTAMPS` is sent as event with key set to `snowflake.event.trigger`, value to
      key from `EVENT_TIMESTAMPS` and `timestamp` set to the key value.
  snowflake.budget.created_on:
    __type: long
    __stability: stable
    __context_names:
      - budgets
    __example: 1732981199999000000
    __description: The timestamp when the budget was created.
    displayName: Snowflake budget creation time
metrics:
  snowflake.credits.limit:
    __type: long
    __context_names:
      - budgets
    __example: 100
    __description: The number of credits set as the spending limit for the budget.
    displayName: Snowflake budget spending limit
    unit: credit
  snowflake.credits.spent:
    __type: double
    __context_names:
      - spendings
    __example: 75
    __description: Number of credits used.
    displayName: Snowflake credits spent
    unit: credit
dql_queries:
  - query_string: |
      timeseries spent = sum(snowflake.credits.spent), by: { snowflake.budget.name, deployment.environment.name }
    description: Plot credits spent per Snowflake budget over time.
    description_copilot: Timeseries of Snowflake credits spent per budget.
    context:
      - metrics
  - query_string: |
      timeseries budget_limit = avg(snowflake.credits.limit), by: { snowflake.budget.name, deployment.environment.name }
    description: Plot the credit spending limit per Snowflake budget over time.
    description_copilot: Timeseries of Snowflake budget spending limits per budget.
    context:
      - metrics
  - query_string: |
      timeseries { spent = sum(snowflake.credits.spent), budget_limit = avg(snowflake.credits.limit) },
        by: { snowflake.budget.name, deployment.environment.name }
    description: Compare credits spent against the configured limit per Snowflake budget over time.
    description_copilot: Timeseries comparing Snowflake budget spend against its credit limit per budget.
    context:
      - metrics
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "budgets"
      | sort timestamp desc
      | limit 100
    description: Fetch the 100 most recent DSOA budgets plugin log entries from Grail.
    description_copilot: Search for all budgets plugin logs from the Snowflake observability agent.
    context:
      - logs
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "budgets"
      | filter isNotNull(snowflake.budget.name)
      | fields timestamp, snowflake.budget.name, snowflake.credits.spent, snowflake.credits.limit
      | sort timestamp desc
      | limit 50
    description: Inspect the latest spend and limit readings for each Snowflake budget.
    description_copilot: Show recent Snowflake budget spend and limit values per budget.
    context:
      - logs
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "budgets"
      | filter isNotNull(snowflake.budget.name)
      | summarize { latest_spent = takeMax(toDouble(snowflake.credits.spent)) }, by: { snowflake.budget.name }
      | sort latest_spent desc
    description: Rank Snowflake budgets by their most recent credits-spent reading.
    description_copilot: Find which Snowflake budgets have spent the most credits.
    context:
      - logs
  - query_string: |
      fetch events
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "budgets"
      | sort timestamp desc
      | limit 50
    description: Fetch the most recent DSOA budgets lifecycle events from Grail.
    description_copilot: Search for Snowflake budget lifecycle events emitted by the observability agent.
    context:
      - events
  - query_string: |
      fetch events
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "budgets"
      | summarize { events = count() }, by: { snowflake.event.type }
      | sort events desc
    description: Count DSOA budgets lifecycle events grouped by event type.
    description_copilot: Break down Snowflake budget lifecycle events by their event type.
    context:
      - events
  - query_string: |
      fetch events
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "budgets"
      | filter snowflake.event.type == "snowflake.budget.created_on"
      | sort timestamp desc
      | limit 25
    description: Fetch budget-creation lifecycle events reported by the budgets plugin.
    description_copilot: Find when Snowflake budgets were created from the budgets plugin lifecycle events.
    context:
      - events
