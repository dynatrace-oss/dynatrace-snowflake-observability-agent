attributes:
  db.query.text:
    __context_names:
      - task_versions
    __example: SELECT * FROM users;
    __description: The text of the query.
    __type: string
  snowflake.database.id:
    __type: long
    __stability: stable
    __context_names:
      - serverless_tasks
      - task_versions
    __example: 123456
    __description: The unique identifier for the database.
  snowflake.error.code:
    __type: string
    __stability: stable
    __context_names:
      - task_history
    __example: ERR123
    __description: The error code returned by the task.
  snowflake.error.message:
    __type: string
    __stability: stable
    __context_names:
      - task_history
    __example: Syntax error
    __description: The error message returned by the task.
  snowflake.query.hash:
    __type: string
    __stability: stable
    __context_names:
      - task_history
    __example: hash123
    __description: The hash of the query.
  snowflake.query.hash_version:
    __type: long
    __context_names:
      - task_history
    __example: 1
    __description: The version of the query hash.
  snowflake.query.id:
    __type: string
    __stability: stable
    __context_names:
      - task_history
    __example: query123
    __description: The unique identifier for the query.
  snowflake.query.parametrized_hash:
    __type: string
    __stability: stable
    __context_names:
      - task_history
    __example: param_hash123
    __description: The parameterized hash of the query.
  snowflake.query.parametrized_hash_version:
    __type: long
    __context_names:
      - task_history
    __example: 1
    __description: The version of the parameterized query hash.
  snowflake.schema.id:
    __type: long
    __context_names:
      - serverless_tasks
      - task_versions
    __example: 78901
    __description: The unique identifier for the schema.
  snowflake.task.condition:
    __type: string
    __context_names:
      - task_versions
      - task_history
    __example: status = 'SUCCESS'
    __description: The condition text of the task.
    __enum:
      allow_custom_values: true
      members:
        - id: success_condition
          value: status = 'SUCCESS'
          brief: Runs the task only when the predecessor task(s) completed successfully.
        - id: stream_has_data
          value: SYSTEM$STREAM_HAS_DATA('<stream_name>')
          brief: Runs the task only when the referenced stream has change data available.
        - id: always
          value: "TRUE"
          brief: Task has no meaningful condition gate and always runs when triggered.
  snowflake.task.config.id:
    __type: string
    __context_names:
      - task_history
    __example: config123
    __description: The configuration of the task.
  snowflake.task.config.allow_overlap:
    __context_names:
      - task_versions
    __type: boolean
    __example: true
    __description: Indicates if overlapping execution is allowed.
  snowflake.task.end_time:
    __type: long
    __context_names:
      - serverless_tasks
    __example: 1633046700000000000
    __description: The end time of the task.
  snowflake.task.error_integration:
    __type: string
    __context_names:
      - task_versions
    __example: error_integration123
    __description: The error integration for the task.
  snowflake.task.graph.root_id:
    __type: string
    __context_names:
      - task_versions
      - task_history
    __example: root123
    __description: The root ID of the task graph.
  snowflake.task.graph.version:
    __type: long
    __context_names:
      - task_versions
      - task_history
    __example: 1
    __description: The version of the task graph.
  snowflake.task.id:
    __type: long
    __context_names:
      - serverless_tasks
      - task_versions
    __example: 123456789
    __description: The unique identifier for the task.
  snowflake.task.instance_id:
    __type: long
    __stability: stable
    __context_names:
      - serverless_tasks
    __example: 987654321
    __description: The unique identifier for the task instance.
  snowflake.task.last_committed_on:
    __type: long
    __context_names:
      - task_versions
    __example: 1633046400000000000
    __description: The last committed time of the task.
  snowflake.task.last_suspended_on:
    __type: long
    __context_names:
      - task_versions
    __example: 1633046700000000000
    __description: The last suspended time of the task.
  snowflake.task.owner:
    __type: string
    __context_names:
      - task_versions
    __example: admin
    __description: The owner of the task.
  snowflake.task.predecessors:
    __type: string[]
    __context_names:
      - task_versions
    __example:
      - taskA
      - taskB
    __description: The predecessors of the task.
  snowflake.task.run.attempt:
    __stability: stable
    __type: long
    __context_names:
      - task_history
    __example: 1
    __description: The attempt number of the task run.
  snowflake.task.run.completed_time:
    __type: long
    __stability: stable
    __context_names:
      - task_history
    __example: 1742824007586000000
    __description: The completed time of the task run.
  snowflake.task.run.group_id:
    __type: string
    __context_names:
      - task_history
    __example: group123
    __description: The group ID of the task run.
  snowflake.task.run.id:
    __type: long
    __context_names:
      - task_history
    __example: 123456
    __description: The unique identifier for the task run.
  snowflake.task.run.return_value:
    __type: string
    __context_names:
      - task_history
    __example: "0"
    __description: The return value of the task run.
  snowflake.task.run.scheduled_time:
    __type: long
    __stability: stable
    __context_names:
      - task_history
    __example: 1742821828016000000
    __description: The scheduled time of the task run.
  snowflake.task.run.scheduled_from:
    __type: string
    __stability: stable
    __context_names:
      - task_history
    __example: CRON
    __description: The source from which the task was scheduled.
  snowflake.task.run.state:
    __type: string
    __stability: stable
    __context_names:
      - task_history
    __example: RUNNING
    __description: The state of the task run.
  snowflake.task.schedule:
    __type: string
    __context_names:
      - task_versions
    __example: 0 0 * * *
    __description: The schedule of the task.
  snowflake.task.start_time:
    __type: long
    __context_names:
      - serverless_tasks
    __example: 1633046400000000000
    __description: The start time of the task.
dimensions:
  db.namespace:
    __type: string
    __context_names:
      - serverless_tasks
      - task_versions
      - task_history
    __example: PROD_DB
    __description: The name of the database.
  snowflake.schema.name:
    __type: string
    __stability: stable
    __context_names:
      - serverless_tasks
      - task_versions
      - task_history
    __example: public
    __description: The name of the schema.
  snowflake.task.is_internal:
    __type: boolean
    __stability: stable
    __context_names:
      - serverless_tasks
    __example: false
    __description: Whether the task is an internal DSOA scheduler task (measurement or finalizer).
  snowflake.task.name:
    __type: string
    __stability: stable
    __context_names:
      - serverless_tasks
      - task_versions
      - task_history
    __example: daily_backup_task
    __description: The name of the task.
  snowflake.warehouse.name:
    __type: string
    __stability: stable
    __context_names:
      - task_versions
    __example: COMPUTE_WH
    __description: The name of the warehouse.
event_timestamps:
  snowflake.event.trigger:
    __type: string
    __context_names:
      - task_versions
    __example: "snowflake.task.graph.version.created_on"
    __description:
      Additionally to sending logs, each entry in `EVENT_TIMESTAMPS` is sent as event with key set to `snowflake.event.trigger`, value to
      key from `EVENT_TIMESTAMPS` and `timestamp` set to the key value.
  snowflake.task.graph.version.created_on:
    __type: long
    __stability: stable
    __context_names:
      - task_versions
    __example: 1633046400000000000
    __description: The timestamp when the task graph version was created.
metrics:
  snowflake.credits.used:
    __type: double
    __context_names:
      - serverless_tasks
    __example: 10
    __description: Number of credits billed for serverless task usage during the START_TIME and END_TIME window.
    displayName: Snowflake Credits Used
    unit: credits
  snowflake.task.run.failed:
    __type: long
    __context_names:
      - openpipeline
    __description: Number of Snowflake task runs that ended in FAILED state within the collection window.
    __example: 3
    displayName: Snowflake Task Runs Failed
    unit: count
  snowflake.task.run.cancelled:
    __type: long
    __context_names:
      - openpipeline
    __description: Number of Snowflake task runs that ended in CANCELLED state within the collection window.
    __example: 1
    displayName: Snowflake Task Runs Cancelled
    unit: count
  snowflake.task.run.successful:
    __type: long
    __context_names:
      - openpipeline
    __description: >-
      Number of Snowflake task runs that ended in SUCCEEDED state within the collection window.
    __example: 142
    displayName: Snowflake Task Runs Successful
    unit: count
dql_queries:
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "tasks"
      | sort timestamp desc
      | limit 100
    description: Fetch the 100 most recent DSOA tasks plugin log entries from Grail.
    description_copilot: Search for all tasks plugin logs from the Snowflake observability agent.
    internal: false
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "tasks"
      | filter snowflake.task.run.state == "FAILED"
      | sort timestamp desc
      | limit 50
    description: Fetch log entries for failed Snowflake task runs from the tasks plugin.
    description_copilot: Search for failed Snowflake task runs in the tasks plugin logs.
    internal: false
  - query_string: |
      timeseries failed = sum(snowflake.task.run.failed), by: { snowflake.task.name, deployment.environment }
      | filter db.system == "snowflake"
    description: Plot number of failed Snowflake task runs per task name over time.
    description_copilot: Timeseries of failed Snowflake task runs broken down by task name.
    internal: false
