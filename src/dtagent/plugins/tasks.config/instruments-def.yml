attributes:
  db.query.text:
    __semdict: ref
    __context_names:
      - task_versions
    __example: SELECT * FROM users;
    __description: The text of the query.
    __type: string
    displayName: Database query text
  snowflake.database.id:
    __type: long
    displayName: Snowflake database ID
    __stability: stable
    __context_names:
      - serverless_tasks
      - task_versions
    __example: 123456
    __description: The unique identifier for the database.
  snowflake.error.code:
    __type: string
    displayName: Snowflake error code
    __stability: stable
    __context_names:
      - task_history
    __example: ERR123
    __description: The error code returned by the operation, if any.
  snowflake.error.message:
    __type: string
    displayName: Snowflake error message
    __stability: stable
    __context_names:
      - task_history
    __example: Syntax error
    __description: The error message returned by the operation, if any.
  snowflake.query.hash:
    __type: string
    displayName: Snowflake query text hash
    __stability: stable
    __context_names:
      - task_history
    __example: hash123
    __description: The hash of the query text.
  snowflake.query.hash_version:
    __type: long
    displayName: Snowflake query hash version
    __context_names:
      - task_history
    __example: 1
    __description: The version of the query hash.
  snowflake.query.id:
    __type: string
    displayName: Snowflake query ID
    __stability: stable
    __context_names:
      - task_history
    __example: query123
    __description: The unique identifier for the SQL query.
  snowflake.query.parametrized_hash:
    __type: string
    displayName: Snowflake parametrized query hash
    __stability: stable
    __context_names:
      - task_history
    __example: param_hash123
    __description: The parameterized hash of the query.
  snowflake.query.parametrized_hash_version:
    __type: long
    displayName: Snowflake parametrized query hash version
    __context_names:
      - task_history
    __example: 1
    __description: The version of the parameterized query hash.
  snowflake.schema.id:
    __type: long
    displayName: Snowflake schema ID
    __context_names:
      - serverless_tasks
      - task_versions
    __example: 78901
    __description: The unique identifier for the schema.
  snowflake.task.condition:
    __type: string
    displayName: Snowflake task condition text
    __context_names:
      - task_versions
      - task_history
    __example: status = 'SUCCESS'
    __description: The condition text of the task.
  snowflake.task.config.id:
    __type: string
    displayName: Snowflake task configuration ID
    __context_names:
      - task_history
    __example: config123
    __description: The configuration of the task.
  snowflake.task.config.allow_overlap:
    __context_names:
      - task_versions
    __type: boolean
    displayName: Snowflake task overlapping execution indicator
    __example: true
    __description: Indicates if overlapping execution is allowed.
  snowflake.task.end_time:
    __type: long
    displayName: Snowflake task end time
    __context_names:
      - serverless_tasks
    __example: 1633046700000000000
    __description: The end time of the task.
  snowflake.task.error_integration:
    __type: string
    displayName: Snowflake task error notification integration service
    __context_names:
      - task_versions
    __example: error_integration123
    __description:
      Name of the notification integration used to access Amazon Simple Notification Service (SNS), Google Pub/Sub, or Microsoft Azure Event
      Grid to relay error notifications for the task.
  snowflake.task.graph.root_id:
    __type: string
    displayName: Snowflake task graph root ID
    __context_names:
      - task_versions
      - task_history
    __example: root123
    __description: The root ID of the task graph.
  snowflake.task.graph.version:
    __type: long
    displayName: Snowflake task graph version
    __context_names:
      - task_versions
      - task_history
    __example: 1
    __description: The version of the task graph.
  snowflake.task.id:
    __type: long
    displayName: Snowflake task ID
    __context_names:
      - serverless_tasks
      - task_versions
    __example: 123456789
    __description: The unique identifier for the task.
  snowflake.task.instance_id:
    __type: long
    displayName: Snowflake internal instance ID
    __stability: stable
    __context_names:
      - serverless_tasks
    __example: 987654321
    __description: Internal/system-generated identifier for the instance which the object belongs to.
  snowflake.task.last_committed_on:
    __type: long
    displayName: Snowflake task last committed time
    __context_names:
      - task_versions
    __example: 1633046400000000000
    __description: The last committed time of the task.
  snowflake.task.last_suspended_on:
    __type: long
    displayName: Snowflake task last suspended time
    __context_names:
      - task_versions
    __example: 1633046700000000000
    __description: The last suspended time of the task.
  snowflake.task.owner:
    __type: string
    displayName: Snowflake task owner
    __context_names:
      - task_versions
    __example: admin
    __description: The owner of the task.
  snowflake.task.predecessors:
    __type: string[]
    displayName: Snowflake task predecessors
    __context_names:
      - task_versions
    __example:
      - taskA
      - taskB
    __description: The predecessors of the task.
  snowflake.task.run.attempt:
    __stability: stable
    __type: long
    displayName: Snowflake task run attempt number
    __context_names:
      - task_history
    __example: 1
    __description: The attempt number of the task run.
  snowflake.task.run.completed_time:
    __type: long
    displayName: Snowflake task run completion time
    __stability: stable
    __context_names:
      - task_history
    __example: 1742824007586000000
    __description: The completed time of the task run.
  snowflake.task.run.group_id:
    __type: string
    displayName: Snowflake task run group ID
    __context_names:
      - task_history
    __example: group123
    __description: The group ID of the task run.
  snowflake.task.run.id:
    __type: long
    displayName: Snowflake task run ID
    __context_names:
      - task_history
    __example: 123456
    __description: The unique identifier for the task run.
  snowflake.task.run.return_value:
    __type: string
    displayName: Snowflake predecessor task return value
    __context_names:
      - task_history
    __example: "0"
    __description:
      Value set for the predecessor task in a task graph. The return value is explicitly set by calling the SYSTEM$SET_RETURN_VALUE function
      by the predecessor task.
  snowflake.task.run.scheduled_time:
    __type: long
    displayName: Snowflake task run scheduled time
    __stability: stable
    __context_names:
      - task_history
    __example: 1742821828016000000
    __description: The scheduled time of the task run.
  snowflake.task.run.scheduled_from:
    __type: string
    displayName: Snowflake task run schedule source
    __stability: stable
    __context_names:
      - task_history
    __example: CRON
    __description: The source from which the task was scheduled.
  snowflake.task.run.state:
    __type: string
    displayName: Snowflake task run state
    __stability: stable
    __context_names:
      - task_history
    __example: RUNNING
    __description: The state of the task run.
  snowflake.task.schedule:
    __type: string
    displayName: Snowflake task schedule
    __context_names:
      - task_versions
    __example: 0 0 * * *
    __description: The schedule of the task.
  snowflake.task.start_time:
    __type: long
    displayName: Snowflake task start time
    __context_names:
      - serverless_tasks
    __example: 1633046400000000000
    __description: The start time of the task.
dimensions:
  db.namespace:
    __semdict: ref
    __type: string
    displayName: Database namespace
    __context_names:
      - serverless_tasks
      - task_versions
      - task_history
    __example: PROD_DB
    __description: The name of the database.
  snowflake.schema.name:
    __type: string
    displayName: Snowflake schema name
    __stability: stable
    __context_names:
      - serverless_tasks
      - task_versions
      - task_history
    __example: public
    __description: The name of the schema.
  snowflake.task.is_internal:
    __type: boolean
    displayName: Snowflake internal task indicator
    __stability: stable
    __context_names:
      - serverless_tasks
    __example: false
    __description: Whether the task is an internal DSOA scheduler task (measurement or finalizer).
  snowflake.task.name:
    __type: string
    displayName: Snowflake task name
    __stability: stable
    __context_names:
      - serverless_tasks
      - task_versions
      - task_history
    __example: daily_backup_task
    __description: The name of the task.
  snowflake.warehouse.name:
    __type: string
    displayName: Snowflake warehouse name
    __stability: stable
    __context_names:
      - task_versions
    __example: COMPUTE_WH
    __description: The name of the Snowflake warehouse.
event_timestamps:
  snowflake.event.trigger:
    __type: string
    displayName: Snowflake event trigger
    __context_names:
      - task_versions
    __example: "snowflake.task.graph.version.created_on"
    __description:
      Additionally to sending logs, each entry in `EVENT_TIMESTAMPS` is sent as event with key set to `snowflake.event.trigger`, value to
      key from `EVENT_TIMESTAMPS` and `timestamp` set to the key value.
  snowflake.task.graph.version.created_on:
    __type: long
    displayName: Snowflake task graph version creation time
    __stability: stable
    __context_names:
      - task_versions
    __example: 1633046400000000000
    __description: The timestamp when the task graph version was created.
metrics:
  snowflake.credits.used:
    __type: double
    __context_names:
      - serverless_tasks
    __example: 10
    __description: The number of credits consumed during the START_TIME and END_TIME window.
    displayName: Snowflake credits used
    unit: credit
  snowflake.task.run.failed:
    __type: long
    __context_names:
      - openpipeline
    __description: Number of Snowflake task runs that ended in FAILED state within the collection window.
    __example: 3
    displayName: Snowflake task runs failed
    unit: count
  snowflake.task.run.cancelled:
    __type: long
    __context_names:
      - openpipeline
    __description: Number of Snowflake task runs that ended in CANCELLED state within the collection window.
    __example: 1
    displayName: Snowflake task runs cancelled
    unit: count
  snowflake.task.run.successful:
    __type: long
    __context_names:
      - openpipeline
    __description: >-
      Number of Snowflake task runs that ended in SUCCEEDED state within the collection window.
    __example: 142
    displayName: Snowflake task runs successful
    unit: count
dql_queries:
  - query_string: |
      timeseries failed = sum(snowflake.task.run.failed), by: { snowflake.task.name, deployment.environment.name }
    description: Plot the number of failed Snowflake task runs per task over time.
    description_copilot: Timeseries of failed Snowflake task runs per task name.
    context:
      - metrics
  - query_string: |
      timeseries {
        successful = sum(snowflake.task.run.successful),
        failed = sum(snowflake.task.run.failed),
        cancelled = sum(snowflake.task.run.cancelled)
      },
        by: { snowflake.task.name, deployment.environment.name }
    description: Compare successful, failed and cancelled Snowflake task runs per task over time.
    description_copilot: Timeseries comparing successful, failed and cancelled Snowflake task runs.
    context:
      - metrics
  - query_string: |
      timeseries credits = sum(snowflake.credits.used), by: { snowflake.task.name, deployment.environment.name }
    description: Plot credits consumed by Snowflake task runs per task over time.
    description_copilot: Timeseries of credits consumed per Snowflake task.
    context:
      - metrics
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "tasks"
      | sort timestamp desc
      | limit 100
    description: Fetch the 100 most recent DSOA tasks plugin log entries from Grail.
    description_copilot: Search for all tasks plugin logs from the Snowflake observability agent.
    context:
      - logs
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "tasks"
      | filter snowflake.task.run.state == "FAILED"
      | fields timestamp, snowflake.task.name, snowflake.warehouse.name, snowflake.task.run.state
      | sort timestamp desc
      | limit 50
    description: Fetch log entries for failed Snowflake task runs.
    description_copilot: Search for failed Snowflake task runs in the tasks plugin logs.
    context:
      - logs
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "tasks"
      | filter isNotNull(snowflake.task.name)
      | summarize { runs = count() }, by: { snowflake.task.name }
      | sort runs desc
      | limit 25
    description: Rank Snowflake tasks by number of recorded runs.
    description_copilot: Find which Snowflake tasks run most frequently.
    context:
      - logs
  - query_string: |
      fetch events
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "tasks"
      | sort timestamp desc
      | limit 50
    description: Fetch the most recent DSOA tasks lifecycle events (task graph version anchors).
    description_copilot: Search for Snowflake task graph lifecycle events from the tasks plugin.
    context:
      - events
  - query_string: |
      fetch events
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "tasks"
      | summarize { events = count() }, by: { snowflake.event.type }
      | sort events desc
    description: Count DSOA tasks lifecycle events grouped by event type.
    description_copilot: Break down Snowflake task lifecycle events by their event type.
    context:
      - events
  - query_string: |
      fetch events
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "tasks"
      | filter isNotNull(snowflake.task.name)
      | fields timestamp, snowflake.event.type, snowflake.task.name
      | sort timestamp desc
      | limit 25
    description: Inspect task lifecycle events with their task name and event type.
    description_copilot: Show Snowflake task lifecycle events with task name and event type.
    context:
      - events
