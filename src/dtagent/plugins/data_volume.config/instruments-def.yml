dimensions:
  db.collection.name:
    __type: string
    __example: analytics_db.public.sales_data
    __description: The full name of the table, including the catalog, schema, and table name.
  db.namespace:
    __type: string
    __example: analytics_db
    __description: The name of the database that contains the table.
  snowflake.table.type:
    __type: string
    __stability: stable
    __example: BASE TABLE
    __description: |
      The type of the table, such as:
      - BASE TABLE,
      - TEMPORARY TABLE,
      - EXTERNAL TABLE.
    __enum:
      allow_custom_values: true
      members:
        - id: base_table
          value: BASE TABLE
          brief: Full permanent table stored in Snowflake micro-partitions; supports all DML, Time Travel, and Fail-safe.
        - id: temporary_table
          value: TEMPORARY TABLE
          brief: Temporary table (session-scoped).
        - id: external_table
          value: EXTERNAL TABLE
          brief: Schema overlay over data files in an external cloud storage stage; data is never loaded into Snowflake and is read-only.
        - id: view
          value: VIEW
          brief: >-
            Non-materialized virtual table defined by a stored query; the underlying SQL is re-executed on every access with no physical
            storage.
        - id: materialized_view
          value: MATERIALIZED VIEW
          brief: >-
            Pre-computed query result stored as a physical table and transparently refreshed by Snowflake's background maintenance service;
            consumes MATERIALIZED_VIEW credits.

#  * Metric definitions
#  * KEY                    - will be matched against METRICS object with measurements prepared for sending
#  * VALUE[__description]   - __description of the metrics -
#                             in the future we should rather update semantic dictionary instead of pushing it constantly
#  * VALUE[unit]            - the unit of the metric

metrics:
  snowflake.data.rows:
    __type: long
    __example: 1000000
    __description: Sum of all rows in all objects in this scope.
    displayName: Row Count
    unit: rows
  snowflake.data.size:
    __type: long
    __example: 1073741824
    __description: Total size (in bytes) of all objects in this scope.
    displayName: Table Size in Bytes
    unit: bytes
  snowflake.table.time_since.last_ddl:
    __type: long
    __example: 2880
    __description: Time (in minutes) since last time given objects structure was altered.
    displayName: Time Since Last DDL
    unit: min
  snowflake.table.time_since.last_update:
    __type: long
    __example: 1440
    __description: Time (in minutes) since last time content of given objects was updated.
    displayName: Time Since Last Update
    unit: min

event_timestamps:
  snowflake.event.trigger:
    __type: string
    __example: "snowflake.table.update"
    __description:
      Additionally to sending logs, each entry in `EVENT_TIMESTAMPS` is sent as event with key set to `snowflake.event.trigger`, value to
      key from `EVENT_TIMESTAMPS` and `timestamp` set to the key value.
  snowflake.table.ddl:
    __type: string
    __example: "2024-11-01 12:00:00.000"
    __description: The timestamp of the last DDL operation performed on the table or view, including CREATE, ALTER, DROP, or UNDROP.
  snowflake.table.update:
    __type: long
    __stability: stable
    __example: "2024-11-10 16:45:00.000"
    __description: The timestamp of the last time the object was altered by a DML, DDL, or background metadata operation.
