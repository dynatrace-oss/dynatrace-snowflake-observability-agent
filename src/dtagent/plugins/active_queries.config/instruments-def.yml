attributes:
  db.operation.name:
    __semdict: ref
    __example: SELECT
    __type: string
    displayName: Database operation name
    __description: |
      The type of operation performed by the query, such as:
      - SELECT,
      - INSERT,
      - UPDATE.
  db.query.text:
    __semdict: ref
    __example: SELECT * FROM sales_data
    __type: string
    displayName: Database query text
    __description: The text of the SQL query.
  snowflake.session.id:
    __semdict: otel-only
    __stability: experimental
    __type: string
    displayName: Snowflake session ID
    __semdict_note: >-
      OTel semconv Development-tier attribute (session namespace). The semdict session.id is model-scoped/internal in code_monitoring only;
      no global ref available. Emitting as new id: pending global semdict registration.
    __example: "123456789"
    __description: The unique identifier for the session in which the query was executed.
  snowflake.error.code:
    __stability: stable
    __type: string
    displayName: Snowflake error code
    __example: "1001"
    __description: The error code returned by the operation, if any.
  snowflake.error.message:
    __stability: stable
    __type: string
    displayName: Snowflake error message
    __example: Syntax error in SQL statement
    __description: The error message returned by the operation, if any.
  snowflake.query.hash:
    __stability: stable
    __type: string
    displayName: Snowflake query text hash
    __example: hash_abcdef
    __description: The hash of the query text.
  snowflake.query.hash_version:
    __type: long
    displayName: Snowflake query hash version
    __example: 1
    __description: The version of the query hash logic.
  snowflake.query.id:
    __stability: stable
    __type: string
    displayName: Snowflake query ID
    __example: b1bbaa7f-8144-4e50-947a-b7e9bf7d62d5
    __description: The unique identifier for the SQL query.
  snowflake.query.parametrized_hash:
    __stability: stable
    __type: string
    displayName: Snowflake parameterized query text hash
    __example: param_hash_abcdef
    __description: The hash value of the parameterized query text.
  snowflake.query.parametrized_hash_version:
    __type: long
    displayName: Snowflake parameterized query hash version
    __example: 1
    __description: The version of the parameterized query hash logic.
  snowflake.query.tag:
    __stability: stable
    __type: string
    displayName: Snowflake query tag
    __example: daily_report
    __description: The query tag associated with the operation, if any.
  snowflake.schema.name:
    __stability: stable
    __type: string
    displayName: Snowflake schema name
    __example: public
    __description: The name of the schema.
  snowflake.warehouse.type:
    __stability: stable
    __type: string
    displayName: Snowflake warehouse type
    __example: STANDARD
    __description: The type of warehouse used to execute the query.
dimensions:
  db.namespace:
    __type: string
    displayName: Database name
    __semdict: ref
    __stability: stable
    __semdict_note: >-
      Defined in OTel Semantic Conventions (db.namespace, stable since v1.28). Not yet present as a globally referenceable field in the
      Dynatrace Semantic Dictionary. Emitting as id: pending global SD registration.
    __example: analytics_db
    __description: The name of the database in which the query was executed.
  db.user:
    __type: string
    displayName: Database user
    __semdict: otel-only
    __stability: experimental
    __semdict_note: >-
      Defined in OTel Semantic Conventions (db.user, experimental). Not yet present as a globally referenceable field in the Dynatrace
      Semantic Dictionary. Emitting as id: pending global SD registration.
    __example: john_doe
    __description: The name of the user who executed the query.
  snowflake.query.execution_status:
    __stability: stable
    __type: string
    displayName: Snowflake query execution status
    __example: FAILED_WITH_ERROR
    __description: |
      The execution status of the query, such as:
      - RESUMING_WAREHOUSE,
      - RUNNING,
      - QUEUED,
      - BLOCKED,
      - SUCCESS,
      - FAILED_WITH_ERROR,
      - FAILED_WITH_INCIDENT.
  snowflake.role.name:
    __stability: stable
    __type: string
    displayName: Snowflake role name
    __example: analyst_role
    __description: The name of the Snowflake role associated with the operation.
    __interface_note: The role active in the session at the time the query was executed.
  snowflake.warehouse.name:
    __stability: stable
    __type: string
    displayName: Snowflake warehouse name
    __example: compute_wh
    __description: The name of the Snowflake warehouse.

#  * Metric definitions
#  * KEY                    - will be matched against METRICS object with measurements prepared for sending
#  * VALUE[__description]   - __description of the metrics -
#                             in the future we should rather update semantic dictionary instead of pushing it constantly
#  * VALUE[unit]            - the unit of the metric

metrics:
  snowflake.time.compilation:
    __type: long
    __example: 5000
    __description: |
      The total compilation time of the currently running query.
    displayName: Snowflake query compilation time
    unit: ms
  snowflake.time.running:
    __type: long
    __example: 120000
    __description: |
      The total running time of the currently running query.
    displayName: Snowflake query running time
    unit: ms
  snowflake.time.execution:
    __type: long
    __example: 100000
    __description: Execution time (in milliseconds)
    displayName: Snowflake query execution time
    unit: ms
  snowflake.time.total_elapsed:
    __type: long
    __example: 120000
    __description: Elapsed time (in milliseconds).
    displayName: Snowflake query total elapsed time
    unit: ms
  snowflake.data.written_to_result:
    __type: long
    __example: 1048576
    __description: Number of bytes written to a result object.
    displayName: Snowflake bytes written to result
    unit: By
  snowflake.rows.written_to_result:
    __type: long
    __example: 1
    __description: Number of rows written to a result object. For CREATE TABLE AS SELECT (CTAS) and all DML operations, this result is 1;.
    displayName: Snowflake rows written to result
    unit: row
dql_queries:
  - query_string: |
      timeseries val = avg(snowflake.time.execution), by: { snowflake.warehouse.name, deployment.environment.name }
    description: Plot average execution time of currently running Snowflake queries per warehouse over time.
    description_copilot: Timeseries of Snowflake query execution time broken down by warehouse.
    context:
      - metrics
  - query_string: |
      timeseries {
        execution = avg(snowflake.time.execution),
        running = avg(snowflake.time.running),
        compilation = avg(snowflake.time.compilation)
      },
        by: { snowflake.warehouse.name, deployment.environment.name }
    description: Compare average compilation, execution and total running time of active Snowflake queries per warehouse.
    description_copilot: Timeseries comparing Snowflake query compilation, execution and running times per warehouse.
    context:
      - metrics
  - query_string: |
      timeseries p90 = percentile(snowflake.time.total_elapsed, 90),
        by: { snowflake.warehouse.name, snowflake.role.name, deployment.environment.name }
    description: Plot the 90th percentile total elapsed time of active Snowflake queries broken down by warehouse and role.
    description_copilot: Timeseries of the p90 total elapsed time of active Snowflake queries per warehouse and role.
    context:
      - metrics
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "active_queries"
      | sort timestamp desc
      | limit 100
    description: Fetch the 100 most recent DSOA active_queries plugin log entries from Grail.
    description_copilot: Search for all active_queries plugin logs from the Snowflake observability agent.
    context:
      - logs
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "active_queries"
      | filter snowflake.query.execution_status == "FAILED_WITH_ERROR"
      | sort timestamp desc
      | limit 50
    description: Fetch the 50 most recent active queries that failed with an error.
    description_copilot: Find failed Snowflake query executions reported by the active_queries plugin.
    context:
      - logs
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "active_queries"
      | filter isNotNull(snowflake.warehouse.name)
      | summarize { count = count(), avg_running_ms = avg(toLong(snowflake.time.running)) }, by: { snowflake.warehouse.name }
      | sort avg_running_ms desc
      | limit 20
    description: Rank warehouses by the average running time of their currently active Snowflake queries.
    description_copilot: Find which Snowflake warehouses have the slowest currently running queries by average running time.
    context:
      - logs
