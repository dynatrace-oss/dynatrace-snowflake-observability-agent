#  * Catalog of instrumentation known to Dynatrace Snowflake Observability Agent - users plugin

dimensions:
  db.user:
    __semdict: ref
    __stability: experimental
    __type: string
    displayName: Database user
    __example: admin
    __context_names:
      - users
    __description: The name of the database user associated with the operation.
    __interface_note: The Snowflake user account being described by this record.
attributes:
  snowflake.user.bypass_mfa_until:
    __type: long
    displayName: Snowflake user MFA bypass timestamp
    __example: 1620213179885000000
    __context_names:
      - users
    __description: The time until which the user can bypass MFA. Epoch nanoseconds timestamp.
  snowflake.user.comment:
    __type: string
    displayName: Snowflake user comment
    __example: New user account
    __context_names:
      - users
    __description: Any comments associated with the user.
  snowflake.user.default.namespace:
    __type: string
    displayName: Snowflake user default namespace
    __stability: stable
    __example: PUBLIC
    __context_names:
      - users
    __description: The default namespace for the user.
  snowflake.user.default.role:
    __type: string
    displayName: Snowflake user default role
    __stability: stable
    __example: SYSADMIN
    __context_names:
      - users
    __description: The default role for the user.
  snowflake.user.default.secondary_role:
    __type: string
    displayName: Snowflake user default secondary role
    __stability: stable
    __example: SECURITYADMIN
    __context_names:
      - users
    __description: The default secondary role for the user.
  snowflake.user.default.warehouse:
    __type: string
    displayName: Snowflake user default warehouse
    __stability: stable
    __example: COMPUTE_WH
    __context_names:
      - users
    __description: The default warehouse for the user.
  snowflake.user.display_name:
    __type: string
    displayName: Snowflake user display name
    __example: John Doe
    __context_names:
      - users
    __description: The display name of the user.
  snowflake.user.email:
    __type: string
    displayName: Snowflake user email address
    __example: jdoe@example.com
    __context_names:
      - users
    __description: The email address of the user.
  snowflake.user.expires_at:
    __type: long
    displayName: Snowflake user account expiration timestamp
    __example: 1620213179885000000
    __context_names:
      - users
    __description: The expiration date of the user account.
  snowflake.user.ext_authn.duo:
    __stability: stable
    __type: boolean
    displayName: Snowflake user Duo authentication indicator
    __example: true
    __context_names:
      - users
    __description: Indicates if Duo authentication is enabled for the user.
  snowflake.user.ext_authn.uid:
    __type: string
    displayName: Snowflake user external authentication UID
    __stability: stable
    __example: ext123
    __context_names:
      - users
    __description: The external authentication UID for the user.
  snowflake.user.has_mfa:
    __stability: stable
    __type: boolean
    displayName: Snowflake user MFA enrollment indicator
    __example: true
    __context_names:
      - users
    __description: Indicates if the user is enrolled for multi-factor authentication.
  snowflake.user.has_password:
    __stability: stable
    __type: boolean
    displayName: Snowflake user password indicator
    __example: true
    __context_names:
      - users
    __description: Indicates if the user has a password set.
  snowflake.user.has_pat:
    __stability: stable
    __type: boolean
    displayName: Snowflake user programmatic access token indicator
    __example: true
    __context_names:
      - users
    __description: Indicates if a programmatic access token has been generated for the user.
  snowflake.user.has_rsa:
    __stability: stable
    __type: boolean
    displayName: Snowflake user RSA key authentication indicator
    __example: true
    __context_names:
      - users
    __description: Indicates if RSA public key authentication is configured for the user.
  snowflake.user.has_workload_identity:
    __type: boolean
    displayName: Snowflake user workload identity indicator
    __example: true
    __context_names:
      - users
    __description: Indicates if workload identity federation is configured for the user.
  snowflake.user.id:
    __type: long
    displayName: Snowflake user ID
    __example: 12345
    __context_names:
      - users
    __description: The unique identifier for the user.
  snowflake.user.is_disabled:
    __stability: stable
    __type: boolean
    displayName: Snowflake user disabled indicator
    __example: false
    __context_names:
      - users
    __description: Indicates if the user account is disabled.
  snowflake.user.is_locked:
    __stability: stable
    __type: boolean
    displayName: Snowflake user locked indicator
    __example: false
    __context_names:
      - users
    __description: Indicates if the user account is locked by Snowflake.
  snowflake.user.is_from_organization:
    __type: boolean
    displayName: Snowflake user organization import indicator
    __example: true
    __context_names:
      - users
    __description: Indicates if the user was imported from a global organization.
  snowflake.user.locked_until_time:
    __type: long
    displayName: Snowflake user locked until timestamp
    __example: 1615479617866000000
    __context_names:
      - users
    __description: The time until which the user account is locked.
  snowflake.user.must_change_password:
    __type: boolean
    displayName: Snowflake user password change required indicator
    __example: true
    __context_names:
      - users
    __description: Indicates if the user must change their password.
  snowflake.user.name.login:
    __type: string
    displayName: Snowflake user login name
    __example: jdoe
    __context_names:
      - users
    __description: The login name of the user.
  snowflake.user.name.first:
    __type: string
    displayName: Snowflake user first name
    __stability: stable
    __example: John
    __context_names:
      - users
    __description: The first name of the user.
  snowflake.user.name.last:
    __type: string
    displayName: Snowflake user last name
    __stability: stable
    __example: Doe
    __context_names:
      - users
    __description: The last name of the user.
  snowflake.user.owner:
    __type: string
    displayName: Snowflake user owner role
    __stability: stable
    __example: ACCOUNTADMIN
    __context_names:
      - users
    __description: The role that owns the user account.
  snowflake.user.type:
    __type: string
    displayName: Snowflake user type
    __stability: stable
    __example: LEGACY_SERVICE
    __context_names:
      - users
    __description: Specifies the type of user
    __enum:
      allow_custom_values: true
      members:
        - id: person
          value: PERSON
          brief: Human interactive user.
        - id: service
          value: SERVICE
          brief: >-
            Non-interactive integration user; cannot authenticate via password or SAML, cannot enroll in MFA. Recommended for all automated
            service accounts.
        - id: legacy_service
          value: LEGACY_SERVICE
          brief: >-
            Non-interactive integration user that, unlike SERVICE, still permits password and SAML authentication. Deprecated — migrate to
            SERVICE type.
        - id: snowflake_service
          value: SNOWFLAKE_SERVICE
          brief: >-
            System-managed user automatically created for each Snowpark Container Services (SPCS) service; cannot be created or converted by
            administrators.
  snowflake.user.privilege.name:
    __type: string
    displayName: Snowflake user privilege name
    __stability: stable
    __example: "CREATE SERVICE:SCHEMA"
    __context_names:
      - users_all_privileges
    __description:
      Name of the privilege and type of object this privilege granted on to the user or role. Composed as `privilege:granted_on_object`.
  snowflake.user.privilege.grants_on:
    __type: string[]
    displayName: Snowflake user privilege grant targets
    __semdict_note: "Array of privilege grant target names stored as string[] in Grail."
    __example:
      - ["TRUST_CENTER_ADMIN", "COMPUTE_WH"]
    __context_names:
      - users_all_privileges
    __description:
      List of all objects of given type on which given privilege was given; both object type and privilege are reported as
      `snowflake.user.privilege.name`
  snowflake.user.privilege.granted_by:
    __type: string[]
    displayName: Snowflake user privilege grantor roles
    __semdict_note: "Array of grantor role names stored as string[] in Grail."
    __example:
      - ["ACCOUNTADMIN"]
    __context_names:
      - users_all_privileges
    __description: Array of all roles which granted grants to a user for a privilege.
  snowflake.user.roles.all:
    __type: string
    displayName: Snowflake user all roles
    __example: "SNOWFLAKE_FINANCE,MONITORING"
    __context_names:
      - users_all_roles
    __description: Comma separated list of all roles granted to a user.
  snowflake.user.roles.granted_by:
    __type: string[]
    displayName: Snowflake user role grantor roles
    __semdict_note: "Array of grantor names for role assignments stored as string[] in Grail."
    __example:
      - ["DEMIGOD", "SECURITYADMIN", "ACCOUNTADMIN"]
    __context_names:
      - users_all_roles
      - users_direct_roles
    __description: Array of admin roles that were used to grant current list of user roles.
  snowflake.user.roles.direct.list:
    __stability: stable
    __type: string[]
    displayName: Snowflake user direct roles
    __semdict_note: "Array of directly assigned role names stored as string[] in Grail."
    __example:
      - ["DEVOPS_ROLE", "SYSADMIN", "ACCOUNTADMIN"]
    __context_names:
      - users_direct_roles
    __description: List of all direct roles granted to user.
  snowflake.user.roles.direct.removed:
    __type: string
    displayName: Snowflake user removed direct role
    __stability: stable
    __example: "ACCOUNTADMIN"
    __context_names:
      - users_removed_direct_roles
    __description: Name of the role that was revoked from user.
event_timestamps:
  snowflake.event.trigger:
    __type: string
    displayName: Snowflake event trigger
    __example: "snowflake.user.last_success_login"
    __context_names:
      - users
      - users_all_privileges
      - users_all_roles
      - users_direct_roles
      - users_removed_direct_roles
    __description:
      Additionally to sending logs, each entry in `EVENT_TIMESTAMPS` is sent as event with key set to `snowflake.event.trigger`, value to
      key from `EVENT_TIMESTAMPS` and `timestamp` set to the key value.
  snowflake.user.privilege.last_altered:
    __type: long
    displayName: Snowflake user privilege last altered timestamp
    __example: 1732181350954000000
    __context_names:
      - users_all_privileges
    __description: The timestamp of the last alteration to the user's privileges.
  snowflake.user.roles.last_altered:
    __type: long
    displayName: Snowflake user roles last altered timestamp
    __example: 1718260900411000000
    __context_names:
      - users_all_roles
      - users_direct_roles
    __description: The timestamp of the last alteration to the roles granted to the user.
  snowflake.user.created_on:
    __type: long
    displayName: Snowflake user account creation timestamp
    __example: 1651830381846000000
    __context_names:
      - users
    __description: The timestamp of the user account creation.
  snowflake.user.deleted_on:
    __type: long
    displayName: Snowflake user account deletion timestamp
    __example: 1615219846384000000
    __context_names:
      - users
    __description: The timestamp of the user account deletion.
  snowflake.user.last_success_login:
    __stability: stable
    __type: long
    displayName: Snowflake user last successful login timestamp
    __example: 1732181350954000000
    __context_names:
      - users
    __description: The timestamp of the last successful login by the user.
  snowflake.user.password_last_set_time:
    __type: long
    displayName: Snowflake user password last set timestamp
    __example: 1615219848053000000
    __context_names:
      - users
    __description: The timestamp of the last password change for the user.
  snowflake.user.roles.direct.removed_on:
    __type: long
    displayName: Snowflake user direct role removal timestamp
    __example: 1718260900411000000
    __context_names:
      - users_removed_direct_roles
    __description: The timestamp of the last removal of a direct role from the user.
dql_queries:
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "users"
      | sort timestamp desc
      | limit 100
    description: Fetch the 100 most recent DSOA users plugin log entries from Grail.
    description_copilot: Search for all users plugin logs from the Snowflake observability agent.
    context:
      - logs
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "users"
      | filter snowflake.user.is_disabled == "true"
      | sort timestamp desc
      | limit 50
    description: Fetch log entries for disabled Snowflake users from the users plugin.
    description_copilot: Search for disabled Snowflake user records in the users plugin logs.
    context:
      - logs
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "users"
      | filter snowflake.user.has_mfa == "false"
      | sort timestamp desc
      | limit 50
    description: Fetch log entries for Snowflake users without MFA enabled.
    description_copilot: Search for Snowflake users that do not have MFA configured.
    context:
      - logs
  - query_string: |
      fetch events
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "users"
      | sort timestamp desc
      | limit 20
    description: Fetch recent DSOA users lifecycle events.
    description_copilot: Search for recent Snowflake users lifecycle events from the users plugin.
    context:
      - events
  - query_string: |
      fetch events
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "users"
      | sort timestamp desc
      | limit 50
    description: Fetch the most recent DSOA users lifecycle events (creation, deletion and role-change anchors).
    description_copilot: Search for Snowflake user lifecycle events from the users plugin.
    context:
      - events
  - query_string: |
      fetch events
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "users"
      | summarize { events = count() }, by: { snowflake.event.type }
      | sort events desc
    description: Count DSOA users lifecycle events grouped by event type.
    description_copilot: Break down Snowflake user lifecycle events by their event type.
    context:
      - events
