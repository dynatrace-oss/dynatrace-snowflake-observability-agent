attributes:
  db.user:
    __context_names:
      - warehouse_usage
    __example: admin
    __description: The user who initiated the event.
  snowflake.query.id:
    __context_names:
      - warehouse_usage
    __example: query123
    __description: The unique identifier for the query associated with the event.
  snowflake.role.name:
    __context_names:
      - warehouse_usage
    __example: SYSADMIN
    __description: The role name associated with the event.
  snowflake.warehouse.cluster.number:
    __field_type: resource
    __context_names:
      - warehouse_usage
    __example: "1"
    __description: The number of the cluster within the warehouse.
  snowflake.warehouse.clusters.count:
    __field_type: resource
    __context_names:
      - warehouse_usage
    __example: "2"
    __description: The number of clusters in the warehouse.
  snowflake.warehouse.event.reason:
    __context_names:
      - warehouse_usage
    __example: USER_REQUEST
    __description: The reason for the event.
    __enum:
      allow_custom_values: true
      members:
        - id: resource_monitor_suspend
          value: RESOURCE_MONITOR_SUSPEND
          brief: Warehouse was suspended because a resource monitor reached its SUSPEND or SUSPEND_IMMEDIATE threshold.
        - id: warehouse_autoresume
          value: WAREHOUSE_AUTORESUME
          brief: Warehouse resumed automatically because AUTO_RESUME is enabled and a SQL statement was submitted while suspended.
        - id: warehouse_autosuspend
          value: WAREHOUSE_AUTOSUSPEND
          brief: Warehouse suspended automatically after the configured AUTO_SUSPEND inactivity period elapsed.
        - id: warehouse_resume
          value: WAREHOUSE_RESUME
          brief: Warehouse was resumed explicitly via ALTER WAREHOUSE RESUME or a user-initiated action.
        - id: warehouse_suspend
          value: WAREHOUSE_SUSPEND
          brief: Warehouse was suspended explicitly via ALTER WAREHOUSE SUSPEND or a user-initiated action.
  snowflake.warehouse.id:
    __field_type: resource
    __context_names:
      - warehouse_usage
      - warehouse_usage_load
      - warehouse_usage_metering
    __example: wh123
    __description: The unique identifier for the warehouse.
  snowflake.warehouse.size:
    __field_type: resource
    __context_names:
      - warehouse_usage
    __example: X-SMALL
    __description: The size of the warehouse.
    __enum:
      allow_custom_values: true
      members:
        - id: x_small
          value: X-SMALL
          brief: Smallest warehouse size; 1 credit/hour. Default size when creating a warehouse via SQL or Snowsight.
        - id: small
          value: SMALL
          brief: 2 credits/hour; double the compute resources of X-Small.
        - id: medium
          value: MEDIUM
          brief: 4 credits/hour; suited for moderate-complexity queries and concurrent workloads.
        - id: large
          value: LARGE
          brief: 8 credits/hour; provides substantially more compute resources per cluster for complex queries.
        - id: x_large
          value: X-LARGE
          brief: 16 credits/hour; suitable for large-scale ETL and analytics.
        - id: x2_large
          value: 2X-LARGE
          brief: 32 credits/hour; credit consumption doubles at each step from X-Large.
        - id: x3_large
          value: 3X-LARGE
          brief: 64 credits/hour.
        - id: x4_large
          value: 4X-LARGE
          brief: 128 credits/hour.
        - id: x5_large
          value: 5X-LARGE
          brief: 256 credits/hour; generally available on AWS and Azure.
        - id: x6_large
          value: 6X-LARGE
          brief: 512 credits/hour; largest available size, generally available on AWS and Azure.
dimensions:
  snowflake.warehouse.event.name:
    __field_type: signal
    __context_names:
      - warehouse_usage
    __example: WAREHOUSE_START
    __description: The name of the event.
    __enum:
      allow_custom_values: true
      members:
        - id: alter_warehouse
          value: ALTER_WAREHOUSE
          brief: A warehouse property was modified via ALTER WAREHOUSE (e.g. size, auto-suspend timeout, comment).
        - id: create_warehouse
          value: CREATE_WAREHOUSE
          brief: A new virtual warehouse was created.
        - id: drop_warehouse
          value: DROP_WAREHOUSE
          brief: A virtual warehouse was dropped and its compute resources released.
        - id: resume_cluster
          value: RESUME_CLUSTER
          brief: An individual cluster within a multi-cluster warehouse was resumed to meet increased demand.
        - id: resume_warehouse
          value: RESUME_WAREHOUSE
          brief: The warehouse transitioned from SUSPENDED to STARTED, reprovisioning compute resources.
        - id: suspend_cluster
          value: SUSPEND_CLUSTER
          brief: An individual cluster within a multi-cluster warehouse was suspended due to reduced demand.
        - id: suspend_warehouse
          value: SUSPEND_WAREHOUSE
          brief: The warehouse transitioned from STARTED to SUSPENDED, deallocating all compute resources.
        - id: warehouse_consistent
          value: WAREHOUSE_CONSISTENT
          brief: All pending state changes for the warehouse have settled; emitted as the final event in a multi-step operation sequence.
  snowflake.warehouse.event.state:
    __field_type: signal
    __context_names:
      - warehouse_usage
    __example: STARTED
    __description: The state of the event, such as STARTED or COMPLETED.
    __enum:
      allow_custom_values: true
      members:
        - id: started
          value: STARTED
          brief: The warehouse operation has been initiated and is in progress; a COMPLETED or further STARTED event will follow.
        - id: completed
          value: COMPLETED
          brief: The warehouse operation completed atomically with no further pending state changes.
  snowflake.warehouse.name:
    __context_names:
      - warehouse_usage
      - warehouse_usage_load
      - warehouse_usage_metering
    __example: COMPUTE_WH
    __description: The name of the warehouse.
metrics:
  snowflake.credits.cloud_services:
    __context_names:
      - warehouse_usage_metering
    __example: "2"
    __description: The number of credits used for cloud services.
    displayName: Cloud Services Credits Used
    unit: credits
  snowflake.credits.compute:
    __context_names:
      - warehouse_usage_metering
    __example: "8"
    __description: The number of credits used for compute.
    displayName: Compute Credits Used
    unit: credits
  snowflake.credits.used:
    __context_names:
      - warehouse_usage_metering
    __example: "10"
    __description: The total number of credits used by the warehouse.
    displayName: Snowflake Credits Used
    unit: credits
  snowflake.load.blocked:
    __context_names:
      - warehouse_usage_load
    __example: "0"
    __description: The average number of queries blocked by a transaction lock.
    displayName: Average Blocked Queries
    unit: count
  snowflake.load.queued.overloaded:
    __context_names:
      - warehouse_usage_load
    __example: "2"
    __description: The average number of queries queued due to load.
    displayName: Average Queued Queries (Load)
    unit: count
  snowflake.load.queued.provisioning:
    __context_names:
      - warehouse_usage_load
    __example: "1"
    __description: The average number of queries queued due to provisioning.
    displayName: Average Queued Queries (Provisioning)
    unit: count
  snowflake.load.running:
    __context_names:
      - warehouse_usage_load
    __example: "5"
    __description: The average number of running queries.
    displayName: Average Running Queries
    unit: count
