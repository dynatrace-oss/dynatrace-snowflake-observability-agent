metrics:
  snowflake.credits.used:
    __type: double
    __example: 15
    __description:
      Number of credits billed for loading data into the event table
      during the START_TIME and END_TIME window.
    displayName: Snowflake Credits Used
    unit: credits
  snowflake.data.ingested:
    __type: long
    __example: 10485760
    __description:
      Number of bytes of data loaded during the START_TIME and END_TIME
      window.
    displayName: Bytes Ingested for Event Table
    unit: By

dql_queries:
  - query_string: |
      timeseries val = sum(snowflake.credits.used), by: { deployment.environment }
      | filter db.system == "snowflake"
    description: Plot credits billed for loading data into the event table over time.
    description_copilot: Timeseries of Snowflake event table credit usage.
    internal: false
  - query_string: |
      timeseries val = sum(snowflake.data.ingested), by: { deployment.environment }
      | filter db.system == "snowflake"
    description: Plot bytes of data loaded into the event table over time.
    description_copilot: Timeseries of Snowflake event table data ingestion volume.
    internal: false
  - query_string: |
      timeseries credits = sum(snowflake.credits.used), bytes = sum(snowflake.data.ingested), by: { deployment.environment }
      | filter db.system == "snowflake"
      | fieldsAdd credits_per_byte = credits / bytes
    description: Plot event table ingestion cost efficiency (credits per byte ingested) over time.
    description_copilot: Timeseries of Snowflake event table cost efficiency.
    internal: false
