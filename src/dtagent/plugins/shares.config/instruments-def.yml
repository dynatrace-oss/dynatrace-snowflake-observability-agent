attributes:
  snowflake.data.rows:
    __type: long
    displayName: Snowflake table row count
    __context_names:
      - inbound_shares
    __example: 20000
    __description: Number of rows in the Snowflake object.
  snowflake.data.size:
    __type: long
    displayName: Snowflake table size
    __context_names:
      - inbound_shares
    __example: 800000
    __description: Size in bytes of the Snowflake object.
    __interface_note: Measured as bytes accessed by a full table scan.
  snowflake.error.message:
    __type: string
    displayName: Snowflake share status error message
    __stability: stable
    __context_names:
      - inbound_shares
    __example: Shared database is no longer available
    __description: The error message returned by the operation, if any.
    __interface_note: Provides additional context about the share status when unavailable or inaccessible.
  snowflake.grant.by:
    __type: string
    __stability: stable
    __context_names:
      - outbound_shares
    __example: ACCOUNTADMIN
    __description: Shows the name of the account which made the grant.
    displayName: Snowflake account making the grant
  snowflake.grant.grantee:
    __type: string
    __stability: stable
    __context_names:
      - outbound_shares
    __example: PARTNER_ACCOUNT
    __description: Shows the grantee account name.
    displayName: Snowflake account receiving the grant
  snowflake.grant.on:
    __type: string
    __stability: stable
    __context_names:
      - outbound_shares
    __example: DATABASE
    __description: Shows on what type of object the grant was made.
    displayName: Snowflake grant object type
  snowflake.grant.option:
    __type: boolean
    __context_names:
      - outbound_shares
    __example: false
    __description: Indicates if grant option is available.
    displayName: Snowflake grant option availability
  snowflake.grant.privilege:
    __type: string
    __stability: stable
    __context_names:
      - outbound_shares
    __example: USAGE
    __description: Shows the type of privilege granted.
    displayName: Snowflake privilege granted
  snowflake.grant.to:
    __type: string
    __context_names:
      - outbound_shares
    __example: SHARE
    __description: Shows to what the grant was made.
    displayName: Snowflake share grant recipient
  snowflake.share.is_secure_objects_only:
    __type: boolean
    __stability: stable
    __context_names:
      - outbound_shares
      - inbound_shares
    __example: true
    __description: Indicates if the share is only for secure objects.
    displayName: Snowflake share secure objects only indicator
  snowflake.share.kind:
    __type: string
    displayName: Snowflake share type
    __stability: stable
    __context_names:
      - outbound_shares
      - inbound_shares
    __example: OUTBOUND
    __description: Indicates the type of share.
  snowflake.share.listing_global_name:
    __type: string
    __context_names:
      - outbound_shares
      - inbound_shares
    __example: GLOBAL_SHARE_NAME
    __description: Global name of the share listing.
    displayName: Snowflake share global name
  snowflake.share.owner:
    __type: string
    displayName: Snowflake share owner role
    __stability: stable
    __context_names:
      - outbound_shares
      - inbound_shares
    __example: ACCOUNTADMIN
    __description: Shows the account owning the share.
  snowflake.share.shared_from:
    __type: string
    __context_names:
      - outbound_shares
      - inbound_shares
    __example: SNOWFLAKE
    __description: Shows the owner account of the share.
    displayName: Snowflake share owner account
  snowflake.share.shared_to:
    __type: string
    __context_names:
      - outbound_shares
      - inbound_shares
    __example: PARTNER_ACCOUNT
    __description: Shows the account the share was made to.
    displayName: Snowflake share recipient account
  snowflake.table.clustering_key:
    __type: string
    displayName: Snowflake table clustering key
    __context_names:
      - inbound_shares
    __example: DATE
    __description: Clustering key for the table.
  snowflake.table.comment:
    __type: string
    __context_names:
      - inbound_shares
    __example: The tables defined in this database that are accessible to the current user's role.
    __description: Comment for this table.
    displayName: Snowflake table comment
  snowflake.table.is_auto_clustering_on:
    __type: boolean
    __context_names:
      - inbound_shares
    __example: true
    __description: Indicates whether automatic clustering is enabled for the table.
    displayName: Snowflake automatic table clustering indicator
  snowflake.table.is_dynamic:
    __type: boolean
    __context_names:
      - inbound_shares
    __example: false
    __description: Indicates whether the table is a dynamic table.
    displayName: Snowflake dynamic table indicator
  snowflake.table.is_iceberg:
    __type: boolean
    __context_names:
      - inbound_shares
    __example: false
    __description: Indicates whether the table is an Iceberg table.
    displayName: Snowflake Iceberg table indicator
  snowflake.table.is_temporary:
    __type: boolean
    __context_names:
      - inbound_shares
    __example: false
    __description: Indicates whether this is a temporary table.
    displayName: Snowflake temporary table indicator
  snowflake.table.is_transient:
    __type: boolean
    __context_names:
      - inbound_shares
    __example: false
    __description: Indicates whether this is a transient table.
    displayName: Snowflake transient table indicator
  snowflake.table.is_hybrid:
    __type: boolean
    __context_names:
      - inbound_shares
    __example: false
    __description: Indicates whether this is a hybrid table.
    displayName: Snowflake hybrid table indicator
  snowflake.share.has_details_reported:
    __type: boolean
    __context_names:
      - inbound_shares
    __example: false
    __description: Indicates whether or not details on this share should be reported.
    displayName: Snowflake share details reported indicator
  snowflake.share.status:
    __type: string
    displayName: Snowflake share availability status
    __stability: stable
    __context_names:
      - inbound_shares
    __example: UNAVAILABLE
    __description: Indicates the availability status of the share. Set to UNAVAILABLE when the shared database is no longer accessible.
  snowflake.table.last_ddl_by:
    __type: string
    __context_names:
      - inbound_shares
    __example: DBA_USER
    __description: The current username for the user who executed the last DDL operation.
    displayName: Snowflake table last DDL executor
  snowflake.table.owner:
    __type: string
    displayName: Snowflake table owner role
    __context_names:
      - inbound_shares
    __example: ACCOUNTADMIN
    __description: Name of the role that owns the table.
  snowflake.table.retention_time:
    __type: long
    displayName: Snowflake table time travel retention days
    __context_names:
      - inbound_shares
    __example: 5
    __description: Number of days that historical data is retained for Time Travel.
  snowflake.table.type:
    __type: string
    displayName: Snowflake table type
    __stability: stable
    __context_names:
      - inbound_shares
    __example: BASE TABLE
    __description: Indicates the table type.
dimensions:
  db.collection.name:
    __semdict: ref
    __type: string
    displayName: Snowflake shared table name
    __context_names:
      - inbound_shares
    __example: SALES_DATA
    __description: Name of the shared Snowflake table.
  snowflake.table.full_name:
    __type: string
    __stability: stable
    __context_names:
      - inbound_shares
    __example: SHARE_DB.PUBLIC.SALES_DATA
    __description: Fully qualified name of the Snowflake table (database.schema.table).
    displayName: Snowflake fully qualified table name
  db.namespace:
    __semdict: ref
    __type: string
    displayName: Snowflake database name
    __context_names:
      - outbound_shares
      - inbound_shares
    __example: DEV_DB
    __description: Name of the database used to store shared data.
  snowflake.grant.name:
    __type: string
    displayName: Snowflake share grant name
    __stability: stable
    __context_names:
      - outbound_shares
    __example: READ_ACCESS
    __description: Name of the grant to a share.
  snowflake.schema.name:
    __type: string
    displayName: Snowflake schema name
    __stability: stable
    __context_names:
      - inbound_shares
    __example: PUBLIC
    __description: The name of the schema.
  snowflake.share.name:
    __type: string
    displayName: Snowflake share name
    __stability: stable
    __context_names:
      - outbound_shares
      - inbound_shares
    __example: SAMPLE_DATA
    __description: Name of the share.
event_timestamps:
  snowflake.event.trigger:
    __type: string
    displayName: Snowflake event trigger
    __context_names:
      - outbound_shares
      - inbound_shares
    __example: "snowflake.grant.created_on"
    __description:
      Additionally to sending logs, each entry in `EVENT_TIMESTAMPS` is sent as event with key set to `snowflake.event.trigger`, value to
      key from `EVENT_TIMESTAMPS` and `timestamp` set to the key value.
  snowflake.grant.created_on:
    __stability: stable
    __type: long
    __context_names:
      - outbound_shares
    __example: 1639051180946000000
    __description: The timestamp when the grant was created. Epoch nanoseconds timestamp.
    displayName: Snowflake grant creation time
  snowflake.share.created_on:
    __stability: stable
    __context_names:
      - shares
    __type: long
    __example: 1639051180714000000
    __description: The timestamp when the share was created. Epoch nanoseconds timestamp.
    displayName: Snowflake share creation time
  snowflake.table.created_on:
    __type: long
    __context_names:
      - inbound_shares
    __example: 1649940827875000000
    __description: The timestamp when the table was created. Epoch nanoseconds timestamp.
    displayName: Snowflake table creation time
  snowflake.table.ddl:
    __type: long
    __context_names:
      - inbound_shares
    __example: 1639940327875000000
    __description: The timestamp of the last DDL operation performed on the table or view.
    displayName: Snowflake table last DDL time
  snowflake.table.update:
    __stability: stable
    __type: long
    __context_names:
      - inbound_shares
    __example: 1649962827875000000
    __description: The timestamp when the object was last altered by a DML, DDL, or background metadata operation.
    displayName: Snowflake table last update time
dql_queries:
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter in(dsoa.run.context, {"inbound_shares", "outbound_shares"})
      | sort timestamp desc
      | limit 100
    description: Fetch the 100 most recent DSOA shares plugin log entries (inbound and outbound shares) from Grail.
    description_copilot: Search for all shares plugin logs from the Snowflake observability agent.
    context:
      - logs
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.context == "outbound_shares"
      | filter isNotNull(snowflake.share.name)
      | fields timestamp, snowflake.share.name, snowflake.table.full_name
      | sort timestamp desc
      | limit 50
    description: Inspect outbound Snowflake shares and the objects they expose.
    description_copilot: Show Snowflake outbound shares and the tables they expose.
    context:
      - logs
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter in(dsoa.run.context, {"inbound_shares", "outbound_shares"})
      | filter isNotNull(snowflake.share.name)
      | summarize { objects = count() }, by: { snowflake.share.name }
      | sort objects desc
      | limit 25
    description: Rank Snowflake shares by the number of shared objects they contain.
    description_copilot: Find which Snowflake shares expose the most objects.
    context:
      - logs
  - query_string: |
      fetch events
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "shares"
      | sort timestamp desc
      | limit 20
    description: Fetch recent DSOA shares lifecycle events.
    description_copilot: Search for recent Snowflake shares lifecycle events from the shares plugin.
    context:
      - events
  - query_string: |
      fetch events
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "shares"
      | sort timestamp desc
      | limit 50
    description: Fetch the most recent DSOA shares lifecycle events (share, grant and table creation anchors).
    description_copilot: Search for Snowflake share and grant lifecycle events from the shares plugin.
    context:
      - events
  - query_string: |
      fetch events
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "shares"
      | summarize { events = count() }, by: { snowflake.event.type }
      | sort events desc
    description: Count DSOA shares lifecycle events grouped by event type.
    description_copilot: Break down Snowflake share lifecycle events by their event type.
    context:
      - events
