#  * Catalog of instrumentation known to Dynatrace Snowflake Observability Agent - event_log plugin (empty for now)

dimensions:
  db.namespace:
    __semdict: ref
    __type: string
    __example: PROD_DB
    __description: The name of the database that was specified in the context of the query at compilation.
    __context_names:
      - event_log_metrics
      - event_log_spans
  snowflake.schema.name:
    __type: string
    __stability: stable
    __example: public
    __description: The name of the schema in which the query was executed.
    __context_names:
      - event_log_metrics
      - event_log_spans
  snowflake.role.name:
    __type: string
    __stability: stable
    __example: SYSADMIN
    __description: The role used to execute the query.
    __context_names:
      - event_log_metrics
      - event_log_spans
  snowflake.warehouse.name:
    __type: string
    __stability: stable
    __example: COMPUTE_WH
    __description: The warehouse used to execute the query.
    __context_names:
      - event_log_metrics
      - event_log_spans
  snowflake.query.id:
    __type: string
    __stability: stable
    __example: b1bbaa7f-8144-4e50-947a-b7e9bf7d62d5
    __description: The unique identifier for the query.
    __context_names:
      - event_log_metrics
      - event_log_spans

metrics:
  process.cpu.utilization:
    __type: double
    displayName: "Process CPU Utilization"
    unit: "%"
    __context_names:
      - event_log_metrics
    __example: 0.015
    __description: "The percentage of CPU utilization by the process."
    __is_defined_at_runtime: true
  process.memory.usage:
    __type: double
    displayName: "Process Memory Usage"
    unit: By
    __context_names:
      - event_log_metrics
    __example: 34844672
    __description: "The total memory usage by the process in bytes."
    __is_defined_at_runtime: true
dql_queries:
  - query_string: |
      timeseries mem = avg(process.memory.usage), by: { snowflake.warehouse.name, deployment.environment.name }
    description: Plot average process memory usage captured from the Snowflake event table over time.
    description_copilot: Timeseries of Snowflake process memory usage from the event log.
    internal: false
    context:
      - metrics
  - query_string: |
      timeseries cpu = avg(process.cpu.utilization), by: { snowflake.warehouse.name, deployment.environment.name }
    description: Plot average process CPU utilization captured from the Snowflake event table over time.
    description_copilot: Timeseries of Snowflake process CPU utilization from the event log.
    internal: false
    context:
      - metrics
  - query_string: |
      timeseries { mem = avg(process.memory.usage), cpu = avg(process.cpu.utilization) },
        by: { snowflake.warehouse.name, deployment.environment.name }
    description: Compare process memory usage and CPU utilization per warehouse from the Snowflake event table.
    description_copilot: Timeseries comparing Snowflake process memory and CPU from the event log.
    internal: false
    context:
      - metrics
  - query_string: |
      fetch spans
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "event_log"
      | sort timestamp desc
      | limit 50
    description: Fetch the 50 most recent DSOA event_log spans (traced records from the Snowflake event table).
    description_copilot: Find event_log span traces produced by the Snowflake observability agent.
    internal: false
    context:
      - spans
  - query_string: |
      fetch spans
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "event_log"
      | filter isNotNull(snowflake.query.id)
      | fields timestamp, snowflake.query.id, snowflake.warehouse.name, snowflake.role.name
      | sort timestamp desc
      | limit 50
    description: Inspect event_log spans correlated to a Snowflake query, including warehouse and role context.
    description_copilot: Show event_log spans linked to Snowflake queries with their warehouse and role.
    internal: false
    context:
      - spans
  - query_string: |
      fetch spans
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "event_log"
      | filter isNotNull(snowflake.warehouse.name)
      | summarize { spans = count() }, by: { snowflake.warehouse.name }
      | sort spans desc
    description: Count event_log spans grouped by warehouse.
    description_copilot: Break down event_log spans by Snowflake warehouse.
    internal: false
    context:
      - spans
