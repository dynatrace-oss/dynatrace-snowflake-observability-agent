#  * Catalog of instrumentation known to Dynatrace Snowflake Observability Agent - event_log plugin (empty for now)

dimensions:
  db.namespace:
    __type: string
    __example: PROD_DB
    __description: The name of the database that was specified in the context of the query at compilation.
    __context_names:
      - event_log_metrics
      - event_log_spans
  snowflake.schema.name:
    __type: string
    __stability: stable
    __example: public
    __description: The name of the schema in which the query was executed.
    __context_names:
      - event_log_metrics
      - event_log_spans
  snowflake.role.name:
    __type: string
    __stability: stable
    __example: SYSADMIN
    __description: The role used to execute the query.
    __context_names:
      - event_log_metrics
      - event_log_spans
  snowflake.warehouse.name:
    __type: string
    __stability: stable
    __example: COMPUTE_WH
    __description: The warehouse used to execute the query.
    __context_names:
      - event_log_metrics
      - event_log_spans
  snowflake.query.id:
    __type: string
    __stability: stable
    __example: b1bbaa7f-8144-4e50-947a-b7e9bf7d62d5
    __description: The unique identifier for the query.
    __context_names:
      - event_log_metrics
      - event_log_spans

metrics:
  process.cpu.utilization:
    __type: double
    displayName: "Process CPU Utilization"
    unit: "%"
    __context_names:
      - event_log_metrics
    __example: 0.015
    __description: "The percentage of CPU utilization by the process."
    __is_defined_at_runtime: true
  process.memory.usage:
    __type: double
    displayName: "Process Memory Usage"
    unit: By
    __context_names:
      - event_log_metrics
    __example: 34844672
    __description: "The total memory usage by the process in bytes."
    __is_defined_at_runtime: true
dql_queries:
  - query_string: |
      fetch spans
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "event_log"
      | sort timestamp desc
      | limit 50
    description: Fetch the 50 most recent DSOA event_log spans from Snowflake EVENT table processing.
    description_copilot: Search for event_log span traces produced by the Snowflake observability agent.
    internal: false
  - query_string: |
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "event_log"
      | sort timestamp desc
      | limit 100
    description: Fetch the 100 most recent DSOA event_log plugin log entries from Grail.
    description_copilot: Search for all event_log plugin logs from the Snowflake observability agent.
    internal: false
  - query_string: |
      timeseries mem = avg(process.memory.usage), by: { deployment.environment }
      | filter db.system == "snowflake"
    description: Plot average Snowflake process memory usage reported by the event_log plugin over time.
    description_copilot: Timeseries of Snowflake process memory usage from event_log plugin metrics.
    internal: false
