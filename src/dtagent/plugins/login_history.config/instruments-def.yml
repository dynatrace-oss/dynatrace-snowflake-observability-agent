#  * Catalog of instrumentation known to Dynatrace Snowflake Observability Agent - login_history plugin
attributes:
  ad.source:
    __context_names:
      - login_history
    __description: >-
      Identifies the DSOA detection rule or security domain that generated this anomaly event.
      Current value: 'snowflake_security'. NOTE: This field is planned for rename to 'rule.id'
      (Semantic Dictionary field) in a future release.
    __example: "snowflake_security"
    __semdict: new
  event.description:
    __context_names:
      - login_history
    __description: Human-readable description of the login event, providing additional context about the outcome.
    __example: "Failed login attempt for user JOHN.DOE from 192.168.1.100."
    __semdict: new
  authentication.factor.first:
    __context_names:
      - login_history
    __example: password123
    __description: The first factor used for authentication, typically a password.
  authentication.factor.second:
    __context_names:
      - login_history
    __example: MFA_TOKEN_ABC123
    __description:
      The second factor used for authentication, such as an MFA token,
      or NULL if not applicable.
  authentication.type:
    __semdict: ref
    __semdict_note: >-
      semdict enum has allow_custom_values: false (OAUTH2/TOKEN/DEVOPSTOKEN/NONE).
      DSOA also emits PASSWORD for Snowflake password auth; this is flagged as an open enum extension request.
    __context_names:
      - sessions
    __example: PASSWORD
    __description: The type of authentication used for the session.
  client.application.id:
    __semdict: new
    __semdict_note: "Snowflake driver metadata; closest OTel analog is service.version (different semantics). Proprietary to DSOA."
    __context_names:
      - sessions
    __example: app123
    __description: The ID of the client application used for the session.
  client.application.version:
    __semdict: new
    __semdict_note: "Closest OTel analog: service.version (different semantics)."
    __context_names:
      - sessions
    __example: 1.0.0
    __description: The version of the client application used for the session.
  client.build_id:
    __semdict: new
    __semdict_note: "Closest OTel analog: service.version (different semantics). Proprietary to DSOA."
    __context_names:
      - sessions
    __example: build123
    __description: The build ID of the client application.
  client.environment:
    __semdict: new
    __semdict_note: "Closest OTel analog: deployment.environment.name (different semantics). Proprietary to DSOA."
    __context_names:
      - sessions
    __example: PRODUCTION
    __description: The environment of the client application.
  client.version:
    __context_names:
      - login_history
      - sessions
    __example: 1.0.0
    __description: The version of the client software used to connect to Snowflake.
  db.snowflake.connection:
    __context_names:
      - login_history
    __example: connection_1
    __description: The name of the connection used by the client, or NULL if the
      client is not using a connection URL.
  error.code:
    __semdict: new
    __semdict_note: >-
      DSOA-specific string error code for Snowflake login failures (e.g. "390100"). Not the same as
      the Dynatrace SD error.code field (which is type: long for iOS/mobile numeric codes) — semantics
      and type are incompatible. Pending rename to snowflake.login.error.code for namespace clarity.
    __context_names:
      - login_history
    __example: ERR001
    __description:
      The error code associated with the login attempt, if it was not
      successful.
  event.id:
    __semdict: ref
    __context_names:
      - login_history
      - sessions
    __example: "123456789"
    __description: A unique identifier for the login attempt or the login event
      associated with the session.
  event.related_id:
    __context_names:
      - login_history
    __example: "987654321"
    __description: An identifier for a related event, if applicable.
  session.id:
    __semdict: otel-only
    __stability: development
    __semdict_note: >-
      OTel semconv Development-tier attribute (session namespace). The semdict session.id is
      model-scoped/internal in code_monitoring only; no global ref available. Emitting as new id:
      pending global semdict registration.
    __context_names:
      - sessions
    __example: session123
    __description: The unique identifier for the session.
  snowflake.session.closed_reason:
    __context_names:
      - sessions
    __example: USER_LOGOUT
    __description: The reason the session was closed.
  snowflake.session.start:
    __context_names:
      - sessions
    __type: long
    __example: "1633046400000000000"
    __description: The start time of the session.
  status.code:
    __semdict: new
    __semdict_note: >-
      DSOA-specific field for Snowflake login attempt status (OK/ERROR). Not present in OTel semconv
      or the Dynatrace Semantic Dictionary as a global field.
    __context_names:
      - login_history
    __example: OK
    __description:
      The status of the login attempt, indicating success (OK) or failure
      (ERROR).
  status.message:
    __semdict: new
    __semdict_note: >-
      DSOA-specific field for Snowflake login attempt status details. Not present in OTel semconv
      or the Dynatrace Semantic Dictionary as a global field.
    __context_names:
      - login_history
    __example: Login successful
    __description:
      A message providing additional details about the status of the
      login attempt.
dimensions:
  client.ip:
    __context_names:
      - login_history
    __semdict_note: >-
      OTel semconv uses client.address (stable). DSOA emits client.ip to match
      Snowflake LOGIN_HISTORY.CLIENT_IP column naming. Consider migrating to client.address in a future release.
    __example: 192.168.1.1
    __description: The IP address of the client that initiated the event.
  client.type:
    __context_names:
      - login_history
    __example: JDBC_DRIVER
    __description:
      The type of client used to connect to Snowflake, such as JDBC_DRIVER
      or ODBC_DRIVER.
  db.user:
    __context_names:
      - login_history
      - sessions
    __example: john_doe
    __description: The user who performed the event in the database.
  event.name:
    __context_names:
      - login_history
    __example: LOGIN
    __description: |
      The type of event that occurred, such as:
      - LOGIN,
      - LOGOUT.
metrics:
  snowflake.login.attempts.failed:
    __context_names:
      - openpipeline
    __description: Number of failed Snowflake login attempts within the collection window.
    __example: "42"
    displayName: Snowflake Login Attempts Failed
    unit: "1"
  snowflake.login.attempts.successful:
    __context_names:
      - openpipeline
    __description: Number of successful Snowflake login attempts within the collection window.
    __example: "1234"
    displayName: Snowflake Login Attempts Successful
    unit: "1"
  snowflake.login.attempts.total:
    __context_names:
      - openpipeline
    __description: >-
      Total number of Snowflake login attempts (failed + successful) within the collection window.
    __example: "1276"
    displayName: Snowflake Login Attempts Total
    unit: "1"
