dimensions:
  db.namespace:
    __type: string
    __semdict: otel-only
    __stability: stable
    __semdict_note: >-
      Defined in OTel Semantic Conventions (db.namespace, stable since v1.28). Not yet present as a globally referenceable field in the
      Dynatrace Semantic Dictionary. Emitting as id: pending global SD registration.
    __context_names: ["cold_tables"]
    __example: analytics_db
    __description: The name of the database containing the table.
  snowflake.schema.name:
    __type: string
    __stability: stable
    __context_names: ["cold_tables"]
    __example: public
    __description: The schema containing the table.
  db.collection.name:
    __type: string
    __semdict: otel-only
    __stability: stable
    __semdict_note: >-
      Defined in OTel Semantic Conventions (db.collection.name, stable since v1.28). Not yet present as a globally referenceable field in
      the Dynatrace Semantic Dictionary. Emitting as id: pending global SD registration.
    __context_names: ["cold_tables"]
    __example: orders
    __description: The table name.
  snowflake.table.full_name:
    __type: string
    __stability: stable
    __context_names: ["cold_tables"]
    __example: ANALYTICS_DB.PUBLIC.ORDERS
    __description: Fully qualified table name (catalog.schema.table).
  snowflake.table.cold_status:
    __type: string
    __stability: stable
    __context_names: ["cold_tables"]
    __example: cold
    __description: Table temperature classification based on access recency.
    __enum:
      allow_custom_values: true
      members:
        - id: cold
          value: cold
          brief: Table data has not been recently accessed (beyond the cold threshold).
        - id: warm
          value: warm
          brief: Table data has been recently accessed within the cold threshold period.

attributes:
  snowflake.table.last_accessed_at:
    __type: string
    __context_names: ["cold_tables"]
    __example: "2026-01-15T10:30:00Z"
    __description: ISO 8601 timestamp of the most recent query that accessed this table.

metrics:
  snowflake.table.access.count:
    __type: long
    __context_names: ["cold_tables"]
    __example: 42
    __description: Total number of query accesses to this table within the lookback window.
    displayName: Table Access Count
    unit: count
  snowflake.table.days_since_last_access:
    __type: long
    __context_names: ["cold_tables"]
    __example: 95
    __description: Number of days since the table was last accessed by any query.
    displayName: Days Since Last Access
    unit: days
