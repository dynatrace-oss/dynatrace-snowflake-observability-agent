# DASHBOARD: Snowflake Warehouse Change Detection
# DESCRIPTION: Audit warehouse DDL changes via query_history logs.
# OWNER: DSOA Team
# PLUGINS: query_history
# TAGS: security, warehouse, ddl
#
id: 0c662c92-d629-455b-b8c6-9e74aa3df6e9
name: Snowflake Warehouse Change Detection
version: 21
variables:
  - version: 2
    key: Accounts
    type: query
    visible: true
    editable: true
    multiple: true
    input: |-
      fetch logs, from: -7d
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(db.operation.name, array("ALTER","CREATE","DROP", "RENAME_WAREHOUSE"))
      | parse upper(content), """('CREATE'|'DROP'|'ALTER'):operation SPACE+ ('WAREHOUSE'):object SPACE LDATA"""
      | filter isNotNull(operation) and isNotNull(object)
      | filter isNotNull(coalesce(deployment.environment.name, deployment.environment))
      | fields env_name = coalesce(deployment.environment.name, deployment.environment)
      | dedup env_name
      | sort env_name asc
  - version: 2
    key: Operation
    type: query
    visible: true
    editable: true
    multiple: true
    input: |-
      fetch logs, from: -7d
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(coalesce(deployment.environment.name, deployment.environment), array($Accounts))
      | filter in(db.operation.name, array("ALTER","CREATE","DROP", "RENAME_WAREHOUSE"))
      | parse upper(content), """('CREATE'|'DROP'|'ALTER'):operation SPACE+ ('WAREHOUSE'):object SPACE LDATA"""
      | filter isNotNull(operation) and isNotNull(object)
      | fields db.operation.name
      | dedup db.operation.name
      | sort db.operation.name asc
  - version: 2
    key: Actor
    type: query
    visible: true
    editable: true
    multiple: true
    input: |-
      fetch logs, from: -7d
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(coalesce(deployment.environment.name, deployment.environment), array($Accounts))
      | filter in(db.operation.name, array($Operation))
      | filter in(db.operation.name, array("ALTER","CREATE","DROP", "RENAME_WAREHOUSE"))
      | parse upper(content), """('CREATE'|'DROP'|'ALTER'):operation SPACE+ ('WAREHOUSE'):object SPACE LDATA"""
      | filter isNotNull(operation) and isNotNull(object)
      | filter isNotNull(db.user)
      | fields db.user
      | dedup db.user
      | sort db.user asc
  - version: 2
    key: Warehouse
    type: query
    visible: true
    editable: true
    multiple: true
    input: |-
      fetch logs, from: -7d
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(coalesce(deployment.environment.name, deployment.environment), array($Accounts))
      | filter in(db.operation.name, array($Operation))
      | filter in(db.operation.name, array("ALTER","CREATE","DROP", "RENAME_WAREHOUSE"))
      | parse upper(db.query.text), """('CREATE'|'DROP'|'ALTER'):operation SPACE+ ('WAREHOUSE'):type (SPACE+ "IF" (SPACE+ "NOT")? SPACE+ "EXISTS")? SPACE+ (NSPACE+):object (SPACE+ "SET" SPACE+ (LDATA):parameter_name SPACE* "=" SPACE* (LDATA):parameter_value)?"""
      | filter isNotNull(operation) and isNotNull(type) and isNotNull(object)
      | parse object, """'IDENTIFIER(' (LDATA):ident_inner ')'"""
      | fieldsAdd warehouse_name = if(isNotNull(ident_inner), replaceString(ident_inner, "'", ""), else: object)
      | filter isNotNull(warehouse_name)
      | fields warehouse_name
      | dedup warehouse_name
      | sort warehouse_name asc
tiles:
  "0":
    type: markdown
    content: |-
      # Warehouse Change Detection

      Tracks configuration changes to Snowflake warehouses — who changed what, when, and the raw SQL of the change.

      Uses `query_history` logs filtered by `db.operation.name` for warehouse DDL operations. Use the **Operation** and **Actor** variables to narrow the view.

      > **Tip:** Enable `plugins.query_history.obfuscation_mode: "off"` if you need full SQL text visibility for change auditing.
    davis:
      componentState:
        inputData: null
  "1":
    title: Change audit log
    type: data
    query: |-
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(coalesce(deployment.environment.name, deployment.environment), array($Accounts))
      | filter in(db.operation.name, array($Operation))
      | filter in(db.user, array($Actor))
      | filter in(db.operation.name, array("ALTER","CREATE","DROP", "RENAME_WAREHOUSE"))
      | parse upper(db.query.text), """('CREATE'|'DROP'|'ALTER'):operation SPACE+ ('WAREHOUSE'):type (SPACE+ "IF" (SPACE+ "NOT")? SPACE+ "EXISTS")? SPACE+ (NSPACE+):object (SPACE+ "SET" SPACE+ (LDATA):parameter_name SPACE* "=" SPACE* (LDATA):parameter_value)?"""
      | filter isNotNull(operation) and isNotNull(type) and isNotNull(object)
      | parse object, """'IDENTIFIER(' (LDATA):ident_inner ')'"""
      | fieldsAdd warehouse_name = if(isNotNull(ident_inner), replaceString(ident_inner, "'", ""), else: object)
      | filter in(warehouse_name, array($Warehouse))
      | fields timestamp, db.operation.name, warehouse_name,  `deployment.environment` = coalesce(deployment.environment.name, deployment.environment), db.user, snowflake.role.name, db.query.text
      | sort timestamp desc
      | limit 200
    visualization: table
    visualizationSettings:
      table:
        linewrapEnabled: true
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 100
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
  "2":
    title: Changes over time
    type: data
    query: |-
      fetch logs, from: now()-7d
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(coalesce(deployment.environment.name, deployment.environment), array($Accounts))
      | filter in(db.operation.name, array($Operation))
      | filter in(db.user, array($Actor))
      | parse upper(db.query.text), """('CREATE'|'DROP'|'ALTER'):operation SPACE+ ('WAREHOUSE'):type (SPACE+ "IF" (SPACE+ "NOT")? SPACE+ "EXISTS")? SPACE+ (NSPACE+):object (SPACE+ "SET" SPACE+ (LDATA):parameter_name SPACE* "=" SPACE* (LDATA):parameter_value)?"""
      | filter isNotNull(operation) and isNotNull(type) and isNotNull(object)
      | parse object, """'IDENTIFIER(' (LDATA):ident_inner ')'"""
      | fieldsAdd warehouse_name = if(isNotNull(ident_inner), replaceString(ident_inner, "'", ""), else: object)
      | filter in(warehouse_name, array($Warehouse))
      | makeTimeseries count = count(), by: { db.operation.name }
    visualization: barChart
    visualizationSettings:
      autoSelectVisualization: false
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 100
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
  "3":
    title: Changes by operation type
    type: data
    query: |-
      fetch logs, from: now()-7d
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(coalesce(deployment.environment.name, deployment.environment), array($Accounts))
      | filter in(db.operation.name, array($Operation))
      | filter in(db.user, array($Actor))
      | parse upper(db.query.text), """('CREATE'|'DROP'|'ALTER'):operation SPACE+ ('WAREHOUSE'):type (SPACE+ "IF" (SPACE+ "NOT")? SPACE+ "EXISTS")? SPACE+ (NSPACE+):object (SPACE+ "SET" SPACE+ (LDATA):parameter_name SPACE* "=" SPACE* (LDATA):parameter_value)?"""
      | filter isNotNull(operation) and isNotNull(type) and isNotNull(object)
      | parse object, """'IDENTIFIER(' (LDATA):ident_inner ')'"""
      | fieldsAdd warehouse_name = if(isNotNull(ident_inner), replaceString(ident_inner, "'", ""), else: object)
      | filter in(warehouse_name, array($Warehouse))
      | summarize event_count = count(), by: { db.operation.name }
      | sort event_count desc
    visualization: donutChart
    visualizationSettings:
      autoSelectVisualization: false
      table:
        linewrapEnabled: true
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 100
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
  "4":
    title: Actor attribution
    type: data
    query: |-
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(coalesce(deployment.environment.name, deployment.environment), array($Accounts))
      | filter in(db.operation.name, array($Operation))
      | filter in(db.user, array($Actor))
      | parse upper(db.query.text), """('CREATE'|'DROP'|'ALTER'):operation SPACE+ ('WAREHOUSE'):type (SPACE+ "IF" (SPACE+ "NOT")? SPACE+ "EXISTS")? SPACE+ (NSPACE+):object (SPACE+ "SET" SPACE+ (LDATA):parameter_name SPACE* "=" SPACE* (LDATA):parameter_value)?"""
      | filter isNotNull(operation) and isNotNull(type) and isNotNull(object)
      | parse object, """'IDENTIFIER(' (LDATA):ident_inner ')'"""
      | fieldsAdd warehouse_name = if(isNotNull(ident_inner), replaceString(ident_inner, "'", ""), else: object)
      | filter in(warehouse_name, array($Warehouse))
      | summarize change_count = count(), by: { db.user, snowflake.role.name }
      | sort change_count desc
    visualization: treemap
    visualizationSettings:
      autoSelectVisualization: false
      table:
        linewrapEnabled: true
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 100
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
  "5":
    title: Sensitive-property changes
    type: data
    query: |-
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(coalesce(deployment.environment.name, deployment.environment), array($Accounts))
      | filter in(db.operation.name, array($Operation))
      | filter in(db.user, array($Actor))
      | filter contains(upper(toString(db.query.text)), "WAREHOUSE_SIZE")
           or contains(upper(toString(db.query.text)), "AUTO_SUSPEND")
           or contains(upper(toString(db.query.text)), "GENERATION")
           or contains(upper(toString(db.query.text)), "SCALING_POLICY")
           or contains(upper(toString(db.query.text)), "ENABLE_QUERY_ACCELERATION")
           or contains(upper(toString(db.query.text)), "QUERY_ACCELERATION_MAX_SCALE_FACTOR")
           or contains(upper(toString(db.query.text)), "MAX_CONCURRENCY_LEVEL")
           or contains(upper(toString(db.query.text)), "MIN_CLUSTER_COUNT")
           or contains(upper(toString(db.query.text)), "MAX_CLUSTER_COUNT")
      | parse upper(db.query.text), """('CREATE'|'DROP'|'ALTER'):operation SPACE+ ('WAREHOUSE'):type (SPACE+ "IF" (SPACE+ "NOT")? SPACE+ "EXISTS")? SPACE+ (NSPACE+):object (SPACE+ "SET" SPACE+ (LDATA):parameter_name SPACE* "=" SPACE* (LDATA):parameter_value)?"""
      | filter isNotNull(operation) and isNotNull(type) and isNotNull(object)
      | parse object, """'IDENTIFIER(' (LDATA):ident_inner ')'"""
      | fieldsAdd warehouse_name = if(isNotNull(ident_inner), replaceString(ident_inner, "'", ""), else: object)
      | filter in(warehouse_name, array($Warehouse))
      | fields timestamp, `deployment.environment` = coalesce(deployment.environment.name, deployment.environment), db.user, snowflake.role.name, db.operation.name, db.query.text
      | sort timestamp desc
      | limit 200
    visualization: table
    visualizationSettings:
      table:
        linewrapEnabled: true
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 100
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
