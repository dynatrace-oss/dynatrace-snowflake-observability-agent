# DASHBOARD: Warehouse Change Detection
# DESCRIPTION: Audit warehouse DDL changes via query_history logs.
# OWNER: DSOA Team
# PLUGINS: query_history
# TAGS: security, warehouse, ddl
#
id: 0c662c92-d629-455b-b8c6-9e74aa3df6e9
name: Warehouse Change Detection
version: 2
variables:
  - version: 2
    key: Accounts
    type: query
    visible: true
    editable: true
    input: |-
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter isNotNull(deployment.environment)
      | fields deployment.environment
      | dedup deployment.environment
      | sort deployment.environment asc
    multiple: true
    defaultValue:
      - "*"
  - version: 2
    key: Operation
    type: query
    visible: true
    editable: true
    input: |-
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(db.operation.name, array("ALTER", "CREATE", "DROP", "RENAME_WAREHOUSE"))
      | fields db.operation.name
      | dedup db.operation.name
      | sort db.operation.name asc
    multiple: true
    defaultValue:
      - "*"
  - version: 2
    key: Actor
    type: query
    visible: true
    editable: true
    input: |-
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(db.operation.name, array("ALTER", "CREATE", "DROP", "RENAME_WAREHOUSE"))
      | filter isNotNull(db.user)
      | fields db.user
      | dedup db.user
      | sort db.user asc
    multiple: true
    defaultValue:
      - "*"
tiles:
  "0":
    type: markdown
    content: |-
      # Warehouse Change Detection

      Tracks configuration changes to Snowflake warehouses — who changed what, when, and the raw SQL of the change.

      Uses `query_history` logs filtered by `db.operation.name` for warehouse DDL operations. Use the **Operation** and **Actor** variables to narrow the view.

      > **Tip:** Enable `plugins.query_history.obfuscation_mode: "off"` if you need full SQL text visibility for change auditing.
    davis:
      componentState:
        inputData: null
  "1":
    title: Change audit log (last 24 h)
    type: data
    query: |-
      fetch logs, from: now()-24h
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(deployment.environment, array($Accounts))
      | filter in(db.operation.name, array($Operation))
      | filter in(db.user, array($Actor))
      | fields timestamp, deployment.environment, db.user, snowflake.role.name, db.operation.name, db.query.text
      | sort timestamp desc
      | limit 200
    visualization: table
    visualizationSettings:
      table:
        rowDensity: condensed
        enableSparklines: false
        hiddenColumns: []
        linewrapEnabled: true
      thresholds: []
      dataMapping: {}
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 100
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
      componentState:
        inputData: null
  "2":
    title: Changes over time (last 7 d)
    type: data
    query: |-
      fetch logs, from: now()-7d
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(deployment.environment, array($Accounts))
      | filter in(db.operation.name, array($Operation))
      | filter in(db.user, array($Actor))
      | makeTimeseries count = count(), by: { db.operation.name }
    visualization: categoricalBarChart
    visualizationSettings:
      thresholds: []
      dataMapping: {}
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 100
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
      componentState:
        inputData: null
  "3":
    title: Changes by operation type (last 7 d)
    type: data
    query: |-
      fetch logs, from: now()-7d
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(deployment.environment, array($Accounts))
      | filter in(db.operation.name, array($Operation))
      | filter in(db.user, array($Actor))
      | summarize event_count = count(), by: { db.operation.name }
      | sort event_count desc
    visualization: table
    visualizationSettings:
      table:
        rowDensity: condensed
        enableSparklines: false
        hiddenColumns: []
        linewrapEnabled: true
      thresholds: []
      dataMapping: {}
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 100
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
      componentState:
        inputData: null
  "4":
    title: Actor attribution (last 7 d)
    type: data
    query: |-
      fetch logs, from: now()-7d
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(deployment.environment, array($Accounts))
      | filter in(db.operation.name, array($Operation))
      | filter in(db.user, array($Actor))
      | summarize change_count = count(), by: { db.user, snowflake.role.name }
      | sort change_count desc
    visualization: table
    visualizationSettings:
      table:
        rowDensity: condensed
        enableSparklines: false
        hiddenColumns: []
        linewrapEnabled: true
      thresholds: []
      dataMapping: {}
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 100
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
      componentState:
        inputData: null
  "5":
    title: Sensitive-property changes (last 7 d)
    type: data
    query: |-
      fetch logs, from: now()-7d
      | filter db.system == "snowflake"
      | filter dsoa.run.plugin == "query_history"
      | filter in(deployment.environment, array($Accounts))
      | filter in(db.operation.name, array($Operation))
      | filter in(db.user, array($Actor))
      | filter contains(upper(toString(db.query.text)), "WAREHOUSE_SIZE")
           or contains(upper(toString(db.query.text)), "AUTO_SUSPEND")
           or contains(upper(toString(db.query.text)), "SCALING_POLICY")
           or contains(upper(toString(db.query.text)), "MIN_CLUSTER_COUNT")
           or contains(upper(toString(db.query.text)), "MAX_CLUSTER_COUNT")
      | fields timestamp, deployment.environment, db.user, snowflake.role.name, db.operation.name, db.query.text
      | sort timestamp desc
      | limit 200
    visualization: table
    visualizationSettings:
      table:
        rowDensity: condensed
        enableSparklines: false
        hiddenColumns: []
        linewrapEnabled: true
      thresholds: []
      dataMapping: {}
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 100
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
      componentState:
        inputData: null
