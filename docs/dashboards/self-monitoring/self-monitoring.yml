  "8":
    title: Plugin runs
    type: data
    query: |-
      fetch bizevents
      | filter db.system == "snowflake"
      | filter in(dsoa.run.context, {"self_monitoring", "self-monitoring"})
      | filter in(deployment.environment, array($Accounts))
      | filter in(dsoa.run.plugin, array($Plugin_Names))
      | sort timestamp desc
      | summarize {
        timestamp = takeFirst(timestamp),
        dsoa.run.results = takeFirst(dsoa.run.results),
        dsoa.task.exec.status = takeFirst(dsoa.task.exec.status)
      }, by: {
          dsoa.run.id,
          dsoa.task.name,
          dsoa.run.plugin,
          deployment.environment
      }
      | parse toString(dsoa.run.results), "'{' ARRAY{STRUCTURE{DQS:key ':' JSON:value}:i (',' SPACE?)?}{0,10}:results '}'"
      | expand results
      | fieldsAdd dsoa.run.context = results[key], telemetry = results[value]
      | fieldsFlatten telemetry,prefix:"telemetry."
      | filter in(dsoa.run.context, array($Plugin_Contexts))
      | fields timestamp,
          `Account`=deployment.environment,
          `Plugin`=dsoa.run.plugin,
          `Context`=dsoa.run.context,
          entries=coalesce(telemetry.entries, 0),
          errors=coalesce(telemetry.errors, 0),
          logs=coalesce(telemetry.log_lines, 0),
          metrics=coalesce(telemetry.metrics, 0),
          spans=coalesce(telemetry.spans, 0),
          events=coalesce(telemetry.events, 0),
          `span events`=coalesce(telemetry.span_events, 0),
          dsoa.run.id, dsoa.task.name
      | sort timestamp desc
      | limit 50
    visualization: table
    visualizationSettings:
      table:
        columnWidths:
          '["dsoa.run.plugin"]': 173.3
          '["dsoa.run.context"]': 122.39
          '["Context"]': 168.39
