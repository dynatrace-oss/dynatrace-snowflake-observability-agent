    type: data
    query: |-
      fetch bizevents
        | filter db.system == "snowflake"
        | filter in(deployment.environment, array($Accounts))
        | filter in(dsoa.run.plugin, array($Plugin_Names))
        | filter in(dsoa.run.context, array($Plugin_Contexts))
        | fieldsAdd data.type = "bizevents"
        | makeTimeseries count = count(), by: {deployment.environment, data.type}
      | append [
        fetch events
        | filter db.system == "snowflake"
        | filter in(deployment.environment, array($Accounts))
        | filter in(dsoa.run.plugin, array($Plugin_Names))
        | filter in(dsoa.run.context, array($Plugin_Contexts))
        | fieldsAdd data.type = "events"
        | makeTimeseries count = count(), by: {deployment.environment, data.type}
      ]
      | append [
        fetch logs
        | filter db.system == "snowflake"
        | filter in(deployment.environment, array($Accounts))
        | filter in(dsoa.run.plugin, array($Plugin_Names))
        | filter in(dsoa.run.context, array($Plugin_Contexts))
        | fieldsAdd data.type = "logs"
        | makeTimeseries count = count(), by: {deployment.environment, data.type}
      ]
      | append [
        fetch spans
        | filter db.system == "snowflake"
        | filter in(deployment.environment, array($Accounts))
        | filter in(dsoa.run.plugin, array($Plugin_Names))
        | filter in(dsoa.run.context, array($Plugin_Contexts))
        | fieldsAdd data.type = "spans"
        | makeTimeseries count = count(), by: {deployment.environment, data.type}
      ]
      | append [
        fetch bizevents
        | filter db.system == "snowflake"
        | filter in(dsoa.run.context, {"self_monitoring", "self-monitoring"})
        | filter in(deployment.environment, array($Accounts))
        | filter in(dsoa.run.plugin, array($Plugin_Names))
        | sort timestamp desc
        | summarize {
          timestamp = takeFirst(timestamp),
          dsoa.run.results = takeFirst(dsoa.run.results),
          dsoa.task.exec.status = takeFirst(dsoa.task.exec.status)
        }, by: {
            dsoa.run.id,
            dsoa.task.name,
            dsoa.run.plugin,
            deployment.environment
        }
        | parse toString(dsoa.run.results), "'{' ARRAY{STRUCTURE{DQS:key ':' JSON:value}:i (',' SPACE?)?}{0,10}:results '}'"
        | expand results
        | fieldsAdd dsoa.run.context = results[key], telemetry = results[value]
        | fieldsFlatten telemetry,prefix:"telemetry."
        | filter in(dsoa.run.context, array($Plugin_Contexts))
        | fieldsAdd data.type = "metrics"
        | makeTimeseries count = sum(coalesce(telemetry.metrics, 0)), by: {deployment.environment, data.type}
      ]
    visualization: barChart
    visualizationSettings:
      autoSelectVisualization: false
      chartSettings:
        leftYAxisSettings:
          scale: log
        legend:
          position: bottom
      legend:
        ratio: 16
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 1
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
