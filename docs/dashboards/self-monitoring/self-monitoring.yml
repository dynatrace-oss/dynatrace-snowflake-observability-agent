  "18":
    title: Acquisition problem details (last 7 days)
    type: data
    query: |-
      fetch bizevents, from: now()-7d
      | filter db.system == "snowflake"
      | filter event.type == "dsoa.acquisition.problem"
      | filter in(deployment.environment, array($Accounts))
      | fields timestamp, dsoa.run.plugin, `dsoa.acquisition.problem.type`, `dsoa.acquisition.problem.source`, `dsoa.acquisition.problem.detail`
      | sort timestamp desc
    visualization: table
    visualizationSettings:
      table: {}
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 1
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
  "19":
    title: Metrics produced per data type
    type: data
    query: |-
      fetch bizevents
      | filter db.system == "snowflake"
      | filter in(dsoa.run.context, {"self_monitoring", "self-monitoring"})
      | filter in(deployment.environment, array($Accounts))
      | filter in(dsoa.run.plugin, array($Plugin_Names))
      | sort timestamp desc
      | summarize {
        timestamp = takeFirst(timestamp),
        dsoa.run.results = takeFirst(dsoa.run.results),
        dsoa.task.exec.status = takeFirst(dsoa.task.exec.status)
      }, by: {
          dsoa.run.id,
          dsoa.task.name,
          dsoa.run.plugin,
          deployment.environment
      }
      | parse toString(dsoa.run.results), "'{' ARRAY{STRUCTURE{DQS:key ':' JSON:value}:i (',' SPACE?)?}{0,10}:results '}'"
      | expand results
      | fieldsAdd dsoa.run.context = results[key], telemetry = results[value]
      | fieldsFlatten telemetry,prefix:"telemetry."
      | filter in(dsoa.run.context, array($Plugin_Contexts))
      | summarize {
        count = sum(coalesce(telemetry.metrics, 0))
      }, by: {
        plugin_name = dsoa.run.plugin
      }
    visualization: honeycomb
    visualizationSettings:
      honeycomb:
        dataMappings:
          value: count
        displayedFields:
          - plugin_name
        legend:
          position: right
      coloring:
        colorRules:
          - colorMode: color-palette
            colorPalette: yellow
            field: count
            type: double
            comparator: ">="
            value: null
      unitsOverrides:
        - identifier: count
          unitCategory: unspecified
          baseUnit: none
          displayUnit: null
          decimals: 0
          suffix: ""
          delimiter: false
          cascade: null
          added: 1779347224900
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 1
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
