  "11":
    title: Plugin execution problems log
    type: data
    query: |-
      fetch logs
      | filter db.system == "snowflake"
      | filter dsoa.run.context == "query_history"
      | filter in(deployment.environment, array($Accounts))
      | filter snowflake.query.execution_status != "SUCCESS"
      | filter matchesPattern(db.query.text,
          """'call DTAGENT' ('_' LD:tag)?  '_DB.APP.DTAGENT(ARRAY_CONSTRUCT(' ARRAY{SQS:plugin_name ', '?}{1,}:plugin_names '))'""")
      | parse `db.query.text`, """'call DTAGENT' ('_' LD:env_tag)?  '_DB.APP.DTAGENT(ARRAY_CONSTRUCT(' ARRAY{SQS:plugin_name ', '?}{1,}:plugin_names '))'"""
      | expand plugin_name_and_context = plugin_names
      | fieldsAdd plugin_name = splitString(plugin_name_and_context, ":")[0]
      | fieldsAdd plugin_context = splitString(plugin_name_and_context, ":")[1]
      | filter isTrueOrNull(plugin_name == "?") or in(plugin_name, array($Plugin_Names))
      | filter isTrueOrNull(plugin_context == "") or in(dsoa.run.context, array($Plugin_Contexts))
      | fields timestamp, plugin_name, query_id=snowflake.query.id, db=db.namespace, exec_status=snowflake.query.execution_status, error_message=snowflake.error.message
    visualization: table
    visualizationSettings:
      table:
        columnTypeOverrides:
          - fields:
              - content
            id: 1763710335706
            value: log-content
        columnWidths:
          '["plugin_name"]': 157.39
          '["error_message"]': 794
      autoSelectVisualization: false
      unitsOverrides: []
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 1
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
  "12":
