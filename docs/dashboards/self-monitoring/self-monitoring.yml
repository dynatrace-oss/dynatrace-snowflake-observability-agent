id: 0363ea51-aafe-4d5c-b76b-70342d5f70ed
version: 21
variables:
  - key: Accounts
    visible: true
    type: query
    version: 2
    editable: true
    input: |
      fetch logs
      | filter db.system == "snowflake"
      | fields deployment.environment
      | dedup deployment.environment
      | append [
        fetch spans
        | filter db.system == "snowflake"
        | fields deployment.environment
        | dedup deployment.environment
      ]
      | append [
        fetch events
        | filter db.system == "snowflake"
        | fields deployment.environment
        | dedup deployment.environment
      ]
      | append [
        fetch bizevents
        | filter db.system == "snowflake"
        | fields deployment.environment
        | dedup deployment.environment
      ]
      | dedup deployment.environment
      | sort deployment.environment
    multiple: true
    defaultValue:
      - 3420b2ac-f1cf-4b24-b62d-61ba1ba8ed05*
  - key: Plugin_Names
    visible: true
    type: query
    version: 2
    editable: true
    input: |-
      fetch bizevents
      | filter db.system == "snowflake"
      | filter dsoa.run.context == "self_monitoring"
      | filter in(deployment.environment, array($Accounts))
      | fields dsoa.run.plugin
      | dedup dsoa.run.plugin
      | sort dsoa.run.plugin
    multiple: true
    defaultValue:
      - 3420b2ac-f1cf-4b24-b62d-61ba1ba8ed05*
  - key: Plugin_Contexts
    visible: true
    type: query
    version: 2
    editable: true
    input: |-
      fetch bizevents
      | filter db.system == "snowflake"
      | filter in(dsoa.run.context, {"self_monitoring", "self-monitoring"})
      | filter in(deployment.environment, array($Accounts))
      | filter in(dsoa.run.plugin, array($Plugin_Names))
      | sort timestamp desc
      | summarize {
        dsoa.run.results = takeFirst(dsoa.run.results)
      }, by: {
        dsoa.run.id
      }
      | parse toString(dsoa.run.results), "'{' ARRAY{STRUCTURE{DQS:key ':' JSON:value}:i (',' SPACE?)?}{0,10}:results '}'"
      | expand results
      | fields dsoa.run.context = results[key]
      | dedup dsoa.run.context
    multiple: true
    defaultValue:
      - 3420b2ac-f1cf-4b24-b62d-61ba1ba8ed05*
tiles:
  "1":
    title: Plugin execution time (bizevents)
    type: data
    query: |-
      fetch bizevents
      | filter db.system == "snowflake"
      | filter in(dsoa.run.context, {"self_monitoring", "self-monitoring"})
      | filter in(deployment.environment, array($Accounts))
      | filter in(dsoa.run.plugin, array($Plugin_Names))
      | sort timestamp asc
      | summarize {
          timestamp = takeFirst(timestamp),
          dsoa.run.results = takeFirst(dsoa.run.results),
          dsoa.run.duration = max(timestamp) - min(timestamp),
          count = count()
      }, by: {
          deployment.environment,
          deployment.environment.tag = env_tag,
          dsoa.task.exec.id,
          dsoa.run.plugin
      }
      | parse toString(dsoa.run.results), "'{' ARRAY{STRUCTURE{DQS:key ':' JSON:value}:i (',' SPACE?)?}{0,10}:results '}'"
      | expand results
      | fieldsAdd dsoa.run.context = results[key], telemetry = results[value]
      | fieldsFlatten telemetry,prefix:"telemetry."
      | filter in(dsoa.run.context, array($Plugin_Contexts))
      | filter count > 1
      | makeTimeseries {
          dsoa.run.duration = sum(dsoa.run.duration)
      }, by: {
          dsoa.run.plugin
      }
      | filter dsoa.run.plugin != "deployment"
    visualization: lineChart
    visualizationSettings:
      chartSettings:
        truncationMode: middle
        legend:
          position: bottom
        xAxisLabel: timeframe
        xAxisScaling: analyzedTimeframe
        fieldMapping:
          leftAxisValues:
            - dsoa.run.duration
          timestamp: timeframe
        curve: smooth
        gapPolicy: connect
      dataMapping:
        displayedFields:
          - dsoa.run.plugin
      unitsOverrides:
        - identifier: dsoa.run.duration
          unitCategory: time
          baseUnit: nanosecond
          displayUnit: null
          decimals: 2
          suffix: ""
          delimiter: false
          cascade: null
          added: 1727938388826
    querySettings:
      maxResultRecords: 1000
      defaultScanLimitGbytes: 500
      maxResultMegaBytes: 1
      defaultSamplingRatio: 10
      enableSampling: false
    davis:
      enabled: false
      davisVisualization:
        isAvailable: true
  "2":
    title: Failed plugin runs
    type: data
    query: |-
      fetch logs
      | filter db.system == "snowflake"
