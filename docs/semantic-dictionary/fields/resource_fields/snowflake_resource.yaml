groups:
  - id: db.resource
    type: resource
    title: DB Resource resource fields
    brief: Resource-level fields describing Snowflake DB Resource entities.
    attributes:
      - id: db.system
        display_name: DB System
        type: string
        stability: stable
        brief: The database management system (DBMS) product being used. It is always 'snowflake'
        examples:
          - snowflake
        note: 'Defined in OpenTelemetry Semantic Conventions (db.system, stable) but not yet present as a globally referenceable field in the Dynatrace Semantic Dictionary. Emitting as a new id: definition here so DSOA can declare it properly. The value for Snowflake is always ''snowflake''. NOTE: OTel semconv renamed db.system to db.system.name (stable since v1.30). DSOA continues to emit db.system for backward compatibility; migration to db.system.name planned for a future release.'
  - id: snowflake.resource_monitor.resource
    type: resource
    title: Snowflake Resource Monitor Resource resource fields
    brief: Resource-level fields describing Snowflake Snowflake Resource Monitor Resource entities.
    attributes:
      - id: snowflake.resource_monitor.frequency
        display_name: Snowflake Resource Monitor Frequency
        type:
          allow_custom_values: true
          members:
            - id: daily
              value: "DAILY"
              brief: Credit usage counter resets to zero at 12:00 AM UTC each day from the configured start date.
            - id: weekly
              value: "WEEKLY"
              brief: Credit usage counter resets to zero at 12:00 AM UTC each week on the same weekday as the configured start date.
            - id: monthly
              value: "MONTHLY"
              brief: Credit usage counter resets to zero at 12:00 AM UTC on the same day of each month as the configured start date; default frequency.
            - id: yearly
              value: "YEARLY"
              brief: Credit usage counter resets to zero once per year on the anniversary of the configured start date.
            - id: never
              value: "NEVER"
              brief: Resource monitor does not reset automatically.
        stability: stable
        brief: The frequency of the resource monitor.
        examples: [ 'DAILY' ]
      - id: snowflake.resource_monitor.level
        display_name: Snowflake Resource Monitor Level
        type:
          allow_custom_values: false
          members:
            - id: account
              value: "ACCOUNT"
              brief: Monitors aggregate credit consumption across all warehouses in the account; only one account-level monitor may exist per account.
            - id: warehouse
              value: "WAREHOUSE"
              brief: Resource monitor applies at the warehouse level.
        stability: experimental
        brief: The level of the resource monitor.
        examples: [ 'ACCOUNT' ]
  - id: snowflake.warehouse.resource
    type: resource
    title: Snowflake Warehouse Resource resource fields
    brief: Resource-level fields describing Snowflake Snowflake Warehouse Resource entities.
    attributes:
      - id: snowflake.warehouse.clusters.count
        display_name: Snowflake Warehouse Clusters Count
        type: long
        stability: stable
        brief: The number of clusters in the warehouse.
        examples: [ 2 ]
        note: The .count suffix is deliberately preserved. Sibling metrics snowflake.warehouse.clusters.min, .max, and .started exist in the same namespace; using the bare plural snowflake.warehouse.clusters as a scalar would be ambiguous alongside them.
      - id: snowflake.warehouse.execution_state
        display_name: Snowflake Warehouse Execution State
        type:
          allow_custom_values: true
          members:
            - id: started
              value: "STARTED"
              brief: Compute resources provisioned and warehouse is initialising after a CREATE or RESUME operation.
            - id: suspended
              value: "SUSPENDED"
              brief: All compute resources deallocated; no credits consumed. Auto-resumes on next query submission if AUTO_RESUME is enabled.
            - id: resuming
              value: "RESUMING"
              brief: Compute resources being provisioned; submitted queries are queued until provisioning completes.
            - id: suspending
              value: "SUSPENDING"
              brief: Completing in-flight queries before deallocating compute resources; credits continue to accrue until suspension is complete.
            - id: resizing
              value: "RESIZING"
              brief: Warehouse is scaling to a new per-cluster size; running queries continue on the current size until resizing completes.
        stability: stable
        brief: The execution state of the warehouse.
        examples: [ 'RUNNING' ]
      - id: snowflake.warehouse.has_query_acceleration_enabled
        display_name: Snowflake Warehouse Has Query Acceleration Enabled
        type: boolean
        stability: experimental
        brief: Indicates if query acceleration is enabled for the warehouse.
        examples: [ true ]
      - id: snowflake.warehouse.is_auto_resume
        display_name: Snowflake Warehouse Is Auto Resume
        type: boolean
        stability: stable
        brief: Indicates if the warehouse is set to auto-resume.
        examples: [ true ]
      - id: snowflake.warehouse.owner.name
        display_name: Snowflake Warehouse Owner Name
        type: string
        stability: experimental
        brief: The owner of the warehouse.
        examples: [ 'ADMIN' ]
      - id: snowflake.warehouse.scaling_policy
        display_name: Snowflake Warehouse Scaling Policy
        type:
          allow_custom_values: true
          members:
            - id: standard
              value: "STANDARD"
              brief: '"Prioritises query throughput: adds a new cluster immediately when any query is queued, ensuring minimal queue time at the cost of higher credit consumption. Default policy."'
            - id: economy
              value: "ECONOMY"
              brief: Economy scaling policy (slower to scale up, saves credits).
        stability: stable
        brief: The scaling policy of the warehouse.
        examples: [ 'STANDARD' ]
