groups:
  - id: snowflake.role
    type: attribute_group
    title: Snowflake Role signal fields
    brief: Signal-level fields for Snowflake Role telemetry.
    attributes:
      - id: snowflake.role.name
        display_name: Snowflake Role Name
        type: string
        stability: stable
        brief: The role that was active in the session at the time of the query.
        examples:
          - analyst_role
      - id: snowflake.role.type
        display_name: Snowflake Role Type
        type: string
        stability: stable
        brief: The type of role used to execute the query.
        examples:
          - PRIMARY
