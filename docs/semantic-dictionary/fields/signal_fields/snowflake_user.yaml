groups:
  - id: snowflake.user
    type: attribute_group
    title: Snowflake User signal fields
    brief: Signal-level fields for Snowflake User telemetry.
    attributes:
      - id: snowflake.user.bypass_mfa_until
        display_name: Snowflake User Bypass Mfa Until
        type: long
        stability: experimental
        brief: The time until which the user can bypass MFA. Epoch nanoseconds timestamp.
        examples:
          - 1620213179885000000
      - id: snowflake.user.comment
        display_name: Snowflake User Comment
        type: string
        stability: experimental
        brief: Any comments associated with the user.
        examples:
          - New user account
      - id: snowflake.user.created_on
        display_name: Snowflake User Created On
        type: long
        stability: experimental
        brief: The timestamp of the user account creation.
        examples:
          - 1651830381846000000
      - id: snowflake.user.default.namespace
        display_name: Snowflake User Default Namespace
        type: string
        stability: stable
        brief: The default namespace for the user.
        examples:
          - PUBLIC
      - id: snowflake.user.default.role
        display_name: Snowflake User Default Role
        type: string
        stability: stable
        brief: The default role for the user.
        examples:
          - SYSADMIN
      - id: snowflake.user.default.secondary_role
        display_name: Snowflake User Default Secondary Role
        type: string
        stability: stable
        brief: The default secondary role for the user.
        examples:
          - SECURITYADMIN
      - id: snowflake.user.default.warehouse
        display_name: Snowflake User Default Warehouse
        type: string
        stability: stable
        brief: The default warehouse for the user.
        examples:
          - COMPUTE_WH
      - id: snowflake.user.deleted_on
        display_name: Snowflake User Deleted On
        type: long
        stability: experimental
        brief: The timestamp of the user account deletion.
        examples:
          - 1615219846384000000
      - id: snowflake.user.display_name
        display_name: Snowflake User Display Name
        type: string
        stability: experimental
        brief: The display name of the user.
        examples:
          - John Doe
      - id: snowflake.user.email
        display_name: Snowflake User Email
        type: string
        stability: experimental
        brief: The email address of the user.
        examples:
          - jdoe@example.com
      - id: snowflake.user.expires_at
        display_name: Snowflake User Expires At
        type: long
        stability: experimental
        brief: The expiration date of the user account.
        examples:
          - 1620213179885000000
      - id: snowflake.user.ext_authn.duo
        display_name: Snowflake User Ext Authn Duo
        type: boolean
        stability: stable
        brief: Indicates if Duo authentication is enabled for the user.
        examples:
          - true
      - id: snowflake.user.ext_authn.uid
        display_name: Snowflake User Ext Authn Uid
        type: string
        stability: stable
        brief: The external authentication UID for the user.
        examples:
          - ext123
      - id: snowflake.user.has_mfa
        display_name: Snowflake User Has Mfa
        type: boolean
        stability: stable
        brief: Indicates if the user is enrolled for multi-factor authentication.
        examples:
          - true
      - id: snowflake.user.has_password
        display_name: Snowflake User Has Password
        type: boolean
        stability: stable
        brief: Indicates if the user has a password set.
        examples:
          - true
      - id: snowflake.user.has_pat
        display_name: Snowflake User Has Pat
        type: boolean
        stability: stable
        brief: Indicates if a programmatic access token has been generated for the user.
        examples:
          - true
      - id: snowflake.user.has_rsa
        display_name: Snowflake User Has Rsa
        type: boolean
        stability: stable
        brief: Indicates if RSA public key authentication is configured for the user.
        examples:
          - true
      - id: snowflake.user.has_workload_identity
        display_name: Snowflake User Has Workload Identity
        type: boolean
        stability: experimental
        brief: Indicates if workload identity federation is configured for the user.
        examples:
          - true
      - id: snowflake.user.id
        display_name: Snowflake User ID
        type: long
        stability: experimental
        brief: The unique identifier for the user.
        examples:
          - 12345
      - id: snowflake.user.is_disabled
        display_name: Snowflake User Is Disabled
        type: boolean
        stability: stable
        brief: Indicates if the user account is disabled.
        examples:
          - false
      - id: snowflake.user.is_from_organization
        display_name: Snowflake User Is From Organization
        type: boolean
        stability: experimental
        brief: Indicates if the user was imported from a global organization.
        examples:
          - true
      - id: snowflake.user.is_locked
        display_name: Snowflake User Is Locked
        type: boolean
        stability: stable
        brief: Indicates if the user account is locked by Snowflake.
        examples:
          - false
      - id: snowflake.user.last_success_login
        display_name: Snowflake User Last Success Login
        type: long
        stability: stable
        brief: The timestamp of the last successful login by the user.
        examples:
          - 1732181350954000000
      - id: snowflake.user.locked_until_time
        display_name: Snowflake User Locked Until Time
        type: long
        stability: experimental
        brief: The time until which the user account is locked.
        examples:
          - 1615479617866000000
      - id: snowflake.user.must_change_password
        display_name: Snowflake User Must Change Password
        type: boolean
        stability: experimental
        brief: Indicates if the user must change their password.
        examples:
          - true
      - id: snowflake.user.name.first
        display_name: Snowflake User Name First
        type: string
        stability: stable
        brief: The first name of the user.
        examples:
          - John
      - id: snowflake.user.name.last
        display_name: Snowflake User Name Last
        type: string
        stability: stable
        brief: The last name of the user.
        examples:
          - Doe
      - id: snowflake.user.name.login
        display_name: Snowflake User Name Login
        type: string
        stability: experimental
        brief: The login name of the user.
        examples:
          - jdoe
      - id: snowflake.user.owner
        display_name: Snowflake User Owner
        type: string
        stability: stable
        brief: The role that owns the user account.
        examples:
          - ACCOUNTADMIN
      - id: snowflake.user.password_last_set_time
        display_name: Snowflake User Password Last Set Time
        type: long
        stability: experimental
        brief: The timestamp of the last password change for the user.
        examples:
          - 1615219848053000000
      - id: snowflake.user.privilege.granted_by
        display_name: Snowflake User Privilege Granted By
        type: string[]
        stability: experimental
        brief: Array of all roles which granted grants to a user for a privilege.
        examples:
          - - ACCOUNTADMIN
        note: Array of grantor role names stored as string[] in Grail.
      - id: snowflake.user.privilege.grants_on
        display_name: Snowflake User Privilege Grants On
        type: string[]
        stability: experimental
        brief: List of all objects of given type on which given privilege was given; both object type and privilege are reported as `snowflake.user.privilege.name`
        examples:
          - - TRUST_CENTER_ADMIN
            - COMPUTE_WH
        note: Array of privilege grant target names stored as string[] in Grail.
      - id: snowflake.user.privilege.last_altered
        display_name: Snowflake User Privilege Last Altered
        type: long
        stability: experimental
        brief: The timestamp of the last alteration to the user's privileges.
        examples:
          - 1732181350954000000
      - id: snowflake.user.privilege.name
        display_name: Snowflake User Privilege Name
        type: string
        stability: stable
        brief: Name of the privilege and type of object this privilege granted on to the user or role. Composed as `privilege:granted_on_object`.
        examples:
          - CREATE SERVICE:SCHEMA
      - id: snowflake.user.roles.all
        display_name: Snowflake User Roles All
        type: string
        stability: experimental
        brief: Comma separated list of all roles granted to a user.
        examples:
          - SNOWFLAKE_FINANCE,MONITORING
      - id: snowflake.user.roles.direct.list
        display_name: Snowflake User Roles Direct List
        type: string[]
        stability: stable
        brief: List of all direct roles granted to user.
        examples:
          - - DEVOPS_ROLE
            - SYSADMIN
            - ACCOUNTADMIN
        note: Array of directly assigned role names stored as string[] in Grail.
      - id: snowflake.user.roles.direct.removed
        display_name: Snowflake User Roles Direct Removed
        type: string
        stability: stable
        brief: Name of the role that was revoked from user.
        examples:
          - ACCOUNTADMIN
      - id: snowflake.user.roles.direct.removed_on
        display_name: Snowflake User Roles Direct Removed On
        type: long
        stability: experimental
        brief: The timestamp of the last removal of a direct role from the user.
        examples:
          - 1718260900411000000
      - id: snowflake.user.roles.granted_by
        display_name: Snowflake User Roles Granted By
        type: string[]
        stability: experimental
        brief: Array of admin roles that were used to grant current list of user roles.
        examples:
          - - DEMIGOD
            - SECURITYADMIN
            - ACCOUNTADMIN
        note: Array of grantor names for role assignments stored as string[] in Grail.
      - id: snowflake.user.roles.last_altered
        display_name: Snowflake User Roles Last Altered
        type: long
        stability: experimental
        brief: The timestamp of the last alteration to the roles granted to the user.
        examples:
          - 1718260900411000000
      - id: snowflake.user.type
        display_name: Snowflake User Type
        type:
          allow_custom_values: true
          members:
            - id: person
              value: PERSON
              brief: Human interactive user.
            - id: service
              value: SERVICE
              brief: Non-interactive integration user; cannot authenticate via password or SAML, cannot enroll in MFA. Recommended for all automated service accounts.
            - id: legacy_service
              value: LEGACY_SERVICE
              brief: Non-interactive integration user that, unlike SERVICE, still permits password and SAML authentication. Deprecated — migrate to SERVICE type.
            - id: snowflake_service
              value: SNOWFLAKE_SERVICE
              brief: System-managed user automatically created for each Snowpark Container Services (SPCS) service; cannot be created or converted by administrators.
        stability: stable
        brief: 'The type of user who executed the query. Possible values: PERSON (human interactive user), SERVICE (programmatic service user), LEGACY_SERVICE (legacy service account), SNOWFLAKE_SERVICE
          (Snowpark Container Services). Useful for splitting workloads by human vs. automated traffic.'
        examples:
          - PERSON
