groups:
  - id: snowflake.error
    type: attribute_group
    title: Snowflake Error signal fields
    brief: Signal-level fields for Snowflake Error telemetry.
    attributes:
      - id: snowflake.error.code
        display_name: Snowflake Error Code
        type: string
        stability: stable
        brief: The error code if the query failed.
        examples:
          - '1001'
      - id: snowflake.error.message
        display_name: Snowflake Error Message
        type: string
        stability: stable
        brief: The error message if the query failed.
        examples:
          - Syntax error in SQL statement
