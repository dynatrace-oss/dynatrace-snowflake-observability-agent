groups:
  - id: snowflake.account
    type: attribute_group
    title: Snowflake Account signal fields
    brief: Signal-level fields for Snowflake Account telemetry.
    attributes:
      - id: snowflake.account.locator
        display_name: Snowflake Account Locator
        type: string
        stability: experimental
        brief: The account locator identifier for the Snowflake account.
        examples:
          - ABC12345
      - id: snowflake.account.name
        display_name: Snowflake Account Name
        type: string
        stability: stable
        brief: The name of the Snowflake account within the organization.
        examples:
          - MYORG-ACCOUNT1
      - id: snowflake.account.region
        display_name: Snowflake Account Region
        type: string
        stability: stable
        brief: The cloud region of the Snowflake account performing the data transfer.
        examples:
          - US_EAST_1
