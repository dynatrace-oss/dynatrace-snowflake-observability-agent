groups:
  - id: dsoa.debug
    type: attribute_group
    title: DSOA Debug signal fields
    brief: Signal-level fields for DSOA Debug telemetry.
    attributes:
      - id: dsoa.debug.span.events.added
        display_name: DSOA Debug Span Events Added
        type: long
        stability: stable
        brief: Internal debug field indicating the number of span events successfully added to the given span.
        examples:
          - 5
      - id: dsoa.debug.span.events.failed
        display_name: DSOA Debug Span Events Failed
        type: long
        stability: stable
        brief: Internal debug field indicating the number of span events that failed to be added to the given span.
        examples:
          - 1
