groups:
  - id: snowflake.grant
    type: attribute_group
    title: Snowflake Grant signal fields
    brief: Signal-level fields for Snowflake Grant telemetry.
    attributes:
      - id: snowflake.grant.by
        display_name: Snowflake Grant By
        type: string
        stability: stable
        brief: Shows the name of the account which made the grant.
        examples:
          - ACCOUNTADMIN
      - id: snowflake.grant.created_on
        display_name: Snowflake Grant Created On
        type: long
        stability: stable
        brief: The timestamp when the grant was created. Epoch nanoseconds timestamp.
        examples:
          - 1639051180946000000
      - id: snowflake.grant.grantee
        display_name: Snowflake Grant Grantee
        type: string
        stability: stable
        brief: Shows the grantee account name.
        examples:
          - PARTNER_ACCOUNT
      - id: snowflake.grant.name
        display_name: Snowflake Grant Name
        type: string
        stability: stable
        brief: Name of the grant to a share.
        examples:
          - READ_ACCESS
      - id: snowflake.grant.on
        display_name: Snowflake Grant On
        type: string
        stability: stable
        brief: Shows on what type of object the grant was made.
        examples:
          - DATABASE
      - id: snowflake.grant.option
        display_name: Snowflake Grant Option
        type: boolean
        stability: experimental
        brief: Indicates if grant option is available.
        examples:
          - false
      - id: snowflake.grant.privilege
        display_name: Snowflake Grant Privilege
        type: string
        stability: stable
        brief: Shows the type of privilege granted.
        examples:
          - USAGE
      - id: snowflake.grant.to
        display_name: Snowflake Grant To
        type: string
        stability: experimental
        brief: Shows to what the grant was made.
        examples:
          - SHARE
