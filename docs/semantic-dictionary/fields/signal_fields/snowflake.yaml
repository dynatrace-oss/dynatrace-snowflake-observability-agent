groups:
  - id: snowflake.account
    type: attribute_group
    title: Snowflake Account signal
    brief: Signal-level fields for Snowflake Account telemetry.
    attributes:
      - id: snowflake.account.locator
        display_name: 'Snowflake Account Locator'
        type: string
        stability: experimental
        brief: The account locator identifier for the Snowflake account.
        examples: [ 'ABC12345' ]
      - id: snowflake.account.name
        display_name: 'Snowflake Account Name'
        type: string
        stability: stable
        brief: The name of the Snowflake account within the organization.
        examples: [ 'MYORG-ACCOUNT1' ]
      - id: snowflake.account.region
        display_name: 'Snowflake Account Region'
        type: string
        stability: stable
        brief: The cloud region of the Snowflake account performing the data transfer.
        examples: [ 'US_EAST_1' ]
  - id: snowflake.budget
    type: attribute_group
    title: Snowflake Budget signal
    brief: Signal-level fields for Snowflake Budget telemetry.
    attributes:
      - id: snowflake.budget.created_on
        display_name: 'Snowflake Budget Created On'
        type: long
        stability: stable
        brief: The timestamp when the budget was created.
        examples: [ 1732981199999000000 ]
      - id: snowflake.budget.full_name
        display_name: 'Snowflake Budget Full Name'
        type: string
        stability: experimental
        brief: Fully-qualified name of the budget (DATABASE.SCHEMA.NAME).
        examples: [ 'ANALYTICS_DB.BUDGETS.MONTHLY_BUDGET' ]
      - id: snowflake.budget.name
        display_name: 'Snowflake Budget Name'
        type: string
        stability: stable
        brief: Name of the budget.
        examples: [ 'monthly_budget' ]
      - id: snowflake.budget.owner.name
        display_name: 'Snowflake Budget Owner Name'
        type: string
        stability: stable
        brief: The owner of the budget, typically the user or role responsible for managing the budget.
        examples: [ 'budget_admin' ]
      - id: snowflake.budget.owner.role_type
        display_name: 'Snowflake Budget Owner Role Type'
        type: string
        stability: experimental
        brief: 'The principal type of the budget owner: ROLE or APPLICATION.'
        examples: [ 'ROLE' ]
      - id: snowflake.budget.resource
        display_name: 'Snowflake Budget Resource'
        type: string[]
        stability: stable
        brief: The resources linked to the budget, such as databases, warehouses, or other Snowflake objects that the budget monitors.
        examples:
          - ['DATABASE1', 'WAREHOUSE1']
        note: Array of resource names (databases, warehouses) in this budget group, stored as string[] in Grail.
  - id: snowflake.cluster
    type: attribute_group
    title: Snowflake Cluster signal
    brief: Signal-level fields for Snowflake Cluster telemetry.
    attributes:
      - id: snowflake.cluster_number
        display_name: 'Snowflake Cluster Number'
        type: long
        stability: experimental
        brief: The cluster number associated with the query.
        examples: [ 1 ]
  - id: snowflake.copy
    type: attribute_group
    title: Snowflake Copy signal
    brief: Signal-level fields for Snowflake Copy telemetry.
    attributes:
      - id: snowflake.copy.errors.limit
        display_name: 'Snowflake Copy Errors Limit'
        type: long
        stability: experimental
        brief: Error limit for the COPY.
        examples: [ 1 ]
      - id: snowflake.copy.file_name
        display_name: 'Snowflake Copy File Name'
        type: string
        stability: experimental
        brief: Source file name.
        examples: [ 'data/file_20250312.csv.gz' ]
      - id: snowflake.copy.first_commit_time
        display_name: 'Snowflake Copy First Commit Time'
        type: long
        stability: experimental
        brief: When the first chunk of the file was committed.
        examples: [ 1741772160000000000 ]
      - id: snowflake.copy.first_error.character_position
        display_name: 'Snowflake Copy First Error Character Position'
        type: long
        stability: experimental
        brief: Character position of first error.
        examples: [ 128 ]
      - id: snowflake.copy.first_error.column_name
        display_name: 'Snowflake Copy First Error Column Name'
        type: string
        stability: experimental
        brief: Column name causing the first error.
        examples: [ 'AMOUNT' ]
      - id: snowflake.copy.first_error.line_number
        display_name: 'Snowflake Copy First Error Line Number'
        type: long
        stability: experimental
        brief: Line number of first error.
        examples: [ 42 ]
      - id: snowflake.copy.first_error.message
        display_name: 'Snowflake Copy First Error Message'
        type: string
        stability: experimental
        brief: First error message for failed loads.
        examples: [ 'Number of columns in file (3) does not match that of the corresponding table (4)' ]
      - id: snowflake.copy.pipe.received_time
        display_name: 'Snowflake Copy Pipe Received Time'
        type: long
        stability: experimental
        brief: When file was received by Snowpipe (view-only).
        examples: [ 1741772100000000000 ]
      - id: snowflake.copy.stage_location
        display_name: 'Snowflake Copy Stage Location'
        type: string
        stability: experimental
        brief: Stage location (ACCOUNT_USAGE view-only).
        examples: [ 's3://my-bucket/data/' ]
      - id: snowflake.copy.status
        display_name: 'Snowflake Copy Status'
        type:
          allow_custom_values: true
          members:
            - id: loaded
              value: "LOADED"
              brief: File loaded successfully.
            - id: load_failed
              value: "LOAD_FAILED"
              brief: File load failed with errors.
            - id: partially_loaded
              value: "PARTIALLY_LOADED"
              brief: File partially loaded; some rows failed.
        stability: experimental
        brief: Load status of the COPY INTO operation.
        examples: [ 'LOADED' ]
  - id: snowflake.cost_attribution
    type: attribute_group
    title: Snowflake Cost Attribution signal
    brief: Signal-level fields for Snowflake Cost Attribution telemetry.
    attributes:
      - id: snowflake.cost_attribution.period_end
        display_name: 'Snowflake Cost Attribution Period End'
        type: long
        stability: experimental
        brief: End of the cost attribution summary window.
        examples: [ 1730844667000000000 ]
      - id: snowflake.cost_attribution.period_start
        display_name: 'Snowflake Cost Attribution Period Start'
        type: long
        stability: experimental
        brief: Start of the cost attribution summary window.
        examples: [ 1730841067000000000 ]
  - id: snowflake.database
    type: attribute_group
    title: Snowflake Database signal
    brief: Signal-level fields for Snowflake Database telemetry.
    attributes:
      - id: snowflake.database.id
        display_name: 'Snowflake Database ID'
        type: long
        stability: stable
        brief: The unique identifier of the database involved in the query.
        examples: [ 123456 ]
        note: ACCOUNT_USAGE.DATABASES supplies related fields (name, owner, owner_role_type, type, is_transient, lifecycle, retention_time, comment) but these should be populated by a future inventory plugin, not query_history (≈180-min latency + cost). In query_history, snowflake.database.id stays a foreign key only.
  - id: snowflake.entity
    type: attribute_group
    title: Snowflake Entity signal
    brief: Signal-level fields for Snowflake Entity telemetry.
    attributes:
      - id: snowflake.entity.details
        display_name: 'Snowflake Entity Details'
        type: string
        stability: stable
        brief: Additional details about the entity involved in the event.
        examples: [ 'Contains user data' ]
      - id: snowflake.entity.id
        display_name: 'Snowflake Entity ID'
        type: string
        stability: experimental
        brief: The unique identifier for the entity involved in the event.
        examples: [ 'entity123' ]
      - id: snowflake.entity.name
        display_name: 'Snowflake Entity Name'
        type: string
        stability: stable
        brief: The name of the entity involved in the event.
        examples: [ 'User Table' ]
      - id: snowflake.entity.type
        display_name: 'Snowflake Entity Type'
        type: string
        stability: experimental
        brief: The type of entity involved in the event, such as a table, view, or user.
        examples: [ 'table' ]
  - id: snowflake.error
    type: attribute_group
    title: Snowflake Error signal
    brief: Signal-level fields for Snowflake Error telemetry.
    attributes:
      - id: snowflake.error.code
        display_name: 'Snowflake Error Code'
        type: string
        stability: stable
        brief: The error code if the query failed.
        examples: [ '1001' ]
      - id: snowflake.error.message
        display_name: 'Snowflake Error Message'
        type: string
        stability: stable
        brief: The error message if the query failed.
        examples: [ 'Syntax error in SQL statement' ]
  - id: snowflake.event
    type: attribute_group
    title: Snowflake Event signal
    brief: Signal-level fields for Snowflake Event telemetry.
    attributes:
      - id: snowflake.event.type
        display_name: 'Snowflake Event Type'
        type: string
        stability: experimental
        brief: Type of (timestamp based) event
        examples: [ 'snowflake.table.update' ]
  - id: snowflake.grant
    type: attribute_group
    title: Snowflake Grant signal
    brief: Signal-level fields for Snowflake Grant telemetry.
    attributes:
      - id: snowflake.grant.by
        display_name: 'Snowflake Grant By'
        type: string
        stability: stable
        brief: Shows the name of the account which made the grant.
        examples: [ 'ACCOUNTADMIN' ]
      - id: snowflake.grant.created_on
        display_name: 'Snowflake Grant Created On'
        type: long
        stability: stable
        brief: The timestamp when the grant was created. Epoch nanoseconds timestamp.
        examples: [ 1639051180946000000 ]
      - id: snowflake.grant.grantee
        display_name: 'Snowflake Grant Grantee'
        type: string
        stability: stable
        brief: Shows the grantee account name.
        examples: [ 'PARTNER_ACCOUNT' ]
      - id: snowflake.grant.name
        display_name: 'Snowflake Grant Name'
        type: string
        stability: stable
        brief: Name of the grant to a share.
        examples: [ 'READ_ACCESS' ]
      - id: snowflake.grant.on
        display_name: 'Snowflake Grant On'
        type: string
        stability: stable
        brief: Shows on what type of object the grant was made.
        examples: [ 'DATABASE' ]
      - id: snowflake.grant.option
        display_name: 'Snowflake Grant Option'
        type: boolean
        stability: experimental
        brief: Indicates if grant option is available.
        examples: [ false ]
      - id: snowflake.grant.privilege
        display_name: 'Snowflake Grant Privilege'
        type: string
        stability: stable
        brief: Shows the type of privilege granted.
        examples: [ 'USAGE' ]
      - id: snowflake.grant.to
        display_name: 'Snowflake Grant To'
        type: string
        stability: experimental
        brief: Shows to what the grant was made.
        examples: [ 'SHARE' ]
  - id: snowflake.object
    type: attribute_group
    title: Snowflake Object signal
    brief: Signal-level fields for Snowflake Object telemetry.
    attributes:
      - id: snowflake.object.ddl.modified
        display_name: 'Snowflake Object DDL Modified'
        type: string
        stability: experimental
        brief: A JSON array that specifies the objects that were associated with a write operation in the query.
        examples: [ '{ "DTAGENT_DB.APP.TMP_RECENT_QUERIES": { "objectColumns": "HISTOGRAM_METRICS, COUNTER_METRICS, START_TIME, STATUS_CODE, SESSION_ID, QUERY_ID, DIMENSIONS, END_TIME, NAME, ATTRIBUTES, PARENT_QUERY_ID", "objectDomain": "Table" } }' ]
        note: Serialized JSON object stored as string in Grail. Contains modified DDL object details. Parse with parseJson() in DQL.
      - id: snowflake.object.ddl.operation
        display_name: 'Snowflake Object DDL Operation'
        type:
          allow_custom_values: true
          members:
            - id: create
              value: "CREATE"
              brief: Creates a new database object; when used as CREATE OR REPLACE, atomically drops and recreates.
            - id: alter
              value: "ALTER"
              brief: Modifies the properties or definition of an existing database object without recreating it.
            - id: drop
              value: "DROP"
              brief: Removes a database object; for tables, data enters Fail-safe and can be recovered via UNDROP within the retention period.
            - id: undrop
              value: "UNDROP"
              brief: Restores a previously dropped table, schema, or database from Fail-safe within the Time Travel retention window.
            - id: replace
              value: "REPLACE"
              brief: Equivalent to CREATE OR REPLACE; atomically drops and recreates the object, resetting its definition.
        stability: stable
        brief: |-
          DDL operation type (`CREATE`, `ALTER`, `DROP`, `UNDROP`, `REPLACE`). Populated only
          when `plugins.query_history.track_ddl_changes=true` — see `snowflake.object.type`.
          Does not apply to warehouse or resource-monitor DDL — use `db.operation.name` for
          warehouse change detection.
        examples: [ 'ALTER' ]
      - id: snowflake.object.ddl.properties
        display_name: 'Snowflake Object DDL Properties'
        type: string
        stability: stable
        brief: |-
          A JSON array that specifies the object or column properties when you create, modify, drop, or undrop the object or column.
          There are two types of properties: atomic and compound.
        examples: ['{"creationMode": "CREATE", "columns": {"ADD": ["ATTRIBUTE","JOB_ID"]}}']
        note: Stored as a serialized JSON string, not plain text.
      - id: snowflake.object.id
        display_name: 'Snowflake Object ID'
        type: long
        stability: stable
        brief: An identifier for the object, which is unique within a given account and domain.
        examples: [ 747545 ]
      - id: snowflake.object.name
        display_name: 'Snowflake Object Name'
        type: string
        stability: stable
        brief: The fully qualified name of the object defined or modified by the DDL operation.
        examples: [ 'DTAGENT_DB.APP.TMP_RECENT_QUERIES' ]
      - id: snowflake.object.type
        display_name: 'Snowflake Object Type'
        type:
          allow_custom_values: true
          members:
            - id: table
              value: "Table"
              brief: A base, temporary, or external table object that stores or references tabular data, as reported in ACCESS_HISTORY.OBJECT_MODIFIED_BY_DDL.
            - id: view
              value: "View"
              brief: A standard or secure view object whose definition is stored as a query and evaluated at access time.
            - id: schema
              value: "Schema"
              brief: A namespace container within a database used to group tables, views, and other objects.
            - id: database
              value: "Database"
              brief: The top-level namespace container in Snowflake; groups schemas and all their child objects.
            - id: procedure
              value: "Procedure"
              brief: A callable stored procedure object encapsulating SQL or Snowpark logic that can be invoked via CALL.
        stability: stable
        brief: |-
          Type of object modified by the DDL operation captured for this query, as recorded by
          Snowflake in `ACCESS_HISTORY.OBJECT_MODIFIED_BY_DDL.objectDomain` (e.g. `Table`,
          `View`, `Schema`, `Database`). Populated only when
          `plugins.query_history.track_ddl_changes=true` and Snowflake recorded a structured
          DDL payload for the query. Does not apply to warehouse or resource-monitor DDL —
          use `db.operation.name` for warehouse change detection.
        examples: [ 'Table' ]
