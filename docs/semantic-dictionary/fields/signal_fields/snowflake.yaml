        display_name: 'Snowflake Table Owner'
        type: string
        stability: experimental
        brief: Name of the role that owns the table.
        examples: [ 'ACCOUNTADMIN' ]
      - id: snowflake.table.retention_time
        display_name: 'Snowflake Table Retention Time'
        type: long
        stability: experimental
        brief: Number of days that historical data is retained for Time Travel.
        examples: [ 5 ]
      - id: snowflake.table.type
        display_name: 'Snowflake Table Type'
        type:
          allow_custom_values: true
          members:
            - id: base_table
              value: "BASE TABLE"
              brief: Full permanent table stored in Snowflake micro-partitions; supports all DML, Time Travel, and Fail-safe.
            - id: temporary_table
              value: "TEMPORARY TABLE"
              brief: Temporary table (session-scoped).
            - id: external_table
              value: "EXTERNAL TABLE"
              brief: Schema overlay over data files in an external cloud storage stage; data is never loaded into Snowflake and is read-only.
            - id: view
              value: "VIEW"
              brief: Non-materialized virtual table defined by a stored query; the underlying SQL is re-executed on every access with no physical storage.
            - id: materialized_view
              value: "MATERIALIZED VIEW"
              brief: Pre-computed query result stored as a physical table and transparently refreshed by Snowflake's background maintenance service; consumes MATERIALIZED_VIEW credits.
        stability: stable
        brief: 'The type of the table. Possible values: BASE TABLE, TEMPORARY TABLE, EXTERNAL TABLE.'
        examples: [ 'BASE TABLE' ]
      - id: snowflake.table.update
        display_name: 'Snowflake Table Update'
        type: long
        stability: stable
        brief: The timestamp of the last time the object was altered by a DML, DDL, or background metadata operation.
        examples: [ 1731256700000000000 ]
