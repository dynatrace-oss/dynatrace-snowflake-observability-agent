            - id: resume_cluster
              value: "RESUME_CLUSTER"
              brief: An individual cluster within a multi-cluster warehouse was resumed to meet increased demand.
            - id: resume_warehouse
              value: "RESUME_WAREHOUSE"
              brief: The warehouse transitioned from SUSPENDED to STARTED, reprovisioning compute resources.
            - id: suspend_cluster
              value: "SUSPEND_CLUSTER"
              brief: An individual cluster within a multi-cluster warehouse was suspended due to reduced demand.
            - id: suspend_warehouse
              value: "SUSPEND_WAREHOUSE"
              brief: The warehouse transitioned from STARTED to SUSPENDED, deallocating all compute resources.
            - id: warehouse_consistent
              value: "WAREHOUSE_CONSISTENT"
              brief: All pending state changes for the warehouse have settled; emitted as the final event in a multi-step operation sequence.
        stability: stable
        brief: The name of the event.
        examples: [ 'WAREHOUSE_START' ]
      - id: snowflake.warehouse.event.reason
        display_name: 'Snowflake Warehouse Event Reason'
        type:
          allow_custom_values: true
          members:
            - id: resource_monitor_suspend
              value: "RESOURCE_MONITOR_SUSPEND"
              brief: Warehouse was suspended because a resource monitor reached its SUSPEND or SUSPEND_IMMEDIATE threshold.
            - id: warehouse_autoresume
              value: "WAREHOUSE_AUTORESUME"
              brief: Warehouse resumed automatically because AUTO_RESUME is enabled and a SQL statement was submitted while suspended.
            - id: warehouse_autosuspend
              value: "WAREHOUSE_AUTOSUSPEND"
              brief: Warehouse suspended automatically after the configured AUTO_SUSPEND inactivity period elapsed.
            - id: warehouse_resume
              value: "WAREHOUSE_RESUME"
              brief: Warehouse was resumed explicitly via ALTER WAREHOUSE RESUME or a user-initiated action.
            - id: warehouse_suspend
              value: "WAREHOUSE_SUSPEND"
              brief: Warehouse was suspended explicitly via ALTER WAREHOUSE SUSPEND or a user-initiated action.
        stability: experimental
        brief: The reason for the event.
        examples: [ 'USER_REQUEST' ]
      - id: snowflake.warehouse.event.state
        display_name: 'Snowflake Warehouse Event State'
        type:
          allow_custom_values: true
          members:
            - id: started
              value: "STARTED"
              brief: The warehouse operation has been initiated and is in progress; a COMPLETED or further STARTED event will follow.
            - id: completed
              value: "COMPLETED"
              brief: The warehouse operation completed atomically with no further pending state changes.
        stability: stable
        brief: The state of the event, such as STARTED or COMPLETED.
        examples: [ 'STARTED' ]
      - id: snowflake.warehouse.event.trigger
        display_name: 'Snowflake Warehouse Event Trigger'
        type: string
        stability: experimental
        brief: The event that triggered the "warehouse is not monitored" notification.
        examples: [ 'snowflake.warehouse.created_on' ]
      - id: snowflake.warehouse.id
        display_name: 'Snowflake Warehouse ID'
        type: long
        stability: experimental
        brief: The unique identifier of the warehouse used.
        examples: [ 12345 ]
      - id: snowflake.warehouse.is_current
        display_name: 'Snowflake Warehouse Is Current'
        type: boolean
        stability: experimental
        brief: Indicates if the warehouse is the current warehouse.
        examples: [ true ]
      - id: snowflake.warehouse.is_default
        display_name: 'Snowflake Warehouse Is Default'
        type: boolean
        stability: experimental
        brief: Indicates if the warehouse is the default warehouse.
        examples: [ true ]
      - id: snowflake.warehouse.is_unmonitored
        display_name: 'Snowflake Warehouse Is Unmonitored'
        type: boolean
        stability: stable
        brief: Indicates if the warehouse is NOT monitored by a resource monitor.
        examples: [ true ]
      - id: snowflake.warehouse.name
        display_name: 'Snowflake Warehouse Name'
        type: string
        stability: stable
        brief: The name of the warehouse used to execute the query.
        examples: [ 'compute_wh' ]
      - id: snowflake.warehouse.owner.role_type
        display_name: 'Snowflake Warehouse Owner Role Type'
        type: string
        stability: experimental
        brief: 'The principal type of the warehouse owner: ROLE or APPLICATION.'
        examples: [ 'ROLE' ]
      - id: snowflake.warehouse.resumed_on
        display_name: 'Snowflake Warehouse Resumed On'
        type: string
        stability: stable
        brief: The timestamp when the warehouse was last resumed.
        examples: [ '2024-11-15 09:00:00.000' ]
        note: ISO 8601 timestamp string stored as string in Grail.
      - id: snowflake.warehouse.size
        display_name: 'Snowflake Warehouse Size'
        type:
          allow_custom_values: true
          members:
            - id: x_small
              value: "X-SMALL"
              brief: Smallest warehouse size; 1 credit/hour. Default size when creating a warehouse via SQL or Snowsight.
            - id: small
              value: "SMALL"
              brief: 2 credits/hour; double the compute resources of X-Small.
            - id: medium
              value: "MEDIUM"
              brief: 4 credits/hour; suited for moderate-complexity queries and concurrent workloads.
            - id: large
              value: "LARGE"
              brief: 8 credits/hour; provides substantially more compute resources per cluster for complex queries.
            - id: x_large
              value: "X-LARGE"
              brief: 16 credits/hour; suitable for large-scale ETL and analytics.
            - id: x2_large
              value: "2X-LARGE"
              brief: 32 credits/hour; credit consumption doubles at each step from X-Large.
            - id: x3_large
              value: "3X-LARGE"
              brief: 64 credits/hour.
            - id: x4_large
              value: "4X-LARGE"
              brief: 128 credits/hour.
            - id: x5_large
              value: "5X-LARGE"
              brief: 256 credits/hour; generally available on AWS and Azure.
            - id: x6_large
              value: "6X-LARGE"
              brief: 512 credits/hour; largest available size, generally available on AWS and Azure.
        stability: stable
        brief: The size of the warehouse used.
        examples: [ 'X-SMALL' ]
      - id: snowflake.warehouse.type
        display_name: 'Snowflake Warehouse Type'
        type:
          allow_custom_values: true
          members:
            - id: standard
              value: "STANDARD"
              brief: Standard multi-cluster warehouse.
            - id: snowpark_optimized
              value: "SNOWPARK_OPTIMIZED"
              brief: Single-node warehouse with configurable high-memory nodes (16x–64x vs standard) and CPU architecture options; recommended for ML training and memory-intensive UDFs and stored procedures.
        stability: stable
        brief: The type of warehouse used.
        examples: [ 'STANDARD' ]
      - id: snowflake.warehouse.updated_on
        display_name: 'Snowflake Warehouse Updated On'
        type: string
        stability: experimental
        brief: The timestamp when the warehouse was last updated.
        examples: [ '2024-11-10 14:30:00.000' ]
        note: ISO 8601 timestamp string stored as string in Grail.
