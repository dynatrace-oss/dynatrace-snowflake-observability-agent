    title: Snowflake Schema signal fields
    brief: Signal-level fields for Snowflake Schema telemetry.
    attributes:
      - id: snowflake.schema.id
        display_name: Snowflake Schema ID
        type: long
        stability: experimental
        brief: The unique identifier of the schema involved in the query.
