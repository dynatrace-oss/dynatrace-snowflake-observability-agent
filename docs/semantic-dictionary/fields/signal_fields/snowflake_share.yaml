groups:
  - id: snowflake.share
    type: attribute_group
    title: Snowflake Share signal fields
    brief: Signal-level fields for Snowflake Share telemetry.
    attributes:
      - id: snowflake.share.created_on
        display_name: Snowflake Share Created On
        type: long
        stability: stable
        brief: The timestamp when the share was created. Epoch nanoseconds timestamp.
        examples:
          - 1639051180714000000
      - id: snowflake.share.has_details_reported
        display_name: Snowflake Share Has Details Reported
        type: boolean
        stability: experimental
        brief: Indicates whether or not details on this share should be reported.
        examples:
          - false
      - id: snowflake.share.is_secure_objects_only
        display_name: Snowflake Share Is Secure Objects Only
        type: boolean
        stability: stable
        brief: Indicates if the share is only for secure objects.
        examples:
          - true
      - id: snowflake.share.kind
        display_name: Snowflake Share Kind
        type: string
        stability: stable
        brief: Indicates the type of share.
        examples:
          - OUTBOUND
      - id: snowflake.share.listing_global_name
        display_name: Snowflake Share Listing Global Name
        type: string
        stability: experimental
        brief: Global name of the share listing.
        examples:
          - GLOBAL_SHARE_NAME
      - id: snowflake.share.name
        display_name: Snowflake Share Name
        type: string
        stability: stable
        brief: Name of the share.
        examples:
          - SAMPLE_DATA
      - id: snowflake.share.owner
        display_name: Snowflake Share Owner
        type: string
        stability: stable
        brief: Shows the account owning the share.
        examples:
          - ACCOUNTADMIN
      - id: snowflake.share.shared_from
        display_name: Snowflake Share Shared From
        type: string
        stability: experimental
        brief: Shows the owner account of the share.
        examples:
          - SNOWFLAKE
      - id: snowflake.share.shared_to
        display_name: Snowflake Share Shared To
        type: string
        stability: experimental
        brief: Shows the account the share was made to.
        examples:
          - PARTNER_ACCOUNT
      - id: snowflake.share.status
        display_name: Snowflake Share Status
        type: string
        stability: stable
        brief: Indicates the availability status of the share. Set to UNAVAILABLE when the shared database is no longer accessible.
        examples:
          - UNAVAILABLE
