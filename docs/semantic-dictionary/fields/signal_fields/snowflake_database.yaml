groups:
  - id: snowflake.database
    type: attribute_group
    title: Snowflake Database signal fields
    brief: Signal-level fields for Snowflake Database telemetry.
    attributes:
      - id: snowflake.database.id
        display_name: Snowflake Database ID
        type: long
        stability: stable
        brief: The unique identifier of the database involved in the query.
        examples:
          - 123456
        note: ACCOUNT_USAGE.DATABASES supplies related fields (name, owner, owner_role_type, type, is_transient, lifecycle, retention_time, comment) but these should be populated by a future inventory plugin,
          not query_history (≈180-min latency + cost). In query_history, snowflake.database.id stays a foreign key only.
