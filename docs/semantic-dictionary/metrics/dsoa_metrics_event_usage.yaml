model:
  id: dsoa.metrics.event_usage
  title: Snowflake Event Usage Metrics
  brief: Metrics collected by the DSOA event_usage plugin from Snowflake ACCOUNT_USAGE views.
  model_group_id: dsoa.metrics
  data_object: metric
  interfaces:
    - i.dsoa_resource
  dql_queries:
    - query_string: |
        timeseries val = sum(snowflake.credits.used), by: { deployment.environment.name }
      description: Plot credits billed for loading data into the event table over time.
      description_copilot: Timeseries of Snowflake event table credit usage.
    - query_string: |
        timeseries val = sum(snowflake.data.ingested), by: { deployment.environment.name }
      description: Plot bytes of data loaded into the event table over time.
      description_copilot: Timeseries of Snowflake event table data ingestion volume.
    - query_string: |
        timeseries ingested = sum(snowflake.data.ingested), interval: 1d, by: { deployment.environment.name }
        | fieldsAdd total_ingested = arraySum(ingested)
      description: Report total daily bytes ingested into the event table per Snowflake account.
      description_copilot: Daily total of Snowflake event table data ingestion per account.
  groups:
    - id: snowflake.credits.used
      type: metric
      metric_name: snowflake.credits.used
      instrument: gauge
      stability: experimental
      brief: Number of credits billed for loading data into the event table during the START_TIME and END_TIME window.
      examples:
        - 15
      title: Snowflake Credits Used
      unit: count
      note: "Original unit: credit."
    - id: snowflake.data.ingested
      type: metric
      metric_name: snowflake.data.ingested
      instrument: gauge
      stability: experimental
      brief: Number of bytes of data loaded during the START_TIME and END_TIME window.
      examples:
        - 10485760
      title: Bytes Ingested for Event Table
      unit: By
