model:
  id: snowflake.metrics.metering
  title: Snowflake metering metrics
  brief: Metrics collected by the DSOA metering plugin from Snowflake ACCOUNT_USAGE views.
  model_group_id: snowflake.metrics
  data_object: metric
  interfaces: [ i.dsoa_resource ]
  dql_queries:
    - query_string: >
        timeseries credits = sum(snowflake.credits.used), by: { snowflake.service.name, deployment.environment.name }
      description: Plot total credits consumed per Snowflake service over time.
      description_copilot: Timeseries of Snowflake credits consumed per service.
    - query_string: >
        timeseries compute = sum(snowflake.credits.used.compute), by: { snowflake.service.type, deployment.environment.name }
      description: Plot compute credits consumed per Snowflake service type over time.
      description_copilot: Timeseries of Snowflake compute credits per service type.
    - query_string: |
        timeseries { compute = sum(snowflake.credits.used.compute), cloud_services = sum(snowflake.credits.used.cloud_services) },
          by: { snowflake.service.name, deployment.environment.name }
      description: Compare compute and cloud-services credits per Snowflake service over time.
      description_copilot: Timeseries comparing Snowflake compute and cloud-services credits per service.
  groups:
    - id: snowflake.credits.used.cloud_services
      type: metric
      metric_name: snowflake.credits.used.cloud_services
      instrument: gauge
      brief: Cloud services credits consumed by the service in the metering window.
      title: Snowflake Cloud Services Credits Used
      unit: count
      note: "Original unit: credit."
      attributes:
        - ref: snowflake.service.name
        - ref: snowflake.service.type
    - id: snowflake.credits.used.compute
      type: metric
      metric_name: snowflake.credits.used.compute
      instrument: gauge
      brief: Compute credits consumed by the service in the metering window.
      title: Snowflake Compute Credits Used
      unit: count
      note: "Original unit: credit."
      attributes:
        - ref: snowflake.service.name
        - ref: snowflake.service.type
    - id: snowflake.data.files
      type: metric
      metric_name: snowflake.data.files
      instrument: gauge
      brief: Number of files processed by the service in the metering window.
      title: Files Processed
      unit: count
      note: "Original unit: file."
      attributes:
        - ref: snowflake.service.name
        - ref: snowflake.service.type
    - id: snowflake.metering.data.rows
      type: metric
      metric_name: snowflake.metering.data.rows
      instrument: gauge
      brief: Number of rows processed by the service in the metering window.
      title: Rows Processed
      unit: count
      note: "Original unit: row."
      attributes:
        - ref: snowflake.service.name
        - ref: snowflake.service.type
    - id: snowflake.metering.data.size
      type: metric
      metric_name: snowflake.metering.data.size
      instrument: gauge
      brief: Number of bytes processed by the service in the metering window.
      title: Bytes Processed
      unit: By
      attributes:
        - ref: snowflake.service.name
        - ref: snowflake.service.type
