model:
  id: dsoa.metrics.login_history
  title: Snowflake Login History Metrics
  brief: Metrics collected by the DSOA login_history plugin from Snowflake ACCOUNT_USAGE views.
  model_group_id: dsoa.metrics
  data_object: metric
  interfaces:
    - i.dsoa_resource
  dql_queries:
    - query_string: |
        timeseries failed = sum(snowflake.login.attempts.failed), by: { db.user, deployment.environment.name }
      description: Plot failed Snowflake login attempts per user over time.
      description_copilot: Timeseries of failed Snowflake login attempts per user.
    - query_string: |
        timeseries total = sum(snowflake.login.attempts.total), by: { client.type, deployment.environment.name }
      description: Plot total Snowflake login attempts broken down by client type over time.
      description_copilot: Timeseries of total Snowflake login attempts per client type.
    - query_string: |
        timeseries { failed = sum(snowflake.login.attempts.failed), successful = sum(snowflake.login.attempts.successful) },
          by: { db.user, deployment.environment.name }
      description: Compare failed and successful Snowflake login attempts per user over time.
      description_copilot: Timeseries comparing failed and successful Snowflake login attempts per user.
  groups:
    - id: snowflake.login.attempts.failed
      type: metric
      metric_name: snowflake.login.attempts.failed
      instrument: gauge
      stability: experimental
      brief: Number of failed Snowflake login attempts within the collection window.
      examples:
        - 42
      title: Snowflake Login Attempts Failed
      unit: count
    - id: snowflake.login.attempts.successful
      type: metric
      metric_name: snowflake.login.attempts.successful
      instrument: gauge
      stability: experimental
      brief: Number of successful Snowflake login attempts within the collection window.
      examples:
        - 1234
      title: Snowflake Login Attempts Successful
      unit: count
    - id: snowflake.login.attempts.total
      type: metric
      metric_name: snowflake.login.attempts.total
      instrument: gauge
      stability: experimental
      brief: Total number of Snowflake login attempts (failed + successful) within the collection window.
      examples:
        - 1276
      title: Snowflake Login Attempts Total
      unit: count
