model:
  id: snowflake.metrics.warehouse_usage
  title: Snowflake warehouse usage metrics
  brief: Metrics collected by the DSOA warehouse_usage plugin from Snowflake ACCOUNT_USAGE views.
  model_group_id: snowflake.metrics
  data_object: metric
  interfaces: [i.dsoa_resource, i.snowflake_warehouse]
  dql_queries:
    - query_string: >
        timeseries credits = sum(snowflake.credits.compute), by: { snowflake.warehouse.name, deployment.environment.name }
      description: Plot Snowflake compute credit consumption per warehouse over time.
      description_copilot: Timeseries of Snowflake compute credits consumed per warehouse.
    - query_string: >
        timeseries load = avg(snowflake.load.running), by: { snowflake.warehouse.name, deployment.environment.name }
      description: Plot average number of running queries per warehouse over time.
      description_copilot: Timeseries of average running query load per Snowflake warehouse.
    - query_string: |
        timeseries {
          running = avg(snowflake.load.running),
          queued_overloaded = avg(snowflake.load.queued.overloaded),
          blocked = avg(snowflake.load.blocked)
        },
          by: { snowflake.warehouse.name, deployment.environment.name }
      description: Compare running, overload-queued and blocked query load per Snowflake warehouse over time.
      description_copilot: Timeseries comparing running, queued and blocked query load per Snowflake warehouse.
  groups:
    - id: snowflake.credits.compute
      type: metric
      metric_name: snowflake.credits.compute
      instrument: gauge
      brief: The number of credits used for compute.
      title: Compute Credits Used
      unit: count
      note: "Original unit: credit."
    - id: snowflake.load.blocked
      type: metric
      metric_name: snowflake.load.blocked
      instrument: gauge
      brief: The average number of queries blocked by a transaction lock.
      title: Average Blocked Queries
      unit: count
    - id: snowflake.load.queued.overloaded
      type: metric
      metric_name: snowflake.load.queued.overloaded
      instrument: gauge
      brief: The average number of queries queued due to load.
      title: Average Queued Queries (Load)
      unit: count
    - id: snowflake.load.queued.provisioning
      type: metric
      metric_name: snowflake.load.queued.provisioning
      instrument: gauge
      brief: The average number of queries queued due to provisioning.
      title: Average Queued Queries (Provisioning)
      unit: count
    - id: snowflake.load.running
      type: metric
      metric_name: snowflake.load.running
      instrument: gauge
      brief: The average number of running queries.
      title: Average Running Queries
      unit: count
