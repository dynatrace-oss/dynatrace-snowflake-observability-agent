model:
  id: dsoa.metrics.query_history
  title: Snowflake Query History Metrics
  brief: Metrics collected by the DSOA query_history plugin from Snowflake ACCOUNT_USAGE views.
  model_group_id: dsoa.metrics
  data_object: metric
  interfaces:
    - i.dsoa_resource
    - i.dsoa_warehouse
    - i.dsoa_database
  dql_queries:
    - query_string: |
        timeseries val = sum(snowflake.time.execution), by: { snowflake.warehouse.name, deployment.environment.name }
      description: Plot total Snowflake query execution time per warehouse over time.
      description_copilot: Timeseries of Snowflake query execution time broken down by warehouse.
    - query_string: |
        timeseries credits = sum(snowflake.credits.attributed_compute), by: { db.user, deployment.environment.name }
      description: Plot attributed compute credits consumed per user over time.
      description_copilot: Timeseries of Snowflake attributed compute credits consumed per user.
    - query_string: |
        timeseries { compute = sum(snowflake.credits.attributed_compute), scanned = sum(snowflake.data.scanned) },
          by: { snowflake.warehouse.name, deployment.environment.name }
      description: Compare attributed compute credits against bytes scanned per warehouse over time.
      description_copilot: Timeseries comparing Snowflake attributed compute credits and bytes scanned per warehouse.
  groups:
    - id: snowflake.acceleration.data.scanned
      type: metric
      metric_name: snowflake.acceleration.data.scanned
      instrument: gauge
      stability: experimental
      brief: Number of bytes scanned by the query acceleration service.
      examples:
        - 2097152
      title: Query Acceleration Bytes Scanned
      unit: By
      attributes:
        - ref: db.collection.name
        - ref: db.operation.name
        - ref: db.snowflake.dbs
        - ref: db.user
        - ref: snowflake.query.execution_status
        - ref: snowflake.query.hash
        - ref: snowflake.query.parametrized_hash
        - ref: snowflake.query.tag
        - ref: snowflake.role.name
        - ref: snowflake.table.full_name
        - ref: snowflake.user.type
    - id: snowflake.acceleration.partitions.scanned
      type: metric
      metric_name: snowflake.acceleration.partitions.scanned
      instrument: gauge
      stability: experimental
      brief: Number of partitions scanned by the query acceleration service.
      examples:
        - 50
      title: Query Acceleration Partitions Scanned
      unit: count
      note: "Original unit: partition."
      attributes:
        - ref: db.collection.name
        - ref: db.operation.name
        - ref: db.snowflake.dbs
        - ref: db.user
        - ref: snowflake.query.execution_status
        - ref: snowflake.query.hash
        - ref: snowflake.query.parametrized_hash
        - ref: snowflake.query.tag
        - ref: snowflake.role.name
        - ref: snowflake.table.full_name
        - ref: snowflake.user.type
    - id: snowflake.acceleration.scale_factor.max
      type: metric
      metric_name: snowflake.acceleration.scale_factor.max
      instrument: gauge
      stability: experimental
      brief: Upper limit scale factor that a query would have benefited from.
      examples:
        - 4
      title: Query Acceleration Upper Limit Scale Factor
      unit: "1"
      attributes:
        - ref: db.collection.name
        - ref: db.operation.name
        - ref: db.snowflake.dbs
        - ref: db.user
        - ref: snowflake.query.execution_status
        - ref: snowflake.query.hash
        - ref: snowflake.query.parametrized_hash
        - ref: snowflake.query.tag
        - ref: snowflake.role.name
        - ref: snowflake.table.full_name
        - ref: snowflake.user.type
    - id: snowflake.cost_attribution.query_count
      type: metric
      metric_name: snowflake.cost_attribution.query_count
      instrument: gauge
      stability: stable
      brief: Number of queries in this cost attribution group during the summary window.
      examples:
        - 42
      title: Cost Attribution Query Count
      unit: count
      note:
        The .query_count name is deliberately preserved. The alternative plural snowflake.cost_attribution.queries would read as a
        collection of query objects rather than a scalar count, which is misleading in a metrics context.
      attributes:
        - ref: db.collection.name
        - ref: db.operation.name
        - ref: db.snowflake.dbs
        - ref: db.user
        - ref: snowflake.query.execution_status
        - ref: snowflake.query.hash
        - ref: snowflake.query.parametrized_hash
        - ref: snowflake.query.tag
        - ref: snowflake.role.name
        - ref: snowflake.table.full_name
        - ref: snowflake.user.type
    - id: snowflake.credits.attributed_compute
      type: metric
      metric_name: snowflake.credits.attributed_compute
      instrument: gauge
      stability: experimental
      brief:
        Compute credits attributed to this query based on weighted resource consumption. Excludes warehouse idle time. NULL for queries
        within the ~8h QAH latency window.
      examples:
        - 0.0042
      title: Query Attributed Compute Credits
      unit: count
      note: "Original unit: credit."
      attributes:
        - ref: db.collection.name
        - ref: db.operation.name
        - ref: db.snowflake.dbs
        - ref: db.user
        - ref: snowflake.query.execution_status
        - ref: snowflake.query.hash
        - ref: snowflake.query.parametrized_hash
        - ref: snowflake.query.tag
