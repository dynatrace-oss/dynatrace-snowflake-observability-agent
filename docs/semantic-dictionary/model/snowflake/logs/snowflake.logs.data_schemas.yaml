model:
  id: snowflake.logs.data_schemas
  title: Snowflake data schemas log records
  brief: Log records emitted by the DSOA data_schemas plugin.
  model_group_id: snowflake.logs
  data_object: log
  interfaces: [i.dsoa_resource]
  dql_queries:
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "data_schemas"
        | sort timestamp desc
        | limit 100
      description: Fetch the 100 most recent DSOA data_schemas plugin log entries (DDL change inventory) from Grail.
      description_copilot: Search for all data_schemas plugin logs from the Snowflake observability agent.
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "data_schemas"
        | filter snowflake.object.ddl.operation == "DROP"
        | sort timestamp desc
        | limit 50
      description: Fetch the 50 most recent DROP DDL operations reported by the data_schemas plugin.
      description_copilot: Find recent DROP DDL operations on Snowflake objects.
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "data_schemas"
        | filter snowflake.object.type == "Table"
        | sort timestamp desc
        | limit 50
      description: Fetch the 50 most recent DDL changes affecting Snowflake tables.
      description_copilot: Find recent table structure changes captured by the data_schemas plugin.
  groups:
    - id: snowflake.logs.data_schemas.fields
      type: attribute_group
      title: Data schemas log record fields
      brief: Attribute fields for Data Schemas log records.
      attributes:
        - ref: snowflake.object.ddl.modified
        - ref: snowflake.object.ddl.properties
        - ref: snowflake.object.id
        - ref: snowflake.object.name
        - ref: snowflake.query.parent_id
        - ref: snowflake.query.root_id
