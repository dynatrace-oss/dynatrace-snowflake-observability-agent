model:
  id: snowflake.logs.tasks
  title: Snowflake tasks log records
  brief: Log records emitted by the DSOA tasks plugin.
  model_group_id: snowflake.logs
  data_object: log
  interfaces: [i.dsoa_resource]
  dql_queries:
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "tasks"
        | sort timestamp desc
        | limit 100
      description: Fetch the 100 most recent DSOA tasks plugin log entries from Grail.
      description_copilot: Search for all tasks plugin logs from the Snowflake observability agent.
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "tasks"
        | filter snowflake.task.run.state == "FAILED"
        | fields timestamp, snowflake.task.name, snowflake.warehouse.name, snowflake.task.run.state
        | sort timestamp desc
        | limit 50
      description: Fetch log entries for failed Snowflake task runs.
      description_copilot: Search for failed Snowflake task runs in the tasks plugin logs.
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "tasks"
        | filter isNotNull(snowflake.task.name)
        | summarize { runs = count() }, by: { snowflake.task.name }
        | sort runs desc
        | limit 25
      description: Rank Snowflake tasks by number of recorded runs.
      description_copilot: Find which Snowflake tasks run most frequently.
  groups:
    - id: snowflake.logs.tasks.fields
      type: attribute_group
      title: Tasks log record fields
      brief: Attribute fields for Tasks log records.
      attributes:
        - ref: snowflake.task.condition
        - ref: snowflake.task.config.allow_overlap
        - ref: snowflake.task.config.id
        - ref: snowflake.task.end_time
        - ref: snowflake.task.error_integration
        - ref: snowflake.task.graph.root_id
        - ref: snowflake.task.graph.version
        - ref: snowflake.task.id
        - ref: snowflake.task.instance_id
        - ref: snowflake.task.last_committed_on
        - ref: snowflake.task.last_suspended_on
        - ref: snowflake.task.owner
        - ref: snowflake.task.predecessors
        - ref: snowflake.task.run.attempt
        - ref: snowflake.task.run.completed_time
        - ref: snowflake.task.run.group_id
        - ref: snowflake.task.run.id
        - ref: snowflake.task.run.return_value
        - ref: snowflake.task.run.scheduled_from
        - ref: snowflake.task.run.scheduled_time
        - ref: snowflake.task.run.state
        - ref: snowflake.task.schedule
        - ref: snowflake.task.start_time
