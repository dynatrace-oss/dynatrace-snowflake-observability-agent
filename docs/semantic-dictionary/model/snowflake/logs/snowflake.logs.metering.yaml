model:
  id: snowflake.logs.metering
  title: Snowflake metering log records
  brief: Log records emitted by the DSOA metering plugin.
  model_group_id: snowflake.logs
  data_object: log
  interfaces: [ i.dsoa_resource ]
  dql_queries:
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "metering"
        | sort timestamp desc
        | limit 100
      description: Fetch the 100 most recent DSOA metering plugin log entries from Grail.
      description_copilot: Search for all metering plugin logs from the Snowflake observability agent.
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "metering"
        | filter isNotNull(snowflake.service.name)
        | fields timestamp, snowflake.service.name, snowflake.service.type, snowflake.credits.used
        | sort timestamp desc
        | limit 50
      description: Inspect per-service credit consumption readings from the metering plugin.
      description_copilot: Show recent Snowflake per-service credit consumption from the metering plugin.
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "metering"
        | filter isNotNull(snowflake.service.name)
        | summarize { total_credits = sum(toDouble(snowflake.credits.used)) }, by: { snowflake.service.name }
        | sort total_credits desc
        | limit 25
      description: Rank Snowflake services by total metered credit consumption.
      description_copilot: Find which Snowflake services consume the most metered credits.
  groups:
    - id: snowflake.logs.metering.fields
      type: attribute_group
      title: Metering log record fields
      brief: Attribute fields for Metering log records.
      attributes:
        - ref: snowflake.service.entity_id
