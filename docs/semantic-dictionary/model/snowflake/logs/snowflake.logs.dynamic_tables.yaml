model:
  id: snowflake.logs.dynamic_tables
  title: Snowflake dynamic tables log records
  brief: Log records emitted by the DSOA dynamic_tables plugin.
  model_group_id: snowflake.logs
  data_object: log
  interfaces: [i.dsoa_resource]
  dql_queries:
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "dynamic_tables"
        | sort timestamp desc
        | limit 100
      description: Fetch the 100 most recent DSOA dynamic_tables plugin log entries from Grail.
      description_copilot: Search for all dynamic_tables plugin logs from the Snowflake observability agent.
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "dynamic_tables"
        | filter toDouble(snowflake.table.dynamic.lag.target.within_ratio) < 1.0
        | sort timestamp desc
        | limit 50
      description: Fetch dynamic table refreshes that missed their target lag (within-ratio below 1.0).
      description_copilot: Find Snowflake dynamic tables that failed to meet their target refresh lag.
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "dynamic_tables"
        | filter isNotNull(snowflake.table.full_name)
        | summarize { max_lag = takeMax(toLong(snowflake.table.dynamic.lag.max)) }, by: { snowflake.table.full_name }
        | sort max_lag desc
        | limit 25
      description: Rank dynamic tables by their maximum observed refresh lag.
      description_copilot: Find the Snowflake dynamic tables with the highest refresh lag.
  groups:
    - id: snowflake.logs.dynamic_tables.fields
      type: attribute_group
      title: Dynamic tables log record fields
      brief: Attribute fields for Dynamic Tables log records.
      attributes:
        - ref: snowflake.table.dynamic.graph.alter_trigger
        - ref: snowflake.table.dynamic.graph.inputs
        - ref: snowflake.table.dynamic.graph.valid_to
        - ref: snowflake.table.dynamic.lag.target.type
        - ref: snowflake.table.dynamic.latest.code
        - ref: snowflake.table.dynamic.latest.data_timestamp
        - ref: snowflake.table.dynamic.latest.dependency.data_timestamp
        - ref: snowflake.table.dynamic.latest.dependency.name
        - ref: snowflake.table.dynamic.latest.message
        - ref: snowflake.table.dynamic.latest.state
        - ref: snowflake.table.dynamic.refresh.action
        - ref: snowflake.table.dynamic.refresh.code
        - ref: snowflake.table.dynamic.refresh.completion_target
        - ref: snowflake.table.dynamic.refresh.data_timestamp
        - ref: snowflake.table.dynamic.refresh.end
        - ref: snowflake.table.dynamic.refresh.message
        - ref: snowflake.table.dynamic.refresh.start
        - ref: snowflake.table.dynamic.refresh.state
        - ref: snowflake.table.dynamic.refresh.trigger
        - ref: snowflake.table.dynamic.scheduling.reason.code
        - ref: snowflake.table.dynamic.scheduling.reason.message
        - ref: snowflake.table.dynamic.scheduling.state
