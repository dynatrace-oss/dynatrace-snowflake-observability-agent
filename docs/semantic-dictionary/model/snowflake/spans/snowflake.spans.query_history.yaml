model:
  id: snowflake.spans.query_history
  title: Snowflake query history spans
  brief: Span records emitted by the DSOA query_history plugin.
  model_group_id: snowflake.spans
  data_object: span
  interfaces: [ i.dsoa_resource ]
  dql_queries:
    - query_string: |
        fetch spans
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "query_history"
        | sort timestamp desc
        | limit 50
      description: Fetch the 50 most recent DSOA query_history spans (individual Snowflake query executions).
      description_copilot: Find query_history span traces produced by the Snowflake observability agent.
    - query_string: |
        fetch spans
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "query_history"
        | filter isNotNull(trace.id) and isNotNull(span.id)
        | fields trace.id, span.id, request.is_root_span, snowflake.query.id, start_time, end_time
        | sort start_time desc
        | limit 50
      description: Correlate DSOA query_history spans by trace.id/span.id to inspect the root span and timing for a Snowflake query execution.
      description_copilot: Find the trace and span identifiers for Snowflake query execution spans, including whether each is the root span.
    - query_string: |
        fetch spans
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "query_history"
        | expand span.events
        | filter contains(span.events.name, "snowflake.query.step")
        | fields snowflake.query.step.id, snowflake.query.step.operator.type, snowflake.query.step.operator.stats, span.events.timestamp
        | sort span.events.timestamp desc
        | limit 100
      description: Inspect Snowflake query-plan step/operator span events (snowflake.query.step.*) recorded on query_history spans.
      description_copilot: List query execution plan steps and operators recorded as span events on Snowflake query spans.
  groups:
    - id: snowflake.spans.query_history.fields
      type: attribute_group
      title: Query history span fields
      brief: Attribute fields for Query History spans.
      attributes:
        - ref: db.snowflake.tables
        - ref: db.snowflake.views
        - ref: dsoa.debug.span.events.added
        - ref: dsoa.debug.span.events.failed
        - ref: dsoa.plugins.query_history.obfuscation_mode
        - ref: dsoa.plugins.query_history.track_ddl_changes
        - ref: snowflake.cluster_number
        - ref: snowflake.cost_attribution.period_end
        - ref: snowflake.cost_attribution.period_start
        - ref: snowflake.database.id
        - ref: snowflake.object.ddl.operation
        - ref: snowflake.object.type
        - ref: snowflake.query.accel_est.estimated_query_times
        - ref: snowflake.query.accel_est.status
        - ref: snowflake.query.accel_est.upper_limit_scale_factor
        - ref: snowflake.query.data_transfer.inbound.cloud
        - ref: snowflake.query.data_transfer.inbound.region
        - ref: snowflake.query.data_transfer.outbound.cloud
        - ref: snowflake.query.data_transfer.outbound.region
        - ref: snowflake.query.is_client_generated
        - ref: snowflake.query.retry_cause
        - ref: snowflake.query.step.id
        - ref: snowflake.query.step.operator.attributes
        - ref: snowflake.query.step.operator.id
        - ref: snowflake.query.step.operator.parent_ids
        - ref: snowflake.query.step.operator.stats
        - ref: snowflake.query.step.operator.time_breakdown
        - ref: snowflake.query.step.operator.type
        - ref: snowflake.query.transaction_id
        - ref: snowflake.query.with_operator_stats
        - ref: snowflake.release_version
        - ref: snowflake.role.type
        - ref: snowflake.schema.id
        - ref: snowflake.secondary_role_stats
        - ref: snowflake.warehouse.cluster.number
        - ref: snowflake.warehouse.id
        - ref: snowflake.warehouse.size
        - ref: snowflake.warehouse.type
