model:
  id: snowflake.spans.event_log
  title: Snowflake event log spans
  brief: Span records emitted by the DSOA event_log plugin.
  model_group_id: snowflake.spans
  data_object: span
  interfaces: [i.dsoa_resource]
  dql_queries:
    - query_string: |
        fetch spans
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "event_log"
        | sort timestamp desc
        | limit 50
      description: Fetch the 50 most recent DSOA event_log spans (traced records from the Snowflake event table).
      description_copilot: Find event_log span traces produced by the Snowflake observability agent.
    - query_string: |
        fetch spans
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "event_log"
        | filter isNotNull(snowflake.query.id)
        | fields timestamp, snowflake.query.id, snowflake.warehouse.name, snowflake.role.name
        | sort timestamp desc
        | limit 50
      description: Inspect event_log spans correlated to a Snowflake query, including warehouse and role context.
      description_copilot: Show event_log spans linked to Snowflake queries with their warehouse and role.
    - query_string: |
        fetch spans
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "event_log"
        | filter isNotNull(snowflake.warehouse.name)
        | summarize { spans = count() }, by: { snowflake.warehouse.name }
        | sort spans desc
      description: Count event_log spans grouped by warehouse.
      description_copilot: Break down event_log spans by Snowflake warehouse.
  groups: []
