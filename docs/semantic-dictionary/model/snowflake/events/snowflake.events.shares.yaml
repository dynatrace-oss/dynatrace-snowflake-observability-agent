model:
  id: snowflake.events.shares
  title: Snowflake shares lifecycle events
  brief: Timestamp-based state-change events emitted by the Dynatrace Snowflake Observability Agent shares plugin via the OpenPipeline Events API.
  model_group_id: snowflake.events
  data_object: events
  interfaces: [ i.dsoa_resource ]
  dql_queries:
    - query_string: |
        fetch events
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "shares"
        | sort timestamp desc
        | limit 20
      description: Fetch recent Dynatrace Snowflake Observability Agent shares lifecycle events.
      description_copilot: Search for recent Snowflake shares lifecycle events from the shares plugin.
    - query_string: |
        fetch events
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "shares"
        | sort timestamp desc
        | limit 50
      description: Fetch the most recent Dynatrace Snowflake Observability Agent shares lifecycle events (share, grant and table creation anchors).
      description_copilot: Search for Snowflake share and grant lifecycle events from the shares plugin.
    - query_string: |
        fetch events
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "shares"
        | summarize { events = count() }, by: { snowflake.event.type }
        | sort events desc
      description: Count Dynatrace Snowflake Observability Agent shares lifecycle events grouped by event type.
      description_copilot: Break down Snowflake share lifecycle events by their event type.
  groups:
    - id: snowflake.events.shares.fields
      type: attribute_group
      title: Shares event fields
      attributes:
        - ref: snowflake.event.type
        - ref: snowflake.grant.created_on
        - ref: snowflake.share.created_on
        - ref: snowflake.table.created_on
