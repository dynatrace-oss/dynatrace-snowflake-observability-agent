model:
  id: dsoa.logs.snowpipes
  title: DSOA Snowpipes Log Records
  brief: Log records emitted by the DSOA snowpipes plugin.
  model_group_id: dsoa.logs
  data_object: log
  interfaces:
    - i.dsoa_resource
  dql_queries:
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "snowpipes"
        | sort timestamp desc
        | limit 100
      description: Fetch the 100 most recent DSOA snowpipes plugin log entries from Grail.
      description_copilot: Search for all snowpipes plugin logs from the Snowflake observability agent.
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "snowpipes"
        | filter toLong(snowflake.pipe.errors) > 0
        | fields timestamp, snowflake.pipe.name, snowflake.pipe.errors, snowflake.pipe.files.pending
        | sort timestamp desc
        | limit 50
      description: Fetch Snowpipe readings that reported ingestion errors.
      description_copilot: Find Snowflake pipes reporting ingestion errors.
    - query_string: |
        fetch logs
        | filter db.system == "snowflake"
        | filter dsoa.run.plugin == "snowpipes"
        | filter isNotNull(snowflake.pipe.name)
        | summarize { total_rows = sum(toLong(snowflake.pipe.rows.loaded)) }, by: { snowflake.pipe.name }
        | sort total_rows desc
        | limit 25
      description: Rank Snowpipes by total rows loaded.
      description_copilot: Find which Snowflake pipes have loaded the most rows.
  groups:
    - id: dsoa.logs.snowpipes.fields
      type: attribute_group
      title: Snowpipes log record fields
      brief: Attribute fields for Snowpipes log records.
      attributes:
        - ref: snowflake.copy.errors.limit
        - ref: snowflake.copy.file_name
        - ref: snowflake.copy.first_commit_time
        - ref: snowflake.copy.first_error.character_position
        - ref: snowflake.copy.first_error.column_name
        - ref: snowflake.copy.first_error.line_number
        - ref: snowflake.copy.first_error.message
        - ref: snowflake.copy.pipe.received_time
        - ref: snowflake.copy.stage_location
        - ref: snowflake.copy.status
        - ref: snowflake.pipe.definition
        - ref: snowflake.pipe.execution_state
        - ref: snowflake.pipe.invalid_reason
        - ref: snowflake.pipe.last_ingested_timestamp
        - ref: snowflake.pipe.last_received_message_timestamp
        - ref: snowflake.pipe.notification_channel
        - ref: snowflake.pipe.oldest_file_timestamp
        - ref: snowflake.pipe.usage.start_time
